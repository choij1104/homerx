역 질환을 악화시키며, 혈액 응고를 방해할 수 있습니다.","ja":"短期（最長6か月）の使用は多くの人で安全とみられますが、長期の安全性は不明です。最も多い副作用は不眠で、まれに重い発疹、肝障害、重いアレルギー反応があります。血糖を下げ、自己免疫疾患を悪化させ、血液凝固を妨げることがあります。"},"verified":"2026-10-22","id":"ginseng","category":"supplement_herbal","name":{"en":"Asian ginseng","ko":"인삼(고려인삼)","ja":"高麗人参（オタネニンジン）"},"uses":{"en":"Evidence is limited (mostly small, short studies). Small possible benefits for fatigue; blood sugar findings in diabetes are conflicting.","ko":"근거가 제한적입니다(대부분 작고 짧은 연구). 피로에 작은 효과 가능성이 있고, 당뇨 혈당에 대한 결과는 엇갈립니다.","ja":"根拠は限られています（多くは小規模で短期の研究）。疲労に小さな効果の可能性があり、糖尿病の血糖への結果はまちまちです。"},"sources":[{"title":"NCCIH — Asian Ginseng","url":"https://www.nccih.nih.gov/health/asian-ginseng"}],"kind":"supplement"},{"aka":["garlic","Kyolic","마늘","ニンニク"],"brands":["Kyolic","store brand garlic"],"active":[{"ingredient":"garlic","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Blood thinners, aspirin, or any other medicine; upcoming surgery","ko":"혈액 희석제, 아스피린, 다른 약; 예정된 수술","ja":"血液をさらさらにする薬、アスピリン、その他の薬；予定している手術"}],"stop_use":[],"key_warning":{"en":"Tell your doctor before surgery — garlic supplements may increase bleeding.","ko":"수술 전 의사에게 알리세요 — 마늘 보충제는 출혈을 늘릴 수 있습니다.","ja":"手術前に医師に伝えてください — ニンニクサプリは出血を増やすことがあります。"},"older_adults":null,"pregnancy":{"en":"Amounts above food levels may not be safe in pregnancy or breastfeeding.","ko":"음식보다 많은 양은 임신·수유 중 안전하지 않을 수 있습니다.","ja":"食事より多い量は妊娠・授乳中に安全でない可能性があります。"},"flags":["bleeding","blood_thinner","pregnancy"],"classes":[],"supplement_note":{"en":"Used safely in studies up to 7 years. Side effects: breath and body odor, belly pain, gas, nausea, allergic reactions. It may increase bleeding risk — important before surgery or with blood thinners or aspirin.","ko":"최대 7년 연구에서 안전하게 쓰였습니다. 부작용: 입·몸 냄새, 복통, 가스, 메스꺼움, 알레르기 반응. 출혈 위험을 높일 수 있으니 수술 전이나 혈액 희석제·아스피린 복용 시 중요합니다.","ja":"最長7年の研究で安全に使われています。副作用: 口臭・体臭、腹痛、ガス、吐き気、アレルギー反応。出血の危険を高めることがあり、手術前や抗凝固薬・アスピリン使用時に重要です。"},"verified":"2026-10-22","id":"garlic-supplement","category":"supplement_herbal","name":{"en":"Garlic supplement","ko":"마늘 보충제","ja":"ニンニクサプリ"},"uses":{"en":"May lower total and LDL cholesterol a small amount in people with high cholesterol, and blood pressure slightly in people with high blood pressure.","ko":"콜레스테롤이 높은 사람의 총·LDL 콜레스테롤을 조금, 고혈압인 사람의 혈압을 약간 낮출 수 있습니다.","ja":"コレステロールが高い人の総・LDLコレステロールを少し、高血圧の人の血圧をわずかに下げる可能性があります。"},"sources":[{"title":"NCCIH — Garlic","url":"https://www.nccih.nih.gov/health/garlic"}],"kind":"supplement"},{"aka":["cranberry pills","UTI","크랜베리","クランベリー"],"brands":["AZO Cranberry","store brand cranberry"],"active":[{"ingredient":"cranberry","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Warfarin or any other medicine","ko":"와파린이나 다른 약","ja":"ワルファリンやその他の薬"}],"stop_use":[],"key_warning":{"en":"If you think you have a UTI (burning, urgency, fever, back pain), see a provider — do not use cranberry instead of treatment.","ko":"요로감염이 의심되면(화끈거림, 급한 소변, 열, 허리 통증) 진료를 받으세요 — 치료 대신 크랜베리를 쓰지 마세요.","ja":"尿路感染症が疑われたら（しみる痛み、尿意切迫、発熱、腰の痛み）受診を — 治療の代わりにクランベリーを使わないでください。"},"older_adults":null,"pregnancy":null,"flags":["blood_thinner"],"classes":[],"supplement_note":{"en":"Very large amounts may cause stomach upset and diarrhea, especially in young children. Evidence on an interaction with warfarin is conflicting.","ko":"아주 많이 먹으면 특히 어린아이에게 속 불편과 설사가 생길 수 있습니다. 와파린과의 상호작용 근거는 엇갈립니다.","ja":"とても多くとると、特に幼い子どもで胃の不調や下痢が起こります。ワルファリンとの相互作用の根拠はまちまちです。"},"verified":"2026-10-22","id":"cranberry","category":"supplement_herbal","name":{"en":"Cranberry","ko":"크랜베리","ja":"クランベリー"},"uses":{"en":"May lower the chance of repeat urinary tract infections in some women (about 25% in studies), but results are inconsistent. It does not treat a UTI you already have.","ko":"일부 여성에서 요로감염 재발 가능성을 낮출 수 있으나(연구상 약 25%) 결과가 일정하지 않습니다. 이미 생긴 요로감염을 치료하지는 못합니다.","ja":"一部の女性で尿路感染症の再発を減らす可能性がありますが（研究で約25%）、結果は一定しません。すでにかかっている尿路感染症は治せません。"},"sources":[{"title":"NCCIH — Cranberry","url":"https://www.nccih.nih.gov/health/cranberry"}],"kind":"supplement"},{"aka":["EGCG","green tea pills","녹차추출물","緑茶カテキン"],"brands":["store brand green tea extract"],"active":[{"ingredient":"green tea extract (catechins, caffeine)","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Nadolol, atorvastatin, raloxifene, or any other medicine","ko":"나돌롤, 아토르바스타틴, 랄록시펜, 다른 약","ja":"ナドロール、アトルバスタチン、ラロキシフェン、その他の薬"}],"stop_use":[],"key_warning":{"en":"Liver injury has been reported with extract pills. Stop and see a doctor for dark urine, yellow skin or eyes, or belly pain.","ko":"추출물 알약에서 간 손상이 보고되었습니다. 짙은 소변, 피부·눈 황달, 복통이 있으면 중단하고 진료를 받으세요.","ja":"エキスの錠剤で肝障害が報告されています。濃い色の尿、皮膚・白目の黄色、腹痛があれば中止して受診を。"},"older_adults":null,"pregnancy":{"en":"Contains caffeine — keep caffeine moderate in pregnancy and ask your provider.","ko":"카페인이 들어 있습니다 — 임신 중 카페인은 적당히 하고 의료인에게 물어보세요.","ja":"カフェインを含みます — 妊娠中はカフェインを控えめにし、医療者に相談を。"},"flags":["liver","bp","heart"],"classes":[],"supplement_note":{"en":"Liver injury has been reported, mainly with green tea extract pills. Extracts can also cause nausea, constipation, belly discomfort and higher blood pressure. High doses can lower levels of nadolol (a heart medicine); extract can lower atorvastatin levels. Contains caffeine. Green tea as a drink has no reported safety concerns for adults.","ko":"주로 녹차 추출물 알약에서 간 손상이 보고되었습니다. 추출물은 메스꺼움, 변비, 복부 불편, 혈압 상승도 일으킬 수 있습니다. 고용량은 나돌롤(심장약) 농도를, 추출물은 아토르바스타틴 농도를 낮출 수 있습니다. 카페인이 들어 있습니다. 음료로 마시는 녹차는 성인에게 안전 문제가 보고되지 않았습니다.","ja":"主に緑茶エキスの錠剤で肝障害が報告されています。エキスは吐き気、便秘、腹部の不快感、血圧上昇も起こすことがあります。高用量はナドロール（心臓の薬）の濃度を、エキスはアトルバスタチンの濃度を下げることがあります。カフェインを含みます。飲み物としての緑茶は成人で安全上の問題は報告されていません。"},"verified":"2026-10-22","id":"green-tea-extract","category":"supplement_herbal","name":{"en":"Green tea extract","ko":"녹차 추출물","ja":"緑茶エキス"},"uses":{"en":"Taken for weight loss; catechins and caffeine may have only a modest effect.","ko":"체중 감량에 먹지만, 카테킨과 카페인의 효과는 크지 않을 수 있습니다.","ja":"減量目的でとられますが、カテキンとカフェインの効果はわずかなことがあります。"},"sources":[{"title":"NCCIH — Green Tea","url":"https://www.nccih.nih.gov/health/green-tea"}],"kind":"supplement"},{"aka":["prostate supplement","쏘팔메토","ノコギリヤシ"],"brands":["store brand saw palmetto"],"active":[{"ingredient":"saw palmetto","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Any medicine","ko":"모든 약","ja":"すべての薬"}],"stop_use":[],"key_warning":{"en":"New urinary problems in men need a doctor's check — do not rely on saw palmetto.","ko":"남성의 새로운 배뇨 문제는 진료가 필요합니다 — 쏘팔메토에 의존하지 마세요.","ja":"男性の新しい排尿の問題は受診が必要です — ノコギリヤシに頼らないでください。"},"older_adults":null,"pregnancy":{"en":"May be unsafe in pregnancy or breastfeeding.","ko":"임신·수유 중 안전하지 않을 수 있습니다.","ja":"妊娠・授乳中は安全でない可能性があります。"},"flags":["prostate"],"classes":[],"supplement_note":{"en":"Generally well tolerated (studies up to 3 years); mild, infrequent stomach symptoms, dizziness and headache. It does not appear to change PSA test results.","ko":"대체로 잘 견딥니다(최대 3년 연구). 드물게 가벼운 위장 증상, 어지러움, 두통. PSA 검사 결과를 바꾸지 않는 것으로 보입니다.","ja":"おおむね問題なく使えます（最長3年の研究）。まれに軽い胃腸症状、めまい、頭痛。PSA検査の結果は変えないようです。"},"verified":"2026-10-22","id":"saw-palmetto","category":"supplement_herbal","name":{"en":"Saw palmetto","ko":"쏘팔메토","ja":"ノコギリヤシ"},"uses":{"en":"Taken for urinary symptoms of an enlarged prostate, but research shows it is probably not helpful (little or no benefit).","ko":"전립선 비대로 인한 배뇨 증상에 먹지만, 연구상 아마 도움이 되지 않습니다(효과가 거의 없음).","ja":"前立腺肥大による排尿症状にとられますが、研究ではおそらく役に立ちません（効果はほとんどない）。"},"sources":[{"title":"NCCIH — Saw Palmetto","url":"https://www.nccih.nih.gov/health/saw-palmetto"}],"kind":"supplement"},{"aka":["creatine monohydrate","크레아틴","クレアチン"],"brands":["store brand creatine monohydrate"],"active":[{"ingredient":"creatine monohydrate","strength":"varies by product","purpose":{"en":"Dietary supplement","ko":"건강기능 보충제","ja":"サプリメント"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":{"en":"Performance supplements are generally for adults; teens should talk with a provider first.","ko":"운동 보충제는 일반적으로 성인용이며, 청소년은 먼저 의료인과 상의하세요.","ja":"運動用サプリは一般に成人向けで、10代は先に医療者に相談を。"},"do_not_use":[],"ask_doctor":[{"en":"Any medical condition","ko":"질환이 있는 경우","ja":"持病がある場合"}],"ask_pharmacist":[],"stop_use":[],"key_warning":{"en":"Expect a little water weight gain. Talk with a provider first if you have a medical condition.","ko":"약간의 수분 체중 증가가 정상입니다. 질환이 있다면 먼저 의료인과 상의하세요.","ja":"少しの水分による体重増加は普通です。持病があれば先に医療者に相談を。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":{"en":"Studies often used about 20 g a day (in 4 portions) for 5–7 days, then 3–5 g a day. Safe for healthy adults for weeks to months and seems safe for several years. Usually causes some weight gain from water; rarely muscle stiffness, cramps or stomach upset. Performance supplements are generally for adults only.","ko":"연구에서는 보통 5~7일간 하루 약 20 g(4번 나눠)을 먹은 뒤 하루 3~5 g을 먹었습니다. 건강한 성인에게 몇 주~몇 달 안전하며 수년간도 안전해 보입니다. 보통 수분 때문에 체중이 조금 늘고, 드물게 근육 뻣뻣함, 경련, 속 불편이 있습니다. 운동 보충제는 일반적으로 성인용입니다.","ja":"研究では5〜7日間1日約20 g（4回に分ける）、その後1日3〜5 gが多く使われました。健康な成人で数週〜数か月安全で、数年も安全とみられます。水分で体重が少し増えるのが普通で、まれに筋肉のこわばり、けいれん、胃の不調があります。運動用サプリは一般に成人向けです。"},"verified":"2026-10-22","id":"creatine","category":"supplement_other","name":{"en":"Creatine","ko":"크레아틴","ja":"クレアチン"},"uses":{"en":"Can increase strength and power for repeated short bursts of intense activity (such as sprinting or weight lifting); little value for endurance exercise.","ko":"짧고 강한 운동을 반복할 때(단거리 달리기, 웨이트) 근력과 순발력을 높일 수 있으며, 지구력 운동에는 거의 도움이 되지 않습니다.","ja":"短く激しい運動のくり返し（短距離走、ウエイトトレーニング）で筋力とパワーを高めることがあり、持久運動にはほとんど役立ちません。"},"sources":[{"title":"NIH Office of Dietary Supplements — Dietary Supplements for Exercise and Athletic Performance (consumer)","url":"https://ods.od.nih.gov/pdf/factsheets/ExercisePerformance-Consumer.pdf"}],"kind":"supplement"},{"aka":["vitamin D3","cholecalciferol","비타민D","ビタミンD"],"brands":["Nature Made D3","Kirkland D3","store brand vitamin D3"],"active":[{"ingredient":"vitamin d","strength":"varies by product (IU or mcg)","purpose":{"en":"Vitamin","ko":"비타민","ja":"ビタミン"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit for adults (food + supplements): 100 mcg (4,000 IU) a day, unless a clinician prescribes more for a deficiency.","ko":"성인 상한(음식+보충제): 하루 100 mcg(4,000 IU). 결핍 치료로 의료인이 더 처방한 경우는 예외.","ja":"成人の上限（食事+サプリ）: 1日100 mcg（4,000 IU）。欠乏の治療で医療者がそれ以上を処方した場合は別。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Orlistat (alli, Xenical), statins (atorvastatin, simvastatin, lovastatin), steroids such as prednisone, or thiazide water pills (high blood calcium risk)","ko":"오를리스타트(알리, 제니칼), 스타틴(아토르바스타틴, 심바스타틴, 로바스타틴), 프레드니손 같은 스테로이드, 티아지드 이뇨제(혈중 칼슘 과다 위험)","ja":"オルリスタット、スタチン（アトルバスタチン、シンバスタチン、ロバスタチン）、プレドニゾンなどのステロイド、チアジド系利尿薬（血中カルシウム過多の危険）"}],"stop_use":[],"key_warning":{"en":"More is not better — stay under 4,000 IU a day unless your clinician prescribes a higher dose.","ko":"많이 먹는다고 좋은 것이 아닙니다 — 의료인이 더 높은 용량을 처방하지 않았다면 하루 4,000 IU를 넘기지 마세요.","ja":"多ければ良いわけではありません — 医療者がそれ以上を処方していなければ1日4,000 IUを超えないでください。"},"older_adults":null,"pregnancy":null,"flags":["kidney"],"classes":[],"supplement_note":{"en":"Recommended amount: 15 mcg (600 IU) a day for adults 19–70, 20 mcg (800 IU) for 71+. Older adults, people with dark skin or little sun exposure, and people with Crohn's, celiac disease, ulcerative colitis, obesity or gastric bypass may need more. Too much (usually from supplements) can cause nausea, vomiting, weakness, confusion, thirst, kidney stones, and in extreme cases kidney failure and irregular heartbeat.","ko":"권장량: 19~70세 하루 15 mcg(600 IU), 71세 이상 20 mcg(800 IU). 노인, 피부가 어둡거나 햇빛을 적게 쬐는 사람, 크론병·셀리악병·궤양성 대장염, 비만, 위우회술을 받은 사람은 더 필요할 수 있습니다. 너무 많으면(대개 보충제 때문) 메스꺼움, 구토, 쇠약, 혼란, 갈증, 신장결석, 극단적으로는 신부전과 부정맥이 생길 수 있습니다.","ja":"推奨量: 19〜70歳は1日15 mcg（600 IU）、71歳以上は20 mcg（800 IU）。高齢者、肌の色が濃い・日光にあまり当たらない人、クローン病・セリアック病・潰瘍性大腸炎、肥満、胃バイパス術後の人はより多く必要なことがあります。とりすぎ（多くはサプリによる）で吐き気、嘔吐、脱力、混乱、のどの渇き、腎結石、極端な場合は腎不全や不整脈が起こります。"},"verified":"2026-10-22","id":"vitamin-d","category":"supplement_vitamin","name":{"en":"Vitamin D","ko":"비타민 D","ja":"ビタミンD"},"uses":{"en":"Helps the body absorb calcium for bones.","ko":"뼈를 위해 칼슘 흡수를 돕습니다.","ja":"骨のためにカルシウムの吸収を助けます。"},"sources":[{"title":"NIH Office of Dietary Supplements — Vitamin D Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/VitaminD-Consumer/"}],"kind":"supplement"},{"aka":["calcium citrate","calcium carbonate","Citracal","Caltrate","칼슘","カルシウム"],"brands":["Caltrate","Citracal","store brand calcium"],"active":[{"ingredient":"calcium (carbonate or citrate)","strength":"varies by product","purpose":{"en":"Mineral","ko":"미네랄","ja":"ミネラル"}}],"directions_adult":{"en":"Take no more than 500 mg at one time; split larger amounts. Calcium carbonate is best absorbed with food; calcium citrate works with or without food and is easier to absorb if you have low stomach acid.","ko":"한 번에 500 mg 이하로 드시고 그 이상은 나누어 드세요. 탄산칼슘은 음식과 함께 먹을 때 흡수가 잘 되고, 구연산칼슘은 공복에도 잘 흡수되며 위산이 적은 사람에게 더 낫습니다.","ja":"1回500 mg以下にし、それ以上は分けて飲む。炭酸カルシウムは食事と一緒だとよく吸収され、クエン酸カルシウムは空腹時でも吸収され、胃酸が少ない人に向いています。"},"max_daily":{"en":"Upper limit (food + supplements): 2,500 mg a day for ages 19–50; 2,000 mg for 51+.","ko":"상한(음식+보충제): 19~50세 하루 2,500 mg, 51세 이상 2,000 mg.","ja":"上限（食事+サプリ）: 19〜50歳は1日2,500 mg、51歳以上は2,000 mg。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Levothyroxine (separate by 4 hours), quinolone antibiotics such as ciprofloxacin (separate by 2 hours), dolutegravir (take it 2 hours before or 6 hours after calcium), or lithium","ko":"레보티록신(4시간 간격), 시프로플록사신 같은 퀴놀론 항생제(2시간 간격), 돌루테그라비르(칼슘 2시간 전 또는 6시간 후), 리튬","ja":"レボチロキシン（4時間あける）、シプロフロキサシンなどのキノロン系抗菌薬（2時間あける）、ドルテグラビル（カルシウムの2時間前か6時間後）、リチウム"}],"stop_use":[],"key_warning":{"en":"Calcium blocks absorption of thyroid pills and some antibiotics — space them apart.","ko":"칼슘은 갑상선약과 일부 항생제의 흡수를 막습니다 — 시간 간격을 두세요.","ja":"カルシウムは甲状腺の薬や一部の抗菌薬の吸収を妨げます — 時間をあけてください。"},"older_adults":null,"pregnancy":null,"flags":["thyroid","kidney"],"classes":[],"supplement_note":{"en":"Recommended amount: 1,000 mg a day for adults 19–50 and men 51–70; 1,200 mg for women 51+ and everyone 71+ (from food and supplements together). Very high intakes may be linked to heart disease and prostate cancer risk in some studies.","ko":"권장량(음식+보충제 합계): 19~50세와 51~70세 남성 하루 1,000 mg, 51세 이상 여성과 71세 이상 모두 1,200 mg. 일부 연구에서 매우 많은 섭취가 심장병·전립선암 위험과 관련될 수 있다고 합니다.","ja":"推奨量（食事+サプリの合計）: 19〜50歳と51〜70歳男性は1日1,000 mg、51歳以上の女性と71歳以上は1,200 mg。とても多い摂取は一部の研究で心臓病や前立腺がんのリスクと関連する可能性があります。"},"verified":"2026-10-22","id":"calcium-supplement","category":"supplement_mineral","name":{"en":"Calcium","ko":"칼슘","ja":"カルシウム"},"uses":{"en":"Builds and maintains bones and teeth.","ko":"뼈와 치아를 만들고 유지합니다.","ja":"骨と歯をつくり維持します。"},"sources":[{"title":"NIH Office of Dietary Supplements — Calcium Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Calcium-Consumer/"}],"kind":"supplement"},{"aka":["cobalamin","methylcobalamin","cyanocobalamin","비타민B12"],"brands":["Nature Made B12","store brand B12"],"active":[{"ingredient":"vitamin b12","strength":"varies by product (mcg)","purpose":{"en":"Vitamin","ko":"비타민","ja":"ビタミン"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"No upper limit has been set; B12 has not been shown to cause harm even at high doses.","ko":"상한이 정해져 있지 않으며, 고용량에서도 해가 보고되지 않았습니다.","ja":"上限は定められておらず、高用量でも害は示されていません。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Long-term acid reducers (omeprazole, lansoprazole, famotidine-type medicines) or metformin — they can lower B12; ask whether to check your level","ko":"장기간 위산 억제제(오메프라졸, 란소프라졸 등) 또는 메트포르민 — B12를 낮출 수 있으니 수치 검사를 물어보세요","ja":"胃酸を抑える薬（オメプラゾール、ランソプラゾールなど）の長期服用やメトホルミン — B12を下げることがあるので検査について相談を"}],"stop_use":[],"key_warning":{"en":"If you take metformin or an acid reducer long term, ask your clinician about checking B12.","ko":"메트포르민이나 위산 억제제를 오래 먹고 있다면 B12 검사를 의료인에게 물어보세요.","ja":"メトホルミンや胃酸を抑える薬を長く飲んでいるなら、B12の検査を医療者に相談してください。"},"older_adults":null,"pregnancy":null,"flags":["seniors","diabetes"],"classes":[],"supplement_note":{"en":"Recommended amount: 2.4 mcg a day for adults. Low B12 is common in older adults (less stomach acid), people with pernicious anemia, atrophic gastritis, stomach or bowel surgery, celiac or Crohn's disease, and vegans or vegetarians.","ko":"권장량: 성인 하루 2.4 mcg. 노인(위산 감소), 악성 빈혈, 위축성 위염, 위·장 수술, 셀리악병·크론병, 채식주의자에게 부족이 흔합니다.","ja":"推奨量: 成人1日2.4 mcg。高齢者（胃酸の減少）、悪性貧血、萎縮性胃炎、胃や腸の手術後、セリアック病・クローン病、ベジタリアン・ヴィーガンで不足しがちです。"},"verified":"2026-10-22","id":"vitamin-b12","category":"supplement_vitamin","name":{"en":"Vitamin B12","ko":"비타민 B12","ja":"ビタミンB12"},"uses":{"en":"Needed for nerves, blood cells and DNA.","ko":"신경, 혈액 세포, DNA에 필요합니다.","ja":"神経、血液細胞、DNAに必要です。"},"sources":[{"title":"NIH Office of Dietary Supplements — Vitamin B12 Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/VitaminB12-Consumer/"}],"kind":"supplement"},{"aka":["ferrous sulfate","iron pills","철분제","鉄剤"],"brands":["Feosol","Slow Fe","store brand ferrous sulfate"],"active":[{"ingredient":"iron (ferrous sulfate and others)","strength":"varies by product","purpose":{"en":"Mineral","ko":"미네랄","ja":"ミネラル"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit for adults (all sources): 45 mg a day, unless a doctor prescribes more for a short time to treat deficiency.","ko":"성인 상한(모든 섭취원): 하루 45 mg. 결핍 치료로 의사가 잠시 더 처방한 경우는 예외.","ja":"成人の上限（すべての摂取源）: 1日45 mg。欠乏の治療で医師が短期間それ以上を処方した場合は別。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Levothyroxine or levodopa (iron lowers their effect — space doses apart), acid reducers (PPIs), or calcium supplements (take at different times)","ko":"레보티록신이나 레보도파(효과 감소 — 시간 간격), 위산 억제제(PPI), 칼슘 보충제(다른 시간에)","ja":"レボチロキシンやレボドパ（効果が下がる — 時間をあける）、胃酸を抑える薬（PPI）、カルシウムサプリ（別の時間に）"}],"stop_use":[],"key_warning":{"en":"Accidental iron overdose is a leading cause of fatal poisoning in children under 6. Keep iron locked away from children.","ko":"철분 과다 복용 사고는 6세 미만 아이의 치명적 중독의 주요 원인입니다. 아이 손이 닿지 않게 잠가 두세요.","ja":"鉄の誤飲は6歳未満の子どもの死亡中毒の主な原因です。子どもの手の届かない所に保管してください。"},"older_adults":null,"pregnancy":null,"flags":["children","thyroid","stomach"],"classes":[],"supplement_note":{"en":"Recommended amount: 8 mg a day for men and for women 51+; 18 mg for women 19–50; 27 mg in pregnancy. Women with heavy periods, pregnant women, frequent blood donors, and people with cancer, bowel disorders or heart failure may need more. High doses can cause upset stomach, constipation, nausea, belly pain, vomiting and diarrhea. People with hemochromatosis should avoid iron supplements.","ko":"권장량: 남성과 51세 이상 여성 하루 8 mg, 19~50세 여성 18 mg, 임신 중 27 mg. 생리량이 많은 여성, 임신부, 헌혈을 자주 하는 사람, 암·장 질환·심부전 환자는 더 필요할 수 있습니다. 고용량은 속 불편, 변비, 메스꺼움, 복통, 구토, 설사를 일으킬 수 있습니다. 혈색소증이 있으면 철분 보충제를 피하세요.","ja":"推奨量: 男性と51歳以上の女性は1日8 mg、19〜50歳の女性は18 mg、妊娠中は27 mg。月経量の多い女性、妊婦、頻回の献血者、がん・腸の病気・心不全の人はより多く必要なことがあります。高用量では胃の不快感、便秘、吐き気、腹痛、嘔吐、下痢が起こります。ヘモクロマトーシスの人は鉄サプリを避けてください。"},"verified":"2026-10-22","id":"iron-supplement","category":"supplement_mineral","name":{"en":"Iron","ko":"철분","ja":"鉄"},"uses":{"en":"Needed to make hemoglobin, which carries oxygen in the blood.","ko":"혈액에서 산소를 운반하는 헤모글로빈을 만드는 데 필요합니다.","ja":"血液で酸素を運ぶヘモグロビンをつくるのに必要です。"},"sources":[{"title":"NIH Office of Dietary Supplements — Iron Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Iron-Consumer/"}],"kind":"supplement"},{"aka":["magnesium oxide","magnesium citrate","magnesium glycinate","마그네슘"],"brands":["Nature Made Magnesium","store brand magnesium"],"active":[{"ingredient":"magnesium","strength":"varies by product","purpose":{"en":"Mineral","ko":"미네랄","ja":"ミネラル"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit from supplements and medicines (not food): 350 mg a day for adults.","ko":"보충제·약에서의 상한(음식 제외): 성인 하루 350 mg.","ja":"サプリと薬からの上限（食事は除く）: 成人1日350 mg。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Osteoporosis medicines (bisphosphonates) or antibiotics — take them apart from magnesium; water pills; long-term acid-reflux medicine","ko":"골다공증약(비스포스포네이트)이나 항생제 — 마그네슘과 시간 간격; 이뇨제; 장기간 역류성 식도염 약","ja":"骨粗しょう症の薬（ビスホスホネート）や抗菌薬 — マグネシウムと時間をあける；利尿薬；長期の逆流性食道炎の薬"}],"stop_use":[],"key_warning":{"en":"Stay under 350 mg a day from supplements unless your clinician advises more.","ko":"의료인의 권고가 없다면 보충제로는 하루 350 mg 이하로 드세요.","ja":"医療者の助言がなければ、サプリでは1日350 mg以下にしてください。"},"older_adults":null,"pregnancy":null,"flags":["kidney"],"classes":[],"supplement_note":{"en":"Recommended amount (all sources): 400–420 mg a day for men, 310–320 mg for women. Too much from supplements can cause diarrhea, nausea and cramping; extremely high intakes can cause irregular heartbeat.","ko":"권장량(모든 섭취원): 남성 하루 400~420 mg, 여성 310~320 mg. 보충제로 너무 많이 먹으면 설사, 메스꺼움, 복부 경련이, 극단적으로 많으면 부정맥이 생길 수 있습니다.","ja":"推奨量（すべての摂取源）: 男性1日400〜420 mg、女性310〜320 mg。サプリでとりすぎると下痢、吐き気、腹部のけいれん、極端に多いと不整脈が起こります。"},"verified":"2026-10-22","id":"magnesium-supplement","category":"supplement_mineral","name":{"en":"Magnesium","ko":"마그네슘","ja":"マグネシウム"},"uses":{"en":"Needed for muscles, nerves, blood sugar, blood pressure and bones.","ko":"근육, 신경, 혈당, 혈압, 뼈에 필요합니다.","ja":"筋肉、神経、血糖、血圧、骨に必要です。"},"sources":[{"title":"NIH Office of Dietary Supplements — Magnesium Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Magnesium-Consumer/"}],"kind":"supplement"},{"aka":["omega-3","fish oil","오메가3","オメガ3"],"brands":["Nature Made Fish Oil","Nordic Naturals","store brand fish oil"],"active":[{"ingredient":"epa and dha","strength":"varies by product","purpose":{"en":"Omega-3 fatty acids","ko":"오메가-3 지방산","ja":"オメガ3脂肪酸"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"FDA advises no more than 5 g a day of EPA + DHA from supplements.","ko":"FDA는 보충제로 EPA+DHA를 하루 5 g 넘게 먹지 않도록 권고합니다.","ja":"FDAはサプリからのEPA+DHAを1日5 g以下にするよう勧めています。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Warfarin or other blood thinners (high doses may increase bleeding)","ko":"와파린 등 혈액 희석제(고용량은 출혈 증가 가능)","ja":"ワルファリンなど血液をさらさらにする薬（高用量で出血が増えることがあります）"}],"stop_use":[],"key_warning":{"en":"If you take a blood thinner, ask before using high-dose fish oil.","ko":"혈액 희석제를 먹고 있다면 고용량 피시오일 전에 물어보세요.","ja":"血液をさらさらにする薬を飲んでいれば、高用量のフィッシュオイルの前に相談を。"},"older_adults":null,"pregnancy":null,"flags":["bleeding","blood_thinner"],"classes":[],"supplement_note":{"en":"The American Heart Association suggests about 1 g a day of EPA + DHA for people with heart disease, preferably from oily fish, and does not recommend supplements for people without high heart risk. Research on cancer, memory, dry eye and arthritis is mixed. Side effects are usually mild: bad taste, bad breath, heartburn, nausea, stomach upset, diarrhea, headache.","ko":"미국심장협회는 심장병이 있는 사람에게 EPA+DHA 하루 약 1 g(가능하면 기름진 생선으로)을 제안하며, 심장 위험이 높지 않은 사람에게는 보충제를 권하지 않습니다. 암, 기억력, 안구건조, 관절염에 대한 연구 결과는 엇갈립니다. 부작용은 대개 가벼우며 입안의 불쾌한 맛, 입냄새, 속쓰림, 메스꺼움, 속 불편, 설사, 두통입니다.","ja":"米国心臓協会は心臓病のある人にEPA+DHA 1日約1 g（できれば脂ののった魚から）を提案し、心臓リスクが高くない人にはサプリを勧めていません。がん、記憶、ドライアイ、関節炎の研究結果はまちまちです。副作用は多くは軽く、口の中の不快な味、口臭、胸やけ、吐き気、胃の不快感、下痢、頭痛です。"},"verified":"2026-10-22","id":"fish-oil","category":"supplement_other","name":{"en":"Fish oil (omega-3: EPA and DHA)","ko":"피시오일(오메가-3: EPA·DHA)","ja":"フィッシュオイル（オメガ3: EPA・DHA）"},"uses":{"en":"Higher EPA and DHA lowers triglycerides. Eating fatty fish is linked to heart health.","ko":"EPA·DHA를 더 많이 섭취하면 중성지방이 낮아집니다. 기름진 생선을 먹는 것은 심장 건강과 관련이 있습니다.","ja":"EPA・DHAを多くとると中性脂肪が下がります。脂ののった魚を食べることは心臓の健康と関連しています。"},"sources":[{"title":"NIH Office of Dietary Supplements — Omega-3 Fatty Acids Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-Consumer/"}],"kind":"supplement"},{"aka":["folate","vitamin B9","엽산","葉酸"],"brands":["Nature Made Folic Acid","store brand folic acid"],"active":[{"ingredient":"folic acid","strength":"varies by product (mcg DFE)","purpose":{"en":"Vitamin","ko":"비타민","ja":"ビタミン"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit from supplements and fortified foods: 1,000 mcg a day for adults.","ko":"보충제·강화식품에서의 상한: 성인 하루 1,000 mcg.","ja":"サプリと強化食品からの上限: 成人1日1,000 mcg。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Methotrexate, seizure medicines (phenytoin, carbamazepine, valproate), or sulfasalazine","ko":"메토트렉세이트, 경련약(페니토인, 카르바마제핀, 발프로산), 설파살라진","ja":"メトトレキサート、てんかんの薬（フェニトイン、カルバマゼピン、バルプロ酸）、スルファサラジン"}],"stop_use":[],"key_warning":{"en":"If you take seizure medicine or methotrexate, ask before taking folic acid.","ko":"경련약이나 메토트렉세이트를 먹고 있다면 엽산 전에 물어보세요.","ja":"てんかんの薬やメトトレキサートを飲んでいれば、葉酸の前に相談を。"},"older_adults":null,"pregnancy":{"en":"Recommended: 600 mcg DFE a day during pregnancy.","ko":"임신 중 권장량: 하루 600 mcg DFE.","ja":"妊娠中の推奨量: 1日600 mcg DFE。"},"flags":["pregnancy"],"classes":[],"supplement_note":{"en":"Recommended amount: 400 mcg DFE a day for adults, 600 in pregnancy, 500 while breastfeeding. Women who could become pregnant should get 400 mcg of folic acid a day from supplements or fortified foods, in addition to food folate. Large doses can hide a B12 deficiency, which can lead to permanent nerve damage.","ko":"권장량: 성인 하루 400 mcg DFE, 임신 중 600, 수유 중 500. 임신 가능성이 있는 여성은 음식 엽산 외에 보충제나 강화식품으로 하루 400 mcg 엽산을 섭취해야 합니다. 고용량은 B12 결핍을 가려 영구적인 신경 손상으로 이어질 수 있습니다.","ja":"推奨量: 成人1日400 mcg DFE、妊娠中600、授乳中500。妊娠の可能性がある女性は、食事の葉酸に加えてサプリや強化食品から1日400 mcgの葉酸をとるべきです。大量に飲むとB12欠乏が隠れ、永続的な神経障害につながることがあります。"},"verified":"2026-10-22","id":"folic-acid","category":"supplement_vitamin","name":{"en":"Folic acid (folate)","ko":"엽산","ja":"葉酸"},"uses":{"en":"Needed to make DNA and cells; helps prevent birth defects of the brain and spine.","ko":"DNA와 세포를 만드는 데 필요하며, 뇌·척추 선천 결손 예방에 도움이 됩니다.","ja":"DNAや細胞をつくるのに必要で、脳・脊椎の先天異常の予防に役立ちます。"},"sources":[{"title":"NIH Office of Dietary Supplements — Folate Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Folate-Consumer/"}],"kind":"supplement"},{"aka":["ascorbic acid","Emergen-C","비타민C"],"brands":["Emergen-C","store brand vitamin C"],"active":[{"ingredient":"vitamin c (ascorbic acid)","strength":"varies by product","purpose":{"en":"Vitamin","ko":"비타민","ja":"ビタミン"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit for adults (all sources): 2,000 mg a day.","ko":"성인 상한(모든 섭취원): 하루 2,000 mg.","ja":"成人の上限（すべての摂取源）: 1日2,000 mg。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Chemotherapy or radiation — check with your cancer team first; statin + niacin","ko":"항암치료나 방사선 치료 — 먼저 담당 암 치료팀에 확인; 스타틴+니아신","ja":"抗がん剤や放射線治療 — まずがん治療チームに確認；スタチン+ナイアシン"}],"stop_use":[],"key_warning":{"en":"High-dose vitamin C does not cure colds and can upset the stomach.","ko":"고용량 비타민 C는 감기를 낫게 하지 않으며 배탈을 일으킬 수 있습니다.","ja":"高用量のビタミンCはかぜを治さず、おなかをこわすことがあります。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":{"en":"Recommended amount: 90 mg a day for men, 75 mg for women; smokers add 35 mg. For most people it does not prevent colds; regular users may have slightly shorter or milder colds, and starting after symptoms begin does not appear to help. Too much can cause diarrhea, nausea and cramps; people with hemochromatosis should avoid high doses.","ko":"권장량: 남성 하루 90 mg, 여성 75 mg, 흡연자는 35 mg 추가. 대부분의 사람에게 감기 예방 효과는 없으며, 꾸준히 먹는 사람은 감기가 약간 짧거나 가벼울 수 있고, 증상이 시작된 뒤 먹는 것은 도움이 되지 않는 것으로 보입니다. 너무 많으면 설사, 메스꺼움, 복부 경련이 생기며 혈색소증 환자는 고용량을 피해야 합니다.","ja":"推奨量: 男性1日90 mg、女性75 mg、喫煙者は35 mg追加。多くの人でかぜの予防効果はなく、日常的に飲む人はかぜが少し短く軽くなる可能性がありますが、症状が出てから飲み始めても役立たないようです。とりすぎると下痢、吐き気、腹部のけいれん。ヘモクロマトーシスの人は高用量を避けてください。"},"verified":"2026-10-22","id":"vitamin-c","category":"supplement_vitamin","name":{"en":"Vitamin C","ko":"비타민 C","ja":"ビタミンC"},"uses":{"en":"An antioxidant needed for skin, wound healing and iron absorption.","ko":"피부, 상처 회복, 철분 흡수에 필요한 항산화제입니다.","ja":"皮膚、傷の治り、鉄の吸収に必要な抗酸化物質です。"},"sources":[{"title":"NIH Office of Dietary Supplements — Vitamin C Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/VitaminC-Consumer/"}],"kind":"supplement"},{"aka":["zinc lozenges","Cold-EEZE","아연","亜鉛"],"brands":["Cold-EEZE","store brand zinc"],"active":[{"ingredient":"zinc","strength":"varies by product","purpose":{"en":"Mineral","ko":"미네랄","ja":"ミネラル"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"Upper limit for adults (all sources): 40 mg a day.","ko":"성인 상한(모든 섭취원): 하루 40 mg.","ja":"成人の上限（すべての摂取源）: 1日40 mg。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Quinolone or tetracycline antibiotics (take the antibiotic 2 hours before or 4–6 hours after zinc), penicillamine, or thiazide water pills","ko":"퀴놀론·테트라사이클린 항생제(아연 2시간 전 또는 4~6시간 후에 항생제), 페니실라민, 티아지드 이뇨제","ja":"キノロン系・テトラサイクリン系抗菌薬（亜鉛の2時間前か4〜6時間後に抗菌薬）、ペニシラミン、チアジド系利尿薬"}],"stop_use":[],"key_warning":{"en":"Stay under 40 mg a day. Separate zinc from antibiotics.","ko":"하루 40 mg 이하로 드시고, 항생제와 시간 간격을 두세요.","ja":"1日40 mg以下に。抗菌薬とは時間をあけてください。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":{"en":"Recommended amount: 11 mg a day for men, 8 mg for women. Some studies suggest zinc lozenges or syrup started at the first sign of a cold speed recovery, but they do not seem to make symptoms milder. Too much causes nausea, dizziness, headache, vomiting and loss of appetite; long-term excess can lower copper and immunity.","ko":"권장량: 남성 하루 11 mg, 여성 8 mg. 일부 연구에서 감기 초기에 아연 트로키나 시럽을 시작하면 회복이 빨라진다고 하지만 증상을 가볍게 하지는 않는 것 같습니다. 너무 많으면 메스꺼움, 어지러움, 두통, 구토, 식욕 저하가 생기고, 오래 과다하면 구리와 면역이 떨어질 수 있습니다.","ja":"推奨量: 男性1日11 mg、女性8 mg。かぜのひき始めに亜鉛トローチやシロップを始めると回復が早まるとする研究もありますが、症状を軽くはしないようです。とりすぎると吐き気、めまい、頭痛、嘔吐、食欲低下。長期の過剰で銅や免疫が低下することがあります。"},"verified":"2026-10-22","id":"zinc-supplement","category":"supplement_mineral","name":{"en":"Zinc","ko":"아연","ja":"亜鉛"},"uses":{"en":"Needed for immunity, wound healing, and taste and smell.","ko":"면역, 상처 회복, 미각과 후각에 필요합니다.","ja":"免疫、傷の治り、味覚と嗅覚に必要です。"},"sources":[{"title":"NIH Office of Dietary Supplements — Zinc Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/Zinc-Consumer/"}],"kind":"supplement"},{"aka":["vitamin B7","hair and nail vitamin","비오틴","ビオチン"],"brands":["store brand biotin","hair-skin-nail vitamins"],"active":[{"ingredient":"biotin","strength":"varies by product (often far above daily needs)","purpose":{"en":"Vitamin","ko":"비타민","ja":"ビタミン"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":{"en":"No upper limit has been set.","ko":"상한이 정해져 있지 않습니다.","ja":"上限は定められていません。"},"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Seizure medicines","ko":"경련약","ja":"てんかんの薬"}],"stop_use":[],"key_warning":{"en":"Tell your doctor or lab you take biotin before blood tests — it can make some results wrong.","ko":"혈액검사 전 비오틴을 먹고 있다고 의사나 검사실에 알리세요 — 일부 결과가 틀릴 수 있습니다.","ja":"血液検査の前にビオチンを飲んでいることを医師や検査室に伝えてください — 一部の結果が誤ることがあります。"},"older_adults":null,"pregnancy":null,"flags":["thyroid"],"classes":[],"supplement_note":{"en":"Recommended amount: 30 mcg a day for adults (35 mcg while breastfeeding). Biotin above the recommended amount can cause false results on some lab tests, such as thyroid hormone tests. Long-term seizure medicines can lower biotin levels.","ko":"권장량: 성인 하루 30 mcg(수유 중 35 mcg). 권장량보다 많은 비오틴은 갑상선 호르몬 같은 일부 혈액검사 결과를 틀리게 만들 eakness, severe allergy, overdose, or suicidal thoughts: call 911. Poison help: 1-800-222-1222. Mental health crisis: 988.","eyebrow":"For immigrants, elders, families, and community organizations","heroTitle":"Understand common U.S. pharmacy medicines safely, even when English is hard.","heroLead":"HomeRx is a free multilingual education guide for U.S. over-the-counter medicines and dietary supplements used for common symptoms such as colds, allergies, pain, heartburn, diarrhea, and constipation. It is not diagnosis or prescribing. It helps people ask safer questions at the pharmacy.","startSymptoms":"Browse by symptom","startSupplements":"Supplement safety","startPhrases":"Phrases for pharmacists","quickTitle":"Check first","quickUrgent":"When to seek urgent care","quickOlder":"Older adults and chronic conditions","quickDuplicate":"Duplicate ingredient risk","quickSupplements":"Supplements are not approved like drugs","notice1Title":"Purpose","notice1":"Helps immigrants, elders, caregivers, and students understand U.S. pharmacy labels and ingredient names.","notice2Title":"Safety","notice2":"If you take blood pressure, diabetes, blood thinner, sleep, or depression medicines, ask a pharmacist before using OTC products or supplements.","notice3Title":"Duplicate ingredients","notice3":"Cold, pain, and sleep products can overlap in acetaminophen, NSAIDs, or antihistamines.","searchLabel":"Search","searchPlaceholder":"Search symptom, ingredient, brand: Tylenol, ibuprofen, dizziness, gout, motion sickness","symptomTitle":"OTC guide by symptom","symptomIntro":"Many common symptoms can be helped by OTC products, but severe or persistent symptoms need medical care. This guide supports pharmacy conversations; it does not choose for you.","empty":"No results. Try an ingredient name or symptom instead of a brand.","olderTitle":"Safety checks for older adults and chronic conditions","olderIntro":"Age, multiple medicines, and chronic disease can turn common OTC products into risks for sedation, falls, blood pressure, bleeding, kidney stress, or liver injury.","older1Title":"Age 65+","older1":"First-generation antihistamines such as diphenhydramine, doxylamine, and chlorpheniramine may increase drowsiness, confusion, urinary retention, and falls.","older2Title":"High blood pressure or heart disease","older2":"Decongestants such as pseudoephedrine can raise blood pressure and heart rate. Ask a pharmacist first.","older3Title":"Blood thinners and bleeding risk","older3":"If you take warfarin, apixaban, rivaroxaban, or aspirin, use caution with NSAIDs and supplements such as fish oil, ginkgo, turmeric, or garlic.","older4Title":"Liver or kidney disease","older4":"Acetaminophen matters for the liver; ibuprofen and naproxen matter for kidneys and stomach bleeding. Ask before use if you have existing disease.","suppTitle":"Supplement safety guide","suppIntro":"In the U.S., dietary supplements are not reviewed by FDA for safety and effectiveness before sale the same way drugs are. “Natural” does not mean safe.","suppNote1":"Dietary supplements are not FDA-approved for effectiveness and safety before sale like medicines. Label words such as “supports” do not guarantee treatment benefit.","suppNote2":"When possible, look for third-party quality marks such as USP Verified, NSF Certified, or Informed Choice.","suppNote3Title":"Interactions","suppNote3":"If you take blood thinners, diabetes medicines, blood pressure medicines, antidepressants, transplant medicines, or seizure medicines, ask a pharmacist first.","urgentTitle":"When OTC is not enough","urgentIntro":"These situations need medical help before choosing a pharmacy product.","urgent1Title":"Call 911","urgent2Title":"Same-day care or pharmacist","phraseTitle":"English phrases to show a pharmacist","phraseIntro":"You can show these on your phone. Bring your prescription medicines, supplements, allergies, and pregnancy status when relevant.","footerDisclaimer":"Educational material only. Not medical diagnosis, prescribing, or treatment.","footerSources":"Reference standards: FDA OTC Drug Facts labels (DailyMed), 21 CFR 201.66, MedlinePlus, NIH Office of Dietary Supplements, NCCIH, NIH LiverTox, CDC, Poison Control."},"ko":{"tagline":"미국 약국 OTC·보충제 무료 안전 교육 가이드","gateTitle":"시작하기 전에","gateSubtitle":"교육 목적 자료 · 의학적 조언 아님 · 법적 책임 제한","gateP1":"HomeRx는 미국 약국에서 판매되는 OTC 의약품과 보충제를 이해하기 위한 무료 교육 자료입니다. 이 자료는 진단, 처방, 치료, 개인별 복약 지시를 제공하지 않습니다.","gateP2":"이 자료를 사용한 결정과 결과에 대해 작성자, 개발자, 배포 기관은 법적·의학적 책임을 지지 않습니다.","gateP3":"약을 복용하기 전에는 제품 라벨을 읽고, 특히 고령자, 임신·수유 중인 사람, 어린이, 만성질환자, 여러 약을 복용 중인 사람은 의사 또는 약사와 상담해야 합니다.","gateLi1":"응급상황에서는 이 사이트를 사용하지 말고 911에 전화하세요.","gateLi2":"독극물 또는 약물 과다복용은 Poison Control 1-800-222-1222에 연락하세요.","gateLi3":"보충제는 의약품처럼 판매 전 FDA가 안전성·효과를 승인하지 않습니다.","gateC1":"이 자료가 교육 목적이며 의학적 조언, 진단, 처방, 치료가 아님을 이해합니다.","gateC2":"이 자료 사용으로 인한 결정과 결과에 대해 작성자, 개발자, 배포 기관에 법적 책임을 묻지 않음을 이해합니다.","gateC3":"복용 전 제품 라벨을 읽고 필요하면 약사 또는 의사에게 상담해야 함을 이해합니다.","gateC4":"응급상황에서는 이 자료에 의존하지 않고 911 또는 적절한 응급 서비스를 이용하겠습니다.","gateButton":"동의하고 계속","gateEmergencyTitle":"응급 안내","gateEmergency":"가슴통증, 호흡곤란, 한쪽 마비, 심한 알레르기, 의식 저하, 과다복용, 자살 생각은 911. 독극물·약물 과다복용은 1-800-222-1222. 정신건강 위기는 988.","emergencyLabel":"응급상황:","emergencyLine":"가슴통증, 호흡곤란, 한쪽 마비, 심한 알레르기, 과다복용, 자살 생각은 911. 독극물·약물 과다복용 상담은 1-800-222-1222, 정신건강 위기는 988.","eyebrow":"이민자, 고령자, 가족, 커뮤니티 기관을 위해","heroTitle":"영어가 어려워도 미국 약국의 생활약을 안전하게 이해할 수 있게.","heroLead":"HomeRx는 감기, 알레르기, 통증, 속쓰림, 설사, 변비처럼 흔한 증상에 쓰이는 미국 OTC 의약품과 보충제를 설명하는 무료 다국어 교육 자료입니다. 진단이나 처방이 아니라, 약국에서 더 안전하게 질문하고 선택하도록 돕는 안내서입니다.","startSymptoms":"증상별로 보기","startSupplements":"보충제 안전 보기","startPhrases":"약사에게 보여줄 문장","quickTitle":"먼저 확인하세요","quickUrgent":"바로 병원·응급실 가야 하는 경우","quickOlder":"고령자와 만성질환자 주의","quickDuplicate":"같은 성분 중복 복용 위험","quickSupplements":"보충제는 의약품처럼 승인되지 않습니다","notice1Title":"목적","notice1":"이민자, 고령자, 보호자, 유학생이 미국 약국의 OTC 제품 라벨과 성분명을 이해하도록 돕습니다.","notice2Title":"안전","notice2":"혈압약, 당뇨약, 항응고제, 수면제, 항우울제 등을 복용 중이면 OTC나 보충제도 먼저 약사에게 확인하세요.","notice3Title":"중복 성분","notice3":"감기약, 진통제, 수면 보조제를 여러 개 함께 먹으면 acetaminophen, NSAID, 항히스타민제가 겹칠 수 있습니다.","searchLabel":"검색","searchPlaceholder":"증상, 성분, 브랜드 검색: Tylenol, ibuprofen, 어지러움, 통풍, dizziness, gout","symptomTitle":"증상별 OTC 안내","symptomIntro":"흔한 증상은 약국 OTC로 도움을 받을 수 있지만, 오래 지속되거나 심하면 진료가 필요합니다. 아래 내용은 선택을 대신하지 않고 약사와 대화할 기준을 제공합니다.","empty":"검색 결과가 없습니다. 브랜드명 대신 성분명이나 증상명으로 다시 찾아보세요.","olderTitle":"고령자·만성질환자 안전 체크","olderIntro":"나이가 많거나 여러 약을 복용 중이면 흔한 OTC도 졸림, 낙상, 혈압 상승, 출혈, 신장 부담을 만들 수 있습니다.","older1Title":"65세 이상","older1":"diphenhydramine, doxylamine, chlorpheniramine 같은 1세대 항히스타민제는 졸림, 혼동, 소변 곤란, 낙상 위험을 높일 수 있습니다.","older2Title":"고혈압·심장질환","older2":"pseudoephedrine 같은 코막힘 약은 혈압과 심박수를 올릴 수 있습니다. 고혈압 환자는 약사에게 먼저 확인하세요.","older3Title":"항응고제·출혈 위험","older3":"warfarin, apixaban, rivaroxaban, aspirin을 복용 중이면 NSAID 진통제와 fish oil, ginkgo, turmeric, garlic 보충제도 주의가 필요합니다.","older4Title":"간·신장 질환","older4":"acetaminophen은 간, ibuprofen·naproxen은 신장과 위장 출혈 위험이 중요합니다. 기존 질환이 있으면 복용 전 확인하세요.","suppTitle":"보충제 안전 가이드","suppIntro":"미국의 dietary supplement는 의약품처럼 판매 전 FDA가 안전성·효과를 승인하지 않습니다. “천연”이라는 말은 안전하다는 뜻이 아닙니다.","suppNote1":"보충제는 판매 전 FDA가 의약품처럼 효과와 안전성을 승인하지 않습니다. 라벨의 “supports” 표현은 치료 효과 보장이 아닙니다.","suppNote2":"가능하면 USP Verified, NSF Certified, Informed Choice 같은 제3자 품질 인증을 확인하세요.","suppNote3Title":"상호작용","suppNote3":"항응고제, 당뇨약, 혈압약, 항우울제, 이식약, 항경련제를 복용 중이면 보충제도 약사에게 먼저 확인하세요.","urgentTitle":"OTC로 버티면 안 되는 경우","urgentIntro":"아래 상황은 약국 제품을 고르기 전에 즉시 의료 도움을 받아야 합니다.","urgent1Title":"911","urgent2Title":"오늘 진료·약사 상담","phraseTitle":"약사에게 보여줄 영어 문장","phraseIntro":"휴대폰 화면을 그대로 보여줘도 됩니다. 복용 중인 처방약, 보충제, 알레르기, 임신 여부를 함께 말하면 더 안전합니다.","footerDisclaimer":"교육 목적 자료이며 의학적 진단, 처방, 치료를 대신하지 않습니다.","footerSources":"참고 기준: FDA 일반의약품 Drug Facts 라벨(DailyMed), 21 CFR 201.66, MedlinePlus, NIH 보충제 사무국(ODS), NCCIH, NIH LiverTox, CDC, Poison Control."},"ja":{"tagline":"米国薬局のOTC医薬品・サプリメント安全ガイド","gateTitle":"始める前に","gateSubtitle":"教育目的資料 · 医学的助言ではありません · 責任制限","gateP1":"HomeRxは、米国薬局で販 const E = DATA.entries, BY = Object.fromEntries(E.map(e=>[e.id,e]));

const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o=>o==null?"":(typeof o==="string"?o:(o[lang]||o.en||""));
const T = k=>{const v=UI[lang][k];return v===undefined?(UI.en[k]===undefined?(V1&&V1[lang]&&V1[lang][k])||k:UI.en[k]):v};

/* ---------- language & text ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.querySelectorAll("[data-t]").forEach(el=>{const v=T(el.dataset.t); if(typeof v==="string") el.textContent=v;});
  $("#q").placeholder = T("searchPh"); $("#hq").placeholder = lang==="ja"?"ロキソニン、イブ、ガスター…":lang==="ko"?"타이레놀, 게보린, 판콜…":"Tylenol, Loxonin, Geworin…";
  renderAll();
}
function setLang(l){lang=l;store.set("lang",l);applyLang();}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* ---------- search ---------- */
function norm(s){return String(s||"").toLowerCase().normalize("NFKC").replace(/[\s\-·・,.()]/g,"")}
const INDEX = E.map(e=>{
  const parts=[e.id,e.name&&e.name.en,e.name&&e.name.ko,e.name&&e.name.ja,...(e.aka||[]),...(e.brands||[]),...(e.active||[]).map(a=>a.ingredient),
    L(e.uses), e.uses&&e.uses.ko, e.uses&&e.uses.ja, e.uses&&e.uses.en];
  (DATA.home||[]).forEach(h=>{ if((h.us_match||[]).some(m=>(e.active||[]).some(a=>a.ingredient===m))) parts.push(h.product.local,h.product.en); });
  return {id:e.id, name:norm([e.name&&e.name.en,e.name&&e.name.ko,e.name&&e.name.ja,...(e.brands||[]),...(e.aka||[])].join("|")), all:norm(parts.join("|"))};
});
function search(){
  const q=norm(query);
  let list=E.filter(e=>cat==="all"||e.category===cat);
  if(q){
    const score=new Map();
    INDEX.forEach(x=>{ if(x.name.includes(q)) score.set(x.id,2); else if(x.all.includes(q)) score.set(x.id,1); });
    list=list.filter(e=>score.has(e.id)).sort((a,b)=>score.get(b.id)-score.get(a.id));
  }
  return list;
}

  const bar=$("#mineBar");
  if(!conds.length){bar.innerHTML=`<span>${esc(T("mineNone"))}</span><button data-go="cab">${esc(T("mineEdit"))}</button>`;}

function row(e){
  const hits=myHits(e), inC=cabinet.some(c=>c.id===e.id);
  const tags=[];
  if(e.kind==="supplement")tags.push(`<span class="tag">${esc(T("factsSupp").split(" (")[0])}</span>`);
  hits.forEach(f=>tags.push(`<span class="tag c">⚠ ${esc(UI[lang].flag[f])}</span>`));

  const sub=[(e.brands||[]).slice(0,3).join(", "), lang!=="en"?e.name.en:""].filter(Boolean).join(" · ");
  return `<li><button class="row" data-id="${e.id}"><b>${esc(L(e.name))}</b><span class="sub">${esc(sub)}</span>${tags.length?`<span class="tags">${tags.join("")}</span>`:""}</button></li>`;
}
function renderResults(){
  const list=search();
  $("#count").textContent=T("results")(list.length);
  $("#results").innerHTML=list.length?list.map(row).join(""):"";
  $("#results").hidden=!list.length;
  if(!list.length) $("#count").textContent=T("noResults");

/* ---------- detail ---------- */
function li(arr,cls){
  if(!arr||!arr.length)return "";
  return "<ul>"+arr.map(x=>{const t=L(x);const hit=cls&&cls(x);return `<li${hit?' class="hit"':""}>${esc(t)}</li>`}).join("")+"</ul>";
}
function openDetail(id){
  const e=BY[id]; if(!e)return;
  const hits=myHits(e), sup=e.kind==="supplement", guide=e.kind==="guide";
  const h=[];

  if(names.length)h.push(`<p class="brands">${esc(T("alsoCalled"))}: ${esc(names.join(", "))}</p>`);
  if((e.brands||[]).length)h.push(`<p class="brands">${esc(T("seenAs"))}: ${esc(e.brands.join(", "))}</p>`);
  if(hits.length)h.push(`<div class="note c"><h3>${esc(T("forYou"))}</h3><p>${esc(hits.map(f=>UI[lang].flag[f]).join(", "))}</p></div>`);
  h.push(`<div class="facts"><div class="title">${esc(guide?T("factsGuide"):sup?T("factsSupp"):T("factsDrug"))}<small>${esc(T("factsNote"))}</small></div>`);
  if((e.active||[]).length){
    h.push(`<div class="blk"><div class="ai"><span>${esc(T("active"))}</span><span>${esc(T("purpose"))}</span></div>`+
      e.active.map(a=>`<div class="ai" style="font-weight:400"><span>${sup?esc(L(e.name))+" — "+esc(T("varies")):esc(a.ingredient)+(a.strength?" "+esc(a.strength):"")}</span><span>${esc(L(a.purpose))}</span></div>`).join("")+`</div>`);
  }
  if(e.uses)h.push(`<div class="blk"><h3>${esc(T("uses"))}</h3><p>${esc(L(e.uses))}</p></div>`);
  const w=[];
  if(e.key_warning)w.push(`<div class="warn-lead">${esc(L(e.key_warning))}</div>`);
  const flagged=x=>{const s=(x.en||"").toLowerCase();return hits.some(f=>(KEYS[f]||[]).some(k=>s.includes(k)));};
  if((e.do_not_use||[]).length)w.push(`<h4>${esc(T("doNotUse"))}</h4>`+li(e.do_not_use,flagged));
  if((e.ask_doctor||[]).length)w.push(`<h4>${esc(T("askDoctor"))}</h4>`+li(e.ask_doctor,flagged));
  if((e.ask_pharmacist||[]).length)w.push(`<h4>${esc(T("askPharm"))}</h4>`+li(e.ask_pharmacist,flagged));
  if((e.stop_use||[]).length)w.push(`<h4>${esc(T("stopUse"))}</h4>`+li(e.stop_use));
  if(e.pregnancy)w.push(`<h4>${esc(T("pregnancy"))}</h4><p>${esc(L(e.pregnancy))}</p>`);
  if(!sup&&!guide)w.push(`<p><b>${esc(T("keepAway"))}</b></p>`);
  if(w.length)h.push(`<div class="blk"><h3>${esc(T("warnings"))}</h3>${w.join("")}</div>`);
  const d=[];
  if(e.directions_adult)d.push(`<tr><td>${esc(sup?T("intake"):T("adults"))}</td><td>${esc(L(e.directions_adult))}</td></tr>`);
  if(e.max_daily)d.push(`<tr><td>${esc(sup?T("upper"):T("maxDay"))}</td><td>${esc(L(e.max_daily))}</td></tr>`);
  if(e.children)d.push(`<tr><td>${esc(T("children"))}</td><td>${esc(L(e.children))}</td></tr>`);
  if(d.length)h.push(`<div class="blk"><h3>${esc(T("directions"))}</h3><table>${d.join("")}</table></div>`);
  h.push(`</div>`);
  if(e.supplement_note)h.push(`<div class="note"><h3>${esc(T("evidence"))}</h3><p>${esc(L(e.supplement_note))}</p></div>`);
  if(e.older_adults)h.push(`<div class="note${conds.includes("seniors")?" c":""}"><h3>${esc(T("older"))}</h3><p>${esc(L(e.older_adults))}</p></div>`);
  const inC=cabinet.some(c=>c.id===e.id);
  h.push(`<div class="actions"><button class="btn ${inC?"":"solid"}" id="addCab" ${guide?"hidden":""}>${esc(inC?T("inCab"):T("addCab"))}</button><button class="btn" id="showBtn">${esc(T("showPharm"))}</button></div>`);
  if((e.sources||[]).length)h.push(`<div class="src"><b>${esc(T("sources"))}</b><ol>${e.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ol><p>${esc(T("verified"))}: ${esc(e.verified||"")}</p></div>`);
  $("#detail").innerHTML=h.join("");
  $("#addCab")&&$("#addCab").addEventListener("click",()=>{toggleCab(e.id);openDetail(e.id);});
  $("#showBtn").addEventListener("click",()=>showPharm(e));
  $("#sheet").classList.add("on"); $("#sheet").scrollTop=0; document.body.style.overflow="hidden";
  history.pushState({sheet:id},"");
  $("#closeSheet").focus();
}
const KEYS={bp:["blood pressure"],heart:["heart"],kidney:["kidney"],liver:["liver"],stomach:["stomach","ulcer","bleeding problem"],bleeding:["bleeding","blood thinn","anticoagul","warfarin"],
  blood_thinner:["blood thinn","anticoagul","warfarin"],diabetes:["diabetes"],glaucoma:["glaucoma"],prostate:["prostate","urinat"],thyroid:["thyroid"],asthma:["asthma"],
  pregnancy:["pregnan","breast"],alcohol:["alcohol","drinks"],seniors:["65","older"]};
function closeSheet(){$("#sheet").classList.remove("on");document.body.style.overflow="";}
$("#closeSheet").addEventListener("click",()=>history.back());
window.addEventListener("popstate",()=>{ if($("#show").classList.contains("on")){$("#show").classList.remove("on");return;} closeSheet(); renderAll(); });

function showPharm(e){
  const ing=(e.active||[]).map(a=>a.ingredient).join(" + ");
  const mine=conds.length?`<p style="margin-top:16px"><b>My conditions:</b> ${esc(conds.map(f=>UI.en.flag[f]).join(", "))}</p>`:"";
  const others=cabinet.filter(c=>c.id!==e.id&&BY[c.id]).map(c=>BY[c.id].name.en);
  const oth=others.length?`<p><b>I also have:</b> ${esc(others.join(", "))}</p>`:"";
  $("#showBody").innerHTML=`<div class="med">${esc(e.name.en)}${ing&&ing.toLowerCase()!==e.name.en.toLowerCase()?`<br><span style="font-size:.55em;font-weight:600">${esc(ing)}</span>`:""}</div>
    <p class="q">${esc(UI.en.showQ)}</p>${mine}${oth}<p class="tr">${esc(T("showTr"))}</p>
    <button class="btn solid wide" id="showX" style="width:100%;margin-top:20px">${esc(T("showClose"))}</button>`;
  $("#show").classList.add("on"); history.pushState({show:1},"");
  $("#showX").addEventListener("click",()=>history.back());
}

/* ---------- cabinet ---------- */
function toggleCab(id){ if(cabinet.some(c=>c.id===id)) cabinet=cabinet.filter(c=>c.id!==id); else cabinet.push({id,exp:""}); store.set("cabinet",cabinet); renderBadge(); }
function cabChecks(){
  const items=cabinet.map(c=>BY[c.id]).filter(Boolean), out=[];
  const byIng={}; items.forEach(e=>(e.active||[]).forEach(a=>{(byIng[a.ingredient]=byIng[a.ingredient]||new Set()).add(L(e.name))}));
  Object.entries(byIng).forEach(([i,s])=>{ if(s.size>1) out.push({lvl:"s",txt:T("dupIng")(i,[...s].join(", "))}); });
  const byCls={}; items.forEach(e=>(e.classes||[]).forEach(c=>{(byCls[c]=byCls[c]||new Set()).add(L(e.name))}));
  ["nsaid","decongestant","ppi","h2_blocker","stimulant_laxative","acetaminophen","salicylate"].forEach(c=>{
    const s=byCls[c]; if(s&&s.size>1){ const dupI=out.some(o=>o.lvl==="s"&&[...s].every(n=>o.txt.includes(n))); if(!dupI) out.push({lvl:"c",txt:T("dupClass")(UI[lang].cls[c],[...s].join(", "))}); }
  });
  const nsaidLike=new Set([...(byCls.nsaid||[]),...(byCls.salicylate||[])]);
  if(nsaidLike.size>1 && !(byCls.nsaid&&byCls.nsaid.size>1) && !(byCls.salicylate&&byCls.salicylate.size>1)) out.push({lvl:"c",txt:T("dupClass")(UI[lang].cls.nsaid+" / "+UI[lang].cls.salicylate,[...nsaidLike].join(", "))});
  const sed=new Set([...(byCls.sedating_antihistamine||[]),...(byCls.sleep_aid||[])]);
  if(sed.size>1) out.push({lvl:"s",txt:T("sedate")([...sed].join(", "))});
  items.forEach(e=>{const h=myHits(e); if(h.length) out.push({lvl:"c",txt:T("matchFlag")(L(e.name),h.map(f=>UI[lang].flag[f]).join(", "))});});
  return {items,out};
}
function expState(d){ if(!d)return ""; const days=(new Date(d+"T00:00:00")-new Date())/864e5; return days<0?"s":days<60?"c":""; }
function renderCab(){
  const {items,out}=cabChecks();
  $("#cabAlerts").innerHTML = !items.length?"":(out.length?out.map(o=>`<div class="alert ${o.lvl}" role="${o.lvl==="s"?"alert":"status"}">${esc(o.txt)}</div>`).join(""):`<div class="alert ok">${esc(T("cabOk"))}</div>`);
  $("#cabList").innerHTML = items.length? cabinet.filter(c=>BY[c.id]).map(c=>{const e=BY[c.id],st=expState(c.exp);
    return `<li><div class="nm"><button class="row" style="padding:0;min-height:44px" data-id="${e.id}"><b>${esc(L(e.name))}</b></button>
      <label class="src">${esc(T("expires"))} <input type="date" data-exp="${e.id}" value="${esc(c.exp)}"></label>
      ${st?`<span class="exp ${st}">${esc(st==="s"?T("expired"):T("expSoon"))}</span>`:""}</div>
      <button class="x" data-rm="${e.id}" aria-label="${esc(T("remove"))}">✕</button></li>`}).join("") : `<li class="empty" style="border:0">${esc(T("cabEmpty"))}</li>`;
  $("#conds").innerHTML=FLAGS.map(f=>`<label class="cond"><input type="checkbox" value="${f}" ${conds.includes(f)?"checked":""}><span>${esc(UI[lang].flag[f])}</span></label>`).join("");
  renderBadge();
}
$("#cabList").addEventListener("click",ev=>{const r=ev.target.closest("[data-rm]"); if(r){toggleCab(r.dataset.rm);renderCab();return;} const o=ev.target.closest("[data-id]"); if(o)openDetail(o.dataset.id);});
$("#cabList").addEventListener("change",ev=>{const i=ev.target.closest("[data-exp]"); if(!i)return; const c=cabinet.find(c=>c.id===i.dataset.exp); if(c){c.exp=i.value;store.set("cabinet",cabinet);renderCab();}});
$("#conds").addEventListener("change",ev=>{const f=ev.target.value; conds=ev.target.checked?[...new Set([...conds,f])]:conds.filter(x=>x!==f); store.set("conds",conds); renderCab(); renderMine();});
function renderBadge(){const n=cabinet.length?cabChecks().out.filter(o=>o.lvl==="s").length:0; const b=$("#cabBadge"); b.hidden=!n; b.textContent=n;}

/* ---------- from home ---------- */
function renderHome(){
  $("#homeTabs").innerHTML=[["KR",lang==="ja"?"韓国":lang==="ko"?"한국":"Korea"],["JP",lang==="ja"?"日本":lang==="ko"?"일본":"Japan"]].map(([c,n])=>`<button class="chip" data-hc="${c}" aria-pressed="${c===homeCountry}">${esc(n)}</button>`).join("");
  const q=norm(homeQuery);
  const list=(DATA.home||[]).filter(h=>h.country===homeCountry).filter(h=>!q||norm([h.product.local,h.product.en,h.maker,...h.ingredients.map(i=>i.name_en)].join("|")).includes(q));
  $("#homeList").innerHTML=list.map(h=>{
    const st=h.us_status==="same_ingredient_otc"?["same","stSame"]:h.us_status==="similar_ingredient_otc"?["sim","stSim"]:["no","stNo"];
    const hm=h.us_match||[]; const cand=E.filter(e=>e.kind==="otc"&&hm.some(m=>(e.active||[]).some(a=>a.ingredient===m)));
    const pure=cand.filter(e=>(e.active||[]).every(a=>hm.includes(a.ingredient)));
    const targets=(pure.length?pure:cand).slice(0,4);
    return `<li class="hb"><div class="local">${esc(h.product.local)}</div><div class="sub" style="color:var(--muted);font-size:.86em">${esc(h.product.en)}${h.maker?" · "+esc(h.maker):""}</div>
      <div style="margin-top:6px;font-size:.92em">${h.ingredients.map(i=>esc(i.name_en+(i.amount?" "+i.amount:""))).join(", ")}</div>
      <span class="st ${st[0]}">${esc(T(st[1]))}</span><p style="font-size:.92em">${esc(L(h.note))}</p>
      ${targets.length?`<div class="go">${targets.map(e=>`<button data-id="${e.id}">${esc(L(e.name))}</button>`).join("")}</div>`:""}${(h.sources||[]).map(s=>`<div style="font-size:.8em;margin-top:6px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join("")}</li>`;}).join("")||`<li class="empty" style="border:0">${esc(T("noResults"))}</li>`;
}
$("#homeTabs").addEventListener("click",ev=>{const b=ev.target.closest("[data-hc]");if(b){homeCountry=b.dataset.hc;renderHome();}});
$("#hq").addEventListener("input",ev=>{homeQuery=ev.target.value;renderHome();});
$("#homeList").addEventListener("click",ev=>{const b=ev.target.closest("[data-id]");if(b)openDetail(b.dataset.id);});

/* ---------- learn ---------- */
function acc(title,body){return `<div class="acc"><button aria-expanded="false">${esc(title)}</button><div class="body">${body}</div></div>`}
function renderLearn(){
  const v=V1||{}; const vs=(v[lang]||v.en||{});
  const olderBody=`<p>${esc(vs.olderIntro||"")}</p>`+[1,2,3,4].map(n=>`<h3 style="margin-top:10px;font-size:1em">${esc(vs["older"+n+"Title"]||"")}</h3><p>${esc(vs["older"+n]||"")}</p>`).join("");
  const suppBody=`<p>${esc(vs.suppIntro||"")}</p><ul><li>${esc(vs.suppNote1||"")}</li><li>${esc(vs.suppNote2||"")}</li><li>${esc(vs.suppNote3||"")}</li></ul>`;
  const phr=(v.phrases||[]).map(p=>`<button class="phr" data-phr="${esc(p.en)}"><b>${esc(p.en)}</b><span>${esc(lang==="en"?"":p[lang])}</span></button>`).join("");
  $("#learn").innerHTML=
    acc(T("labelTitle"),`<p>${esc(T("labelLead"))}</p><ol class="steps">${LEARN.label.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ol>`)+
    acc(T("olderTitle"),olderBody)+
    acc(T("suppTitle"),suppBody)+
    acc(T("measureTitle"),`<ul>${LEARN.measure.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`)+
    acc(T("disposeTitle"),`<ul>${LEARN.dispose.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`)+
    acc(T("phraseTitle"),`<p>${esc(vs.phraseIntro||"")}</p>${phr}`)+
    `<div class="src"><b>${esc(T("sources"))}</b><ol>${LEARN.learnSources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ol></div>`;
  const u=(v.urgentLists&&v.urgentLists[lang])||{urgent911:[],urgentCare:[]};
  $("#u911").innerHTML=u.urgent911.map(x=>`<li>${esc(x)}</li>`).join(""); $("#uCare").innerHTML=u.urgentCare.map(x=>`<li>${esc(x)}</li>`).join("");
}
$("#learn").addEventListener("click",ev=>{
  const b=ev.target.closest(".acc>button"); if(b){b.setAttribute("aria-expanded",b.getAttribute("aria-expanded")!=="true");return;}
  const p=ev.target.closest("[data-phr]"); if(p){ $("#showBody").innerHTML=`<p class="q" style="font-size:2em">${esc(p.dataset.phr)}</p><button class="btn solid wide" id="showX" style="width:100%">${esc(T("showClose"))}</button>`; $("#show").classList.add("on"); history.pushState({show:1},""); $("#showX").addEventListener("click",()=>history.back()); }
});

/* ---------- help / settings ---------- */
let size=store.get("size",1);
function renderSizes(){ document.documentElement.dataset.size=size; $("#sizes").innerHTML=[1,2,3].map(n=>`<button class="chip" data-size="${n}" aria-pressed="${n===size}">${esc(T("size"+n))}</button>`).join(""); }
$("#sizes").addEventListener("click",ev=>{const b=ev.target.closest("[data-size]");if(b){size=+b.dataset.size;store.set("size",size);renderSizes();}});
$("#reGate").addEventListener("click",()=>openGate());

/* ---------- nav ---------- */
function go(v){view=v;document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.view===v)&&b.setAttribute("aria-current","page"));
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(v==="cab")renderCab(); window.scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));

/* ---------- gate ---------- */
function openGate(){ $("#gate").classList.add("on"); document.querySelectorAll(".gc").forEach(c=>c.checked=false); $("#gateGo").disabled=true; }
document.querySelectorAll(".gc").forEach(c=>c.addEventListener("change",()=>{$("#gateGo").disabled=![...document.querySelectorAll(".gc")].every(x=>x.checked);}));
$("#gateGo").addEventListener("click",()=>{store.set("agreed",DATA.version);$("#gate").classList.remove("on");});

function renderAll(){renderCats();renderMine();renderResults();renderCab();renderHome();renderLearn();renderSizes();
  $("#reviewed").textContent=DATA.reviewed; $("#ver").textContent=DATA.version;}

go("find"); applyLang();
if(store.get("agreed","")!==DATA.version) openGate();
</script>
