 or black stools, stomach pain that does not get better","ko":"위출혈 징후: 어지러워 쓰러질 것 같음, 피를 토함, 피가 섞이거나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Signs of heart problems or stroke: chest pain, trouble breathing, weakness on one side, slurred speech, leg swelling — get help right away","ko":"심장·뇌졸중 징후: 가슴 통증, 숨참, 한쪽 힘 빠짐, 말이 어눌함, 다리 붓기 — 즉시 도움을 받으세요","ja":"心臓・脳卒中の兆候: 胸の痛み、息苦しさ、片側の脱力、ろれつが回らない、足のむくみ — すぐに助けを"},{"en":"Pain lasts more than 10 days or fever more than 3 days","ko":"통증이 10일, 열이 3일 넘게 계속될 때","ja":"痛みが10日以上、熱が3日以上続く"}],"key_warning":{"en":"NSAIDs (except aspirin) increase the risk of heart attack, heart failure and stroke, and can cause severe stomach bleeding. Do not take with other NSAIDs such as naproxen or aspirin products unless a doctor says so.","ko":"NSAID(아스피린 제외)는 심장마비, 심부전, 뇌졸중 위험을 높이고 심한 위출혈을 일으킬 수 있습니다. 의사 지시 없이 나프록센이나 아스피린 같은 다른 NSAID와 함께 먹지 마세요.","ja":"NSAID（アスピリン以外）は心筋梗塞、心不全、脳卒中のリスクを高め、重い胃出血を起こすことがあります。医師の指示なしにナプロキセンやアスピリンなど他のNSAIDと一緒に飲まないでください。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding. The American Geriatrics Society lists ibuprofen and naproxen for short-term use only in older adults and advises avoiding them with heart failure or kidney disease.","ko":"라벨은 60세 이상을 위출혈 고위험으로 적고 있습니다. 미국노인의학회는 노인에게 이부프로펜·나프록센은 단기간만 쓰고, 심부전이나 신장 질환이 있으면 피하라고 합니다.","ja":"ラベルは60歳以上を胃出血の高リスクとしています。米国老年医学会は高齢者のイブプロフェン・ナプロキセンは短期間のみとし、心不全や腎臓病があれば避けるよう勧めています。"},"pregnancy":{"en":"Ask a health professional before use. Do not use at 20 weeks of pregnancy or later unless a doctor tells you to; it may harm the unborn child or cause problems during delivery.","ko":"사용 전 의료인에게 물어보세요. 의사 지시 없이 임신 20주 이후에는 쓰지 마세요. 태아에게 해롭거나 출산에 문제를 일으킬 수 있습니다.","ja":"使用前に医療専門家に相談。医師の指示がなければ妊娠20週以降は使わないでください。胎児に害を与えたり出産に影響することがあります。"},"flags":["stomach","bleeding","blood_thinner","heart","bp","kidney","liver","asthma","seniors","pregnancy","alcohol"],"classes":["nsaid"],"supplement_note":null,"sources":[{"title":"DailyMed — Advil (ibuprofen 200 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=772360bd-8631-4d24-b4db-5a7e6e1d9a13"},{"title":"AGS Health in Aging Foundation — Alternatives for Medications Listed in the AGS Beers Criteria (April 2023)","url":"https://www.healthinaging.org/sites/default/files/media/pdf/HIA-LearnMore-BEERS-alternatives23.pdf"}],"verified":"2026-10-22"},{"id":"naproxen","kind":"otc","category":"pain","name":{"en":"Naproxen sodium","ko":"나프록센 나트륨","ja":"ナプロキセンナトリウム"},"aka":["naproxen","NSAID","탁센","ナロンエース"],"brands":["Aleve","store brand naproxen sodium"],"active":[{"ingredient":"naproxen sodium","strength":"220 mg per tablet (naproxen 200 mg)","purpose":{"en":"Pain reliever / fever reducer (NSAID)","ko":"진통제 / 해열제 (NSAID)","ja":"鎮痛薬 / 解熱薬（NSAID）"}}],"uses":{"en":"Temporarily relieves minor pain from arthritis, muscle aches, backache, menstrual cramps, headache, toothache and the common cold; temporarily reduces fever.","ko":"관절염, 근육통, 허리 통증, 생리통, 두통, 치통, 감기의 가벼운 통증을 일시적으로 덜어 주고 열을 일시적으로 내립니다.","ja":"関節炎、筋肉痛、腰痛、生理痛、頭痛、歯痛、かぜの軽い痛みを一時的にやわらげ、熱を一時的に下げます。"},"directions_adult":{"en":"Adults and children 12 and over: 1 tablet every 8 to 12 hours while symptoms last. For the first dose you may take 2 tablets within the first hour. Drink a full glass of water with each dose. Use the smallest dose that works.","ko":"성인 및 12세 이상: 증상이 있는 동안 8~12시간마다 1정. 첫 복용 때만 첫 1시간 안에 2정까지 가능. 매번 물 한 컵과 함께. 효과가 있는 가장 적은 양을 쓰세요.","ja":"成人と12歳以上: 症状がある間、8〜12時間ごとに1錠。初回のみ最初の1時間以内に2錠まで可。毎回コップ1杯の水で。効く最小量を。"},"max_daily":{"en":"No more than 2 tablets in any 8 to 12 hour period, and no more than 3 tablets in 24 hours.","ko":"8~12시간 동안 2정, 24시간 동안 3정을 넘기지 마세요.","ja":"8〜12時間で2錠、24時間で3錠を超えないでください。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"If you have ever had an allergic reaction to another pain reliever or fever reducer","ko":"다른 진통제·해열제에 알레르기 반응이 있었던 적이 있으면","ja":"他の鎮痛薬・解熱薬でアレルギー反応が出たことがある場合"},{"en":"Right before or after heart surgery","ko":"심장 수술 직전이나 직후","ja":"心臓手術の直前・直後"}],"ask_doctor":[{"en":"Stomach bleeding risk: age 60 or older, past ulcers or bleeding, blood thinner or steroid, other NSAIDs, 3 or more drinks a day","ko":"위출혈 위험: 60세 이상, 궤양·출혈 경험, 혈액 희석제·스테로이드, 다른 NSAID, 하루 3잔 이상 음주","ja":"胃出血のリスク: 60歳以上、潰瘍・出血の既往、血液をサラサラにする薬・ステロイド、他のNSAID、1日3杯以上の飲酒"},{"en":"Heartburn or other stomach problems","ko":"속쓰림 등 위장 문제","ja":"胸やけなど胃の不調"},{"en":"High blood pressure, heart disease, liver cirrhosis, kidney disease, or asthma","ko":"고혈압, 심장 질환, 간경변, 신장 질환, 천식","ja":"高血圧、心臓病、肝硬変、腎臓病、ぜんそく"},{"en":"You take a diuretic","ko":"이뇨제 복용 중","ja":"利尿薬を使用中"}],"ask_pharmacist":[{"en":"Any other medicine, or you are under a doctor's care for a serious condition","ko":"다른 약을 먹고 있거나 중한 질환으로 진료 중","ja":"他の薬を使用中、または重い病気で治療中"}],"stop_use":[{"en":"Signs of stomach bleeding: feeling faint, vomiting blood, bloody or black stools, stomach pain that does not get better","ko":"위출혈 징후: 쓰러질 것 같음, 피를 토함, 피 섞인 변이나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Trouble swallowing, or the pill feels stuck in your throat","ko":"삼키기 어렵거나 알약이 목에 걸린 느낌","ja":"飲み込みにくい、錠剤がのどにつかえる感じ"},{"en":"Pain lasts more than 10 days or fever more than 3 days, or new symptoms","ko":"통증 10일·열 3일 넘게 지속, 또는 새로운 증상","ja":"痛み10日以上・熱3日以上、または新しい症状"}],"key_warning":{"en":"An NSAID: it can cause severe stomach bleeding, and using more or longer than directed may raise the risk of heart attack or stroke. Do not combine with ibuprofen or aspirin products.","ko":"NSAID입니다. 심한 위출혈을 일으킬 수 있고, 정해진 것보다 많이 또는 오래 쓰면 심장마비·뇌졸중 위험이 커질 수 있습니다. 이부프로펜이나 아스피린 제품과 함께 쓰지 마세요.","ja":"NSAIDです。重い胃出血を起こすことがあり、決められた量・期間を超えると心筋梗塞や脳卒中のリスクが高まることがあります。イブプロフェンやアスピリン製品と併用しないでください。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding. The American Geriatrics Society lists ibuprofen and naproxen for short-term use only in older adults and advises avoiding them with heart failure or kidney disease.","ko":"라벨은 60세 이상을 위출혈 고위험으로 적고 있습니다. 미국노인의학회는 노인에게 이부프로펜·나프록센은 단기간만 쓰고, 심부전이나 신장 질환이 있으면 피하라고 합니다.","ja":"ラベルは60歳以上を胃出血の高リスクとしています。米国老年医学会は高齢者のイブプロフェン・ナプロキセンは短期間のみとし、心不全や腎臓病があれば避けるよう勧めています。"},"pregnancy":{"en":"Ask a health professional before use. The label says to avoid it in the last 3 months of pregnancy unless a doctor directs; newer NSAID labels say 20 weeks or later — ask your doctor.","ko":"사용 전 의료인에게 물어보세요. 이 라벨은 임신 마지막 3개월에는 의사 지시 없이 피하라고 하며, 최신 NSAID 라벨은 임신 20주 이후로 적고 있습니다 — 의사에게 확인하세요.","ja":"使用前に医療専門家に相談。このラベルは妊娠最後の3か月は医師の指示なしに避けるよう記載し、新しいNSAIDラベルは妊娠20週以降としています — 医師に確認を。"},"flags":["stomach","bleeding","blood_thinner","heart","bp","kidney","liver","asthma","seniors","pregnancy","alcohol"],"classes":["nsaid"],"supplement_note":null,"sources":[{"title":"DailyMed — Aleve (naproxen sodium 220 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=00ef5b30-71d0-4cb4-84a3-48c67d1cea2a"},{"title":"DailyMed — Aleve tablet (warnings section)","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=46e7b298-9e19-49b6-be71-e4fdcb09a5d4"},{"title":"DailyMed — Advil Drug Facts (NSAID 20-week pregnancy wording)","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=772360bd-8631-4d24-b4db-5a7e6e1d9a13"},{"title":"AGS Health in Aging Foundation — Alternatives for Medications Listed in the AGS Beers Criteria (April 2023)","url":"https://www.healthinaging.org/sites/default/files/media/pdf/HIA-LearnMore-BEERS-alternatives23.pdf"}],"verified":"2026-10-22"},{"id":"aspirin","kind":"otc","category":"pain","name":{"en":"Aspirin","ko":"아스피린","ja":"アスピリン"},"aka":["acetylsalicylic acid","ASA","바이엘 아스피린","バファリン"],"brands":["Bayer Genuine Aspirin","Ecotrin","Bayer Aspirin Regimen (81 mg)"],"active":[{"ingredient":"aspirin","strength":"325 mg per tablet","purpose":{"en":"Pain reliever / fever reducer (NSAID)","ko":"진통제 / 해열제 (NSAID)","ja":"鎮痛薬 / 解熱薬（NSAID）"}}],"uses":{"en":"Temporary relief of headache, muscle pain, toothache, menstrual pain, pain and fever of colds, and minor arthritis pain. Low-dose (81 mg) aspirin for the heart is used only under a doctor's direction.","ko":"두통, 근육통, 치통, 생리통, 감기의 통증과 열, 가벼운 관절염 통증을 일시적으로 덜어 줍니다. 심장 예방용 저용량(81 mg) 아스피린은 의사 지시가 있을 때만 씁니다.","ja":"頭痛、筋肉痛、歯痛、生理痛、かぜの痛みと熱、軽い関節炎の痛みを一時的にやわらげます。心臓のための低用量（81 mg）アスピリンは医師の指示がある場合だけ使います。"},"directions_adult":{"en":"Adults and children 12 and over (325 mg): 1 or 2 tablets every 4 hours, or 3 tablets every 6 hours. Drink a full glass of water with each dose.","ko":"성인 및 12세 이상 (325 mg): 4시간마다 1~2정, 또는 6시간마다 3정. 매번 물 한 컵과 함께.","ja":"成人と12歳以上（325 mg）: 4時間ごとに1〜2錠、または6時間ごとに3錠。毎回コップ1杯の水で。"},"max_daily":{"en":"Do not exceed 12 tablets (325 mg) in 24 hours.","ko":"24시간에 12정(325 mg)을 넘기지 마세요.","ja":"24時間で12錠（325 mg）を超えないでください。"},"children":{"en":"Under 12: ask a doctor. Reye's syndrome: children and teenagers who have or are recovering from chickenpox or flu-like symptoms should not use this product.","ko":"12세 미만: 의사에게 물어보세요. 라이 증후군: 수두나 독감 같은 증상이 있거나 회복 중인 어린이·청소년은 쓰지 마세요.","ja":"12歳未満: 医師に相談。ライ症候群: 水ぼうそうやインフルエンザのような症状がある、または回復中の子ども・10代は使わないでください。"},"do_not_use":[{"en":"If you are allergic to aspirin or any other pain reliever or fever reducer","ko":"아스피린이나 다른 진통제·해열제에 알레르기가 있으면","ja":"アスピリンや他の鎮痛薬・解熱薬にアレルギーがある場合"}],"ask_doctor":[{"en":"Stomach bleeding risk: age 60 or older, past ulcers or bleeding, blood thinner or steroid, other NSAIDs, 3 or more drinks a day","ko":"위출혈 위험: 60세 이상, 궤양·출혈 경험, 혈액 희석제·스테로이드, 다른 NSAID, 하루 3잔 이상 음주","ja":"胃出血のリスク: 60歳以上、潰瘍・出血の既往、血液をサラサラにする薬・ステロイド、他のNSAID、1日3杯以上の飲酒"},{"en":"Heartburn or other stomach problems; high blood pressure, heart disease, liver cirrhosis, kidney disease, asthma; you take a diuretic","ko":"속쓰림 등 위장 문제, 고혈압, 심장 질환, 간경변, 신장 질환, 천식, 이뇨제 복용","ja":"胸やけなど胃の不調、高血圧、心臓病、肝硬変、腎臓病、ぜんそく、利尿薬の使用"}],"ask_pharmacist":[{"en":"Prescription medicines for gout, diabetes or arthritis","ko":"통풍, 당뇨, 관절염 처방약","ja":"痛風、糖尿病、関節炎の処方薬"}],"stop_use":[{"en":"Signs of stomach bleeding: feeling faint, vomiting blood, bloody or black stools, stomach pain that does not get better","ko":"위출혈 징후: 쓰러질 것 같음, 피를 토함, 피 섞인 변이나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Ringing in the ears or loss of hearing","ko":"귀울림이나 청력 저하","ja":"耳鳴りや聞こえにくさ"},{"en":"Pain lasts more than 10 days or fever more than 3 days, redness or swelling, or new symptoms","ko":"통증 10일·열 3일 넘게 지속, 붉어짐·붓기, 새로운 증상","ja":"痛み10日以上・熱3日以上、赤み・腫れ、新しい症状"}],"key_warning":{"en":"Aspirin can cause severe stomach bleeding and thins the blood. Never give it to children or teenagers with chickenpox or flu-like illness (Reye's syndrome). Daily low-dose aspirin is a doctor's decision.","ko":"아스피린은 심한 위출혈을 일으킬 수 있고 피를 묽게 합니다. 수두나 독감 같은 병을 앓는 어린이·청소년에게 절대 주지 마세요(라이 증후군). 매일 먹는 저용량 아스피린은 의사가 정할 일입니다.","ja":"アスピリンは重い胃出血を起こすことがあり、血を固まりにくくします。水ぼうそうやインフルエンザのような病気の子ども・10代には絶対に与えないでください（ライ症候群）。毎日の低用量アスピリンは医師が決めることです。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding.","ko":"라벨은 60세 이상을 위출혈 위험이 높은 경우로 적고 있습니다.","ja":"ラベルは60歳以上を胃出血のリスクが高い人としています。"},"pregnancy":{"en":"Ask a health professional before use. Do not use in the last 3 months of pregnancy unless a doctor specifically directs.","ko":"사용 전 의료인에게 물어보세요. 의사의 특별한 지시 없이 임신 마지막 3개월에는 쓰지 마세요.","ja":"使用前に医療専門家に相談。医師の特別な指示がなければ妊娠最後の3か月は使わないでください。"},"flags":["stomach","bleeding","blood_thinner","bp","heart","kidney","liver","asthma","seniors","pregnancy","alcohol","children","diabetes"],"classes":["salicylate"],"supplement_note":null,"sources":[{"title":"DailyMed — Bayer Genuine Aspirin (325 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=44a08904-68b9-4d06-a28d-21aae3d6140c"}],"verified":"2026-10-22"},{"id":"diclofenac-gel","kind":"otc","category":"pain","name":{"en":"Diclofenac sodium 1% gel","ko":"디클로페낙 나트륨 1% 겔","ja":"ジクロフェナクナトリウム1%ゲル"},"aka":["diclofenac","볼타렌","ボルタレン"],"brands":["Voltaren Arthritis Pain","store brand diclofenac gel"],"active":[{"ingredient":"diclofenac sodium","strength":"1% gel","purpose":{"en":"Arthritis pain reliever (NSAID)","ko":"관절염 진통제 (NSAID)","ja":"関節炎の鎮痛薬（NSAID）"}}],"uses":{"en":"Temporary relief of arthritis pain in the hands, wrists, elbows, feet, ankles or knees. It may take up to 7 days to work; it is not for immediate relief.","ko":"손, 손목, 팔꿈치, 발, 발목, 무릎의 관절염 통증을 일시적으로 덜어 줍니다. 효과가 나타나기까지 최대 7일 걸릴 수 있으며, 즉시 효과용이 아닙니다.","ja":"手、手首、ひじ、足、足首、ひざの関節炎の痛みを一時的にやわらげます。効くまで最大7日かかることがあり、即効性はありません。"},"directions_adult":{"en":"Adults 18 and over: use the dosing card. Upper body (hand, wrist, elbow): 2 g (2.25 inches) per area; lower body (foot, ankle, knee): 4 g (4.5 inches) per area. Apply 4 times a day to clean, dry, unbroken skin. Do not cover with a bandage or use with heat.","ko":"18세 이상 성인: 동봉된 계량 카드를 사용하세요. 상체(손, 손목, 팔꿈치): 부위당 2 g(2.25인치), 하체(발, 발목, 무릎): 부위당 4 g(4.5인치). 깨끗하고 마른 상처 없는 피부에 하루 4번. 붕대로 덮거나 찜질과 함께 쓰지 마세요.","ja":"18歳以上: 付属の計量カードを使用。上半身（手・手首・ひじ）: 1か所2 g（2.25インチ）、下半身（足・足首・ひざ）: 1か所4 g（4.5インチ）。清潔で乾いた傷のない皮膚に1日4回。包帯で覆ったり温熱と併用しないでください。"},"max_daily":{"en":"No more than 2 body areas at the same time, 4 times a day, for up to 21 days unless a doctor directs.","ko":"한 번에 2부위까지, 하루 4번, 의사 지시가 없으면 최대 21일.","ja":"同時に2か所まで、1日4回、医師の指示がなければ最長21日。"},"children":{"en":"Not for use under 18 unless a doctor directs; safety and effectiveness are not known.","ko":"의사 지시가 없으면 18세 미만은 쓰지 마세요. 안전성과 효과가 확인되지 않았습니다.","ja":"医師の指示がなければ18歳未満は使用しないでください。安全性・有効性は確認されていません。"},"do_not_use":[{"en":"If you have had an allergic reaction to any other pain reliever or fever reducer","ko":"다른 진통제·해열제에 알레르기 반응이 있었던 적이 있으면","ja":"他の鎮痛薬・解熱薬でアレルギー反応が出たことがある場合"},{"en":"On strains, sprains, bruises or sports injuries","ko":"삔 곳, 접질린 곳, 멍, 운동 부상에는","ja":"筋違い、ねんざ、打ち身、スポーツのけがには"},{"en":"Right before or after heart surgery; on more than 2 body areas at once; in the eyes, nose or mouth","ko":"심장 수술 직전·직후, 한 번에 2부위 초과, 눈·코·입에는","ja":"心臓手術の直前・直後、同時に2か所を超えて、目・鼻・口には"}],"ask_doctor":[{"en":"Stomach bleeding risk factors or stomach problems such as heartburn","ko":"위출혈 위험 요인이나 속쓰림 같은 위장 문제","ja":"胃出血のリスク要因や胸やけなど胃の不調"},{"en":"High blood pressure, heart disease, liver cirrhosis, kidney disease, asthma, or a past stroke; you take a diuretic","ko":"고혈압, 심장 질환, 간경변, 신장 질환, 천식, 뇌졸중 경험, 이뇨제 복용","ja":"高血圧、心臓病、肝硬変、腎臓病、ぜんそく、脳卒中の既往、利尿薬の使用"}],"ask_pharmacist":[{"en":"Any other medicine, or you are under a doctor's care for a serious condition","ko":"다른 약을 먹고 있거나 중한 질환으로 진료 중","ja":"他の薬を使用中、または重い病気で治療中"}],"stop_use":[{"en":"Pain gets worse or lasts more than 21 days; redness, swelling, fever or skin irritation","ko":"통증이 심해지거나 21일 넘게 지속, 붉어짐·붓기·열·피부 자극","ja":"痛みが悪化または21日以上続く、赤み・腫れ・発熱・皮膚の刺激"},{"en":"Signs of stomach bleeding, heart problems or stroke (chest pain, trouble breathing, leg swelling, weakness on one side, slurred speech)","ko":"위출혈, 심장 문제, 뇌졸중 징후 (가슴 통증, 숨참, 다리 붓기, 한쪽 힘 빠짐, 말이 어눌함)","ja":"胃出血、心臓の問題、脳卒中の兆候（胸の痛み、息苦しさ、足のむくみ、片側の脱力、ろれつが回らない）"}],"key_warning":{"en":"Even on the skin this is an NSAID: liver damage, stomach bleeding, heart attack and stroke warnings still apply, especially with overuse or with other diclofenac or NSAID products.","ko":"피부에 바르는 약이어도 NSAID입니다. 너무 많이 쓰거나 다른 디클로페낙·NSAID 제품과 함께 쓰면 간 손상, 위출혈, 심장마비, 뇌졸중 경고가 그대로 적용됩니다.","ja":"皮膚に塗る薬でもNSAIDです。使いすぎたり他のジクロフェナク・NSAID製品と併用すると、肝障害、胃出血、心筋梗塞、脳卒中の警告がそのまま当てはまります。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding.","ko":"라벨은 60세 이상을 위출혈 위험이 높은 경우로 적고 있습니다.","ja":"ラベルは60歳以上を胃出血のリスクが高い人としています。"},"pregnancy":{"en":"Ask a health professional before use. Do not use at 20 weeks of pregnancy or later unless a doctor directs.","ko":"사용 전 의료인에게 물어보세요. 의사 지시 없이 임신 20주 이후에는 쓰지 마세요.","ja":"使用前に医療専門家に相談。医師の指示がなければ妊娠20週以降は使わないでください。"},"flags":["stomach","bleeding","blood_thinner","heart","bp","kidney","liver","asthma","seniors","pregnancy","alcohol"],"classes":["nsaid"],"supplement_note":null,"sources":[{"title":"DailyMed — Voltaren Arthritis Pain (diclofenac sodium 1% gel) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=30a94282-0892-442a-aa10-6525cbd4fe88"}],"verified":"2026-10-22"},{"id":"lidocaine-patch","kind":"otc","category":"pain","name":{"en":"Lidocaine 4% patch","ko":"리도카인 4% 패치","ja":"リドカイン4%パッチ"},"aka":["lidocaine"],"brands":["Aspercreme with Lidocaine","Salonpas Lidocaine","store brand lidocaine 4% patch"],"active":[{"ingredient":"lidocaine","strength":"4%","purpose":{"en":"Topical anesthetic","ko":"국소 마취제","ja":"局所麻酔薬"}}],"uses":{"en":"Temporary relief of pain.","ko":"통증을 일시적으로 덜어 줍니다.","ja":"痛みを一時的にやわらげます。"},"directions_adult":{"en":"Adults and children 12 and over: clean and dry the area, apply one patch; not more than 3 to 4 times a day. Wash hands after applying or removing.","ko":"성인 및 12세 이상: 부위를 깨끗이 말리고 패치 1장을 붙입니다. 하루 3~4번을 넘기지 마세요. 붙이거나 뗀 뒤 손을 씻으세요.","ja":"成人と12歳以上: 患部を清潔に乾かし1枚貼ります。1日3〜4回まで。貼る・はがす後は手を洗ってください。"},"max_daily":{"en":"One patch at a time; not more than 3 to 4 times a day.","ko":"한 번에 1장, 하루 3~4번까지.","ja":"一度に1枚、1日3〜4回まで。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"On wounds or irritated or damaged skin","ko":"상처나 자극받은·손상된 피부에는","ja":"傷や荒れた・傷んだ皮膚には"},{"en":"More than 1 patch at a time, or with other pain-relief creams or patches","ko":"한 번에 2장 이상, 또는 다른 진통 크림·패치와 함께","ja":"一度に2枚以上、または他の鎮痛クリーム・パッチと一緒に"},{"en":"With a heating pad; do not expose the area to heat or direct sun or bandage tightly","ko":"찜질기와 함께 쓰지 말고, 열·직사광선에 노출하거나 꽉 묶지 마세요","ja":"温熱パッドと併用しない。熱や直射日光に当てたり、きつく巻かないでください"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Condition worsens or lasts more than 7 days, or comes back within a few days","ko":"증상이 나빠지거나 7일 넘게 지속되거나 며칠 안에 다시 생길 때","ja":"悪化する、7日以上続く、数日で再発する"},{"en":"Redness, severe burning pain, swelling or blistering where applied","ko":"붙인 곳이 붉어지거나 심하게 화끈거리거나 붓거나 물집이 생길 때","ja":"貼った所の赤み、強い焼けるような痛み、腫れ、水ぶくれ"}],"key_warning":{"en":"Use one patch at a time and never with heat — heat increases how much lidocaine enters the skin.","ko":"한 번에 1장만, 열과 함께 쓰지 마세요.","ja":"一度に1枚だけ、熱と一緒に使わないでください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":[],"classes":[],"supplement_note":null,"sources":[{"title":"DailyMed — Aspercreme with Lidocaine (lidocaine 4% patch) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7ad8efa9-7031-4cd0-be1d-6dee63091fd1"}],"verified":"2026-10-22"},{"id":"capsaicin-cream","kind":"otc","category":"pain","name":{"en":"Capsaicin cream","ko":"캡사이신 크림","ja":"カプサイシンクリーム"},"aka":["capsaicin","chili pepper cream"],"brands":["Capzasin","store brand capsaicin cream"],"active":[{"ingredient":"capsaicin","strength":"0.025% to 0.1% (product shown: 0.1%)","purpose":{"en":"Topical analgesic","ko":"국소 진통제","ja":"外用鎮痛薬"}}],"uses":{"en":"Relief of minor aches and pains of muscles and joints from arthritis, simple backache, strains, bruises and sprains.","ko":"관절염, 단순 요통, 근육 결림, 멍, 삔 곳의 가벼운 근육·관절 통증을 덜어 줍니다.","ja":"関節炎、腰痛、筋違い、打ち身、ねんざによる筋肉・関節の軽い痛みをやわらげます。"},"directions_adult":{"en":"Adults over 18: massage into the painful area until absorbed, no more than 3 to 4 times a day. Wash hands with soap and water after applying. A burning feeling is common at first and usually fades over several days.","ko":"18세 초과 성인: 아픈 부위에 흡수될 때까지 문지르고, 하루 3~4번을 넘기지 마세요. 바른 뒤 비누로 손을 씻으세요. 처음에는 화끈거림이 흔하며 며칠이 지나면 보통 줄어듭니다.","ja":"18歳超: 痛む所に吸収されるまですり込み、1日3〜4回まで。塗った後は石けんで手を洗う。最初は焼けるような感じがよくあり、数日で弱まります。"},"max_daily":{"en":"No more than 3 to 4 times a day.","ko":"하루 3~4번까지.","ja":"1日3〜4回まで。"},"children":{"en":"18 or younger: do not use; consult a doctor.","ko":"18세 이하: 쓰지 말고 의사와 상담하세요.","ja":"18歳以下: 使用せず医師に相談してください。"},"do_not_use":[{"en":"On wounds or damaged skin; with a heating pad","ko":"상처나 손상된 피부, 찜질기와 함께","ja":"傷や傷んだ皮膚、温熱パッドとの併用"},{"en":"If you are allergic to chili peppers","ko":"고추에 알레르기가 있으면","ja":"唐辛子にアレルギーがある場合"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Redness, irritation, or severe burning","ko":"붉어짐, 자극, 심한 화끈거림","ja":"赤み、刺激、強い焼けるような感じ"},{"en":"Condition worsens or lasts more than 7 days","ko":"증상이 나빠지거나 7일 넘게 지속","ja":"悪化する、7日以上続く"}],"key_warning":{"en":"Keep it away from the eyes, nose and mouth — wash your hands well after every use.","ko":"눈·코·입에 닿지 않게 하고, 쓸 때마다 손을 잘 씻으세요.","ja":"目・鼻・口に触れないよう、使うたびに手をよく洗ってください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":[],"classes":[],"supplement_note":null,"sources":[{"title":"DailyMed — Capsaicin HP Arthritis Pain Relief (capsaicin 0.1%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4dedfc37-fead-410d-a5d4-48a4de8fc432"}],"verified":"2026-10-22"},{"id":"methyl-salicylate-patch","kind":"otc","category":"pain","name":{"en":"Menthol + methyl salicylate patch","ko":"멘톨 + 살리실산메틸 파스","ja":"メントール＋サリチル酸メチル貼付剤"},"aka":["Salonpas","파스","サロンパス","methyl salicylate","menthol"],"brands":["Salonpas Pain Relief Patch","Bengay patch","Icy Hot"],"active":[{"ingredient":"methyl salicylate","strength":"10% (Salonpas Pain Relief Patch)","purpose":{"en":"Topical analgesic (NSAID)","ko":"국소 진통제 (NSAID)","ja":"外用鎮痛薬（NSAID）"}},{"ingredient":"menthol","strength":"3%","purpose":{"en":"Topical analgesic","ko":"국소 진통제","ja":"外用鎮痛薬"}}],"uses":{"en":"Temporarily relieves mild to moderate muscle and joint pain from strains, sprains, simple backache, arthritis and bruises.","ko":"근육 결림, 삔 곳, 단순 요통, 관절염, 멍의 가벼운~중간 근육·관절 통증을 일시적으로 덜어 줍니다.","ja":"筋違い、ねんざ、腰痛、関節炎、打ち身による軽度〜中等度の筋肉・関節痛を一時的にやわらげます。"},"directions_adult":{"en":"Adults 18 and over: one patch at a time on clean, dry skin for up to 8 to 12 hours; if pain continues, a second patch for up to another 8 to 12 hours. Remove the old patch first.","ko":"18세 이상: 깨끗하고 마른 피부에 한 번에 1장, 최대 8~12시간. 통증이 계속되면 두 번째 패치를 최대 8~12시간 더. 새 패치 전에 이전 패치를 떼세요.","ja":"18歳以上: 清潔で乾いた皮膚に一度に1枚、最長8〜12時間。痛みが続けば2枚目をさらに8〜12時間。前の1枚をはがしてから。"},"max_daily":{"en":"No more than 2 patches a day, and no more than 3 days in a row.","ko":"하루 2장까지, 연속 3일까지.","ja":"1日2枚まで、連続3日まで。"},"children":{"en":"Under 18: do not use.","ko":"18세 미만: 쓰지 마세요.","ja":"18歳未満: 使用しないでください。"},"do_not_use":[{"en":"On the face, rashes, wounds or damaged skin","ko":"얼굴, 발진, 상처, 손상된 피부","ja":"顔、発疹、傷、傷んだ皮膚"},{"en":"If you are allergic to aspirin or other NSAIDs","ko":"아스피린이나 다른 NSAID에 알레르기가 있으면","ja":"アスピリンや他のNSAIDにアレルギーがある場合"},{"en":"With a heating pad, when sweating, or right before or after heart surgery","ko":"찜질기와 함께, 땀이 날 때, 심장 수술 직전·직후","ja":"温熱パッドと併用、汗をかいている時、心臓手術の直前・直後"}],"ask_doctor":[{"en":"Stomach bleeding risk: age 60 or older, past ulcers or bleeding, blood thinner or steroid, other NSAIDs, 3 or more alcoholic drinks a day","ko":"위출혈 위험: 60세 이상, 궤양·출혈 경험, 혈액 희석제·스테로이드, 다른 NSAID, 하루 3잔 이상 음주","ja":"胃出血のリスク: 60歳以上、潰瘍・出血の既往、血液をサラサラにする薬・ステロイド、他のNSAID、1日3杯以上の飲酒"},{"en":"High blood pressure, heart disease or kidney disease; you take a diuretic","ko":"고혈압, 심장 질환, 신장 질환, 이뇨제 복용","ja":"高血圧、心臓病、腎臓病、利尿薬の使用"}],"ask_pharmacist":[],"stop_use":[{"en":"Signs of stomach bleeding: feeling faint, vomiting blood, bloody or black stools, stomach pain that does not get better","ko":"위출혈 징후: 쓰러질 것 같음, 피를 토함, 피 섞인 변이나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Rash, itching or skin irritation; symptoms last more than 3 days","ko":"발진, 가려움, 피부 자극, 증상이 3일 넘게 지속","ja":"発疹、かゆみ、皮膚の刺激、症状が3日以上続く"}],"key_warning":{"en":"Methyl salicylate is an NSAID (aspirin family) absorbed through the skin: stomach bleeding warnings apply, and do not combine with other NSAIDs or use if you are allergic to aspirin.","ko":"살리실산메틸은 피부로 흡수되는 NSAID(아스피린 계열)입니다. 위출혈 경고가 적용되며, 다른 NSAID와 함께 쓰거나 아스피린 알레르기가 있으면 쓰지 마세요.","ja":"サリチル酸メチルは皮膚から吸収されるNSAID（アスピリンの仲間）です。胃出血の注意が当てはまり、他のNSAIDとの併用やアスピリンアレルギーの方の使用は避けてください。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding.","ko":"라벨은 60세 이상을 위출혈 위험이 높은 경우로 적고 있습니다.","ja":"ラベルは60歳以上を胃出血のリスクが高い人としています。"},"pregnancy":{"en":"Ask a health professional before use. Do not use at 20 weeks of pregnancy or later unless a doctor directs.","ko":"사용 전 의료인에게 물어보세요. 의사 지시 없이 임신 20주 이후에는 쓰지 마세요.","ja":"使用前に医療専門家に相談。医師の指示がなければ妊娠20週以降は使わないでください。"},"flags":["stomach","bleeding","blood_thinner","bp","heart","kidney","seniors","pregnancy","alcohol"],"classes":["salicylate"],"supplement_note":null,"sources":[{"title":"DailyMed — Salonpas Pain Relief Patch (menthol 3%, methyl salicylate 10%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=724bc4d3-0bc1-4275-a23b-4bbc62fbc0d2"}],"verified":"2026-10-22"},{"id":"excedrin","kind":"otc","category":"pain","name":{"en":"Acetaminophen + aspirin + caffeine","ko":"아세트아미노펜 + 아스피린 + 카페인","ja":"アセトアミノフェン＋アスピリン＋カフェイン"},"aka":["Excedrin","headache combination","엑세드린"],"brands":["Excedrin Extra Strength","Excedrin Migraine","store brand headache relief"],"active":[{"ingredient":"acetaminophen","strength":"250 mg","purpose":{"en":"Pain reliever","ko":"진통제","ja":"鎮痛薬"}},{"ingredient":"aspirin","strength":"250 mg","purpose":{"en":"Pain reliever (NSAID)","ko":"진통제 (NSAID)","ja":"鎮痛薬（NSAID）"}},{"ingredient":"caffeine","strength":"65 mg","purpose":{"en":"Pain reliever aid","ko":"진통 보조","ja":"鎮痛補助"}}],"uses":{"en":"Temporarily relieves minor aches and pains from headache, colds, arthritis, muscle aches, toothache, and menstrual cramps.","ko":"두통, 감기, 관절염, 근육통, 치통, 생리통의 가벼운 통증을 일시적으로 덜어 줍니다.","ja":"頭痛、かぜ、関節炎、筋肉痛、歯痛、生理痛の軽い痛みを一時的にやわらげます。"},"directions_adult":{"en":"Adults and children 12 and over: 2 caplets every 6 hours with a full glass of water.","ko":"성인 및 12세 이상: 6시간마다 2정, 물 한 컵과 함께.","ja":"成人と12歳以上: 6時間ごとに2錠、コップ1杯の水で。"},"max_daily":{"en":"Not more than 8 caplets in 24 hours.","ko":"24시간에 8정을 넘기지 마세요.","ja":"24時間で8錠を超えないでください。"},"children":{"en":"Under 12: ask a doctor. Children and teenagers recovering from chickenpox or flu-like symptoms should not use it (Reye's syndrome).","ko":"12세 미만: 의사에게 물어보세요. 수두나 독감 같은 증상에서 회복 중인 어린이·청소년은 쓰지 마세요(라이 증후군).","ja":"12歳未満: 医師に相談。水ぼうそうやインフルエンザのような症状から回復中の子ども・10代は使わないでください（ライ症候群）。"},"do_not_use":[{"en":"With any other medicine containing acetaminophen","ko":"아세트아미노펜이 든 다른 약과 함께","ja":"アセトアミノフェンを含む他の薬と一緒に"},{"en":"If you have had an allergic reaction to acetaminophen, aspirin or another pain reliever","ko":"아세트아미노펜, 아스피린, 다른 진통제에 알레르기 반응이 있었으면","ja":"アセトアミノフェン、アスピリン、他の鎮痛薬でアレルギー反応があった場合"}],"ask_doctor":[{"en":"Liver disease, stomach problems, high blood pressure, heart disease, liver cirrhosis, kidney disease or asthma","ko":"간 질환, 위장 문제, 고혈압, 심장 질환, 간경변, 신장 질환, 천식","ja":"肝臓病、胃の不調、高血圧、心臓病、肝硬変、腎臓病、ぜんそく"},{"en":"Stomach bleeding risk: age 60 or older, past ulcers or bleeding, blood thinner or steroid, other NSAIDs, 3 or more alcoholic drinks a day","ko":"위출혈 위험: 60세 이상, 궤양·출혈 경험, 혈액 희석제·스테로이드, 다른 NSAID, 하루 3잔 이상 음주","ja":"胃出血のリスク: 60歳以上、潰瘍・出血の既往、血液をサラサラにする薬・ステロイド、他のNSAID、1日3杯以上の飲酒"},{"en":"You take a diuretic","ko":"이뇨제 복용","ja":"利尿薬の使用"}],"ask_pharmacist":[{"en":"Prescription medicines for diabetes, gout or arthritis, or any other medicine","ko":"당뇨, 통풍, 관절염 처방약이나 다른 약","ja":"糖尿病、痛風、関節炎の処方薬、その他の薬"}],"stop_use":[{"en":"Signs of stomach bleeding: feeling faint, vomiting blood, bloody or black stools, stomach pain that does not get better","ko":"위출혈 징후: 쓰러질 것 같음, 피를 토함, 피 섞인 변이나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Ringing in the ears or hearing loss","ko":"귀울림이나 청력 저하","ja":"耳鳴りや聞こえにくさ"},{"en":"Pain lasts more than 10 days or fever more than 3 days","ko":"통증 10일·열 3일 넘게 지속","ja":"痛み10日以上・熱3日以上続く"}],"key_warning":{"en":"Two pain relievers in one pill: count the acetaminophen toward your daily limit, and the aspirin can cause stomach bleeding. The dose has about as much caffeine as a cup of coffee.","ko":"한 알에 진통제가 두 가지 들어 있습니다. 아세트아미노펜은 하루 총량에 포함해 계산하고, 아스피린은 위출혈을 일으킬 수 있습니다. 1회분에 커피 한 잔 정도의 카페인이 있습니다.","ja":"1錠に鎮痛薬が2種類入っています。アセトアミノフェンは1日の総量に含めて数え、アスピリンは胃出血を起こすことがあります。1回分にコーヒー1杯ほどのカフェインがあります。"},"older_adults":{"en":"The label lists age 60 or older as a higher risk for stomach bleeding.","ko":"라벨은 60세 이상을 위출혈 위험이 높은 경우로 적고 있습니다.","ja":"ラベルは60歳以上を胃出血のリスクが高い人としています。"},"pregnancy":{"en":"Ask a health professional before use. Avoid aspirin in the last 3 months of pregnancy unless a doctor directs.","ko":"사용 전 의료인에게 물어보세요. 의사 지시 없이 임신 마지막 3개월에는 아스피린을 피하세요.","ja":"使用前に医療専門家に相談。医師の指示がなければ妊娠最後の3か月はアスピリンを避けてください。"},"flags":["liver","stomach","bleeding","blood_thinner","bp","heart","kidney","asthma","seniors","pregnancy","alcohol","children","diabetes"],"classes":["acetaminophen","salicylate"],"supplement_note":null,"sources":[{"title":"DailyMed — Excedrin Extra Strength Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7f0f8b3c-c226-4a3a-af46-a708f345e4f5"}],"verified":"2026-10-22"},{"id":"acetaminophen-pm","kind":"otc","category":"sleep","name":{"en":"Acetaminophen PM (with diphenhydramine)","ko":"아세트아미노펜 PM (디펜히드라민 포함)","ja":"アセトアミノフェンPM（ジフェンヒドラミン配合）"},"aka":["Tylenol PM","night pain reliever"],"brands":["Tylenol PM Extra Strength","store brand Pain Relief PM"],"active":[{"ingredient":"acetaminophen","strength":"500 mg","purpose":{"en":"Pain reliever","ko":"진통제","ja":"鎮痛薬"}},{"ingredient":"diphenhydramine","strength":"25 mg (HCl)","purpose":{"en":"Nighttime sleep aid","ko":"수면 보조","ja":"睡眠補助"}}],"uses":{"en":"Short-term relief of occasional headaches and minor aches and pains with sleeplessness.","ko":"잠을 못 이룰 때 동반되는 가끔의 두통과 가벼운 통증을 단기간 덜어 줍니다.","ja":"眠れない時に伴うときどきの頭痛や軽い痛みを短期間やわらげます。"},"directions_adult":{"en":"Adults and children 12 and over: 2 caplets at bedtime.","ko":"성인 및 12세 이상: 잠자기 전 2정.","ja":"成人と12歳以上: 寝る前に2錠。"},"max_daily":{"en":"Do not take more than 2 caplets in 24 hours.","ko":"24시간에 2정을 넘기지 마세요.","ja":"24時間で2錠を超えないでください。"},"children":{"en":"Under 12: do not use.","ko":"12세 미만: 쓰지 마세요.","ja":"12歳未満: 使用しないでください。"},"do_not_use":[{"en":"With any other medicine containing acetaminophen","ko":"아세트아미노펜이 든 다른 약과 함께","ja":"アセトアミノフェンを含む他の薬と一緒に"},{"en":"With any other diphenhydramine product, even one used on the skin","ko":"다른 디펜히드라민 제품(피부에 바르는 것 포함)과 함께","ja":"他のジフェンヒドラミン製品（皮膚に塗るものも含む）と一緒に"}],"ask_doctor":[{"en":"Liver disease; emphysema or chronic bronchitis; trouble urinating from an enlarged prostate; glaucoma","ko":"간 질환, 폐기종·만성 기관지염, 전립선 비대로 소변보기 어려움, 녹내장","ja":"肝臓病、肺気腫・慢性気管支炎、前立腺肥大による排尿困難、緑内障"}],"ask_pharmacist":[{"en":"The blood thinner warfarin; sedatives or tranquilizers","ko":"혈액 희석제 와파린, 진정제·신경안정제","ja":"ワルファリン、鎮静薬・精神安定薬"}],"stop_use":[{"en":"Sleeplessness lasts more than 2 weeks — it can be a sign of another illness","ko":"불면이 2주 넘게 계속될 때 — 다른 병의 신호일 수 있음","ja":"不眠が2週間以上続く — 他の病気のサインのことがある"},{"en":"Pain lasts more than 10 days or fever more than 3 days","ko":"통증 10일·열 3일 넘게 지속","ja":"痛み10日以上・熱3日以上続く"}],"key_warning":{"en":"This is the same acetaminophen as Tylenol plus a drowsy antihistamine. Do not add another acetaminophen product, and expect drowsiness the next morning in older adults.","ko":"타이레놀과 같은 아세트아미노펜에 졸리는 항히스타민제가 더해진 약입니다. 다른 아세트아미노펜 제품을 더하지 마세요. 어르신은 다음 날 아침까지 졸릴 수 있습니다.","ja":"タイレノールと同じアセトアミノフェンに眠くなる抗ヒスタミン薬を加えた薬です。他のアセトアミノフェン製品を重ねないでください。高齢の方は翌朝まで眠気が残ることがあります。"},"older_adults":{"en":"Diphenhydramine is a first-generation antihistamine on the American Geriatrics Society Beers Criteria list of medicines older adults should avoid.","ko":"디펜히드라민은 미국노인의학회 Beers 기준에서 노인이 피해야 할 1세대 항히스타민제로 올라 있습니다.","ja":"ジフェンヒドラミンは米国老年医学会のBeers基準で高齢者が避けるべき第一世代抗ヒスタミン薬に挙げられています。"},"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["liver","alcohol","blood_thinner","glaucoma","prostate","sedation","seniors"],"classes":["acetaminophen","sedating_antihistamine","sleep_aid"],"supplement_note":null,"sources":[{"title":"DailyMed — Tylenol PM Extra Strength Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=639f4e01-9723-a619-e053-2991aa0a549a"},{"title":"AGS Health in Aging Foundation — Alternatives for Medications Listed in the AGS Beers Criteria (April 2023)","url":"https://www.healthinaging.org/sites/default/files/media/pdf/HIA-LearnMore-BEERS-alternatives23.pdf"}],"verified":"2026-10-22"},{"id":"ibuprofen-pm","kind":"otc","category":"sleep","name":{"en":"Ibuprofen PM (with diphenhydramine)","ko":"이부프로펜 PM (디펜히드라민 포함)","ja":"イブプロフェンPM（ジフェンヒドラミン配合）"},"aka":["Advil PM","Motrin PM"],"brands":["Advil PM","store brand Ibuprofen PM"],"active":[{"ingredient":"ibuprofen","strength":"200 mg","purpose":{"en":"Pain reliever (NSAID)","ko":"진통제 (NSAID)","ja":"鎮痛薬（NSAID）"}},{"ingredient":"diphenhydramine","strength":"38 mg (citrate)","purpose":{"en":"Nighttime sleep aid","ko":"수면 보조","ja":"睡眠補助"}}],"uses":{"en":"Relief of occasional sleeplessness that comes with minor aches and pains.","ko":"가벼운 통증과 함께 오는 가끔의 불면을 덜어 줍니다.","ja":"軽い痛みに伴うときどきの不眠をやわらげます。"},"directions_adult":{"en":"Adults and children 12 and over: 2 caplets at bedtime. Take with food or milk if your stomach is upset.","ko":"성인 및 12세 이상: 잠자기 전 2정. 속이 불편하면 음식이나 우유와 함께.","ja":"成人と12歳以上: 寝る前に2錠。胃が不快なら食べ物か牛乳と一緒に。"},"max_daily":{"en":"Do not take more than 2 caplets in 24 hours.","ko":"24시간에 2정을 넘기지 마세요.","ja":"24時間で2錠を超えないでください。"},"children":{"en":"Under 12: do not use.","ko":"12세 미만: 쓰지 마세요.","ja":"12歳未満: 使用しないでください。"},"do_not_use":[{"en":"If you have sleeplessness without pain, or do not have time for a full night's sleep","ko":"통증 없이 잠만 못 자는 경우, 또는 밤잠을 충분히 잘 시간이 없을 때","ja":"痛みのない不眠、または十分な睡眠時間がない時"},{"en":"With any other diphenhydramine product; right before or after heart surgery","ko":"다른 디펜히드라민 제품과 함께, 심장 수술 직전·직후","ja":"他のジフェンヒドラミン製品と一緒に、心臓手術の直前・直後"}],"ask_doctor":[{"en":"Stomach bleeding risk: age 60 or older, past ulcers or bleeding, blood thinner or steroid, other NSAIDs, 3 or more alcoholic drinks a day","ko":"위출혈 위험: 60세 이상, 궤양·출혈 경험, 혈액 희석제·스테로이드, 다른 NSAID, 하루 3잔 이상 음주","ja":"胃出血のリスク: 60歳以上、潰瘍・出血の既往、血液をサラサラにする薬・ステロイド、他のNSAID、1日3杯以上の飲酒"},{"en":"High blood pressure, heart disease, liver cirrhosis, kidney disease, asthma, emphysema or chronic bronchitis, glaucoma, or trouble urinating from an enlarged prostate","ko":"고혈압, 심장 질환, 간경변, 신장 질환, 천식, 폐기종·만성 기관지염, 녹내장, 전립선 비대로 인한 배뇨 곤란","ja":"高血圧、心臓病、肝硬変、腎臓病、ぜんそく、肺気腫・慢性気管支炎、緑内障、前立腺肥大による排尿困難"}],"ask_pharmacist":[{"en":"Sedatives, tranquilizers, another sleep aid or antihistamine; aspirin for heart attack or stroke","ko":"진정제, 신경안정제, 다른 수면제나 항히스타민제, 심장 예방용 아스피린","ja":"鎮静薬、精神安定薬、他の睡眠薬・抗ヒスタミン薬、心臓予防のアスピリン"}],"stop_use":[{"en":"Signs of stomach bleeding: feeling faint, vomiting blood, bloody or black stools, stomach pain that does not get better","ko":"위출혈 징후: 쓰러질 것 같음, 피를 토함, 피 섞인 변이나 검은 변, 낫지 않는 복통","ja":"胃出血の兆候: 気が遠くなる、吐血、血便や黒い便、治らない腹痛"},{"en":"Sleeplessness lasts more than 2 weeks; pain lasts more than 10 days","ko":"불면 2주 이상, 통증 10일 이상 지속","ja":"不眠が2週間以上、痛みが10日以上続く"}],"key_warning":{"en":"An NSAID plus a drowsy antihistamine: the stomach-bleeding and heart warnings of ibuprofen apply, and you will be drowsy — avoid alcohol and driving.","ko":"NSAID에 졸리는 항히스타민제가 더해진 약입니다. 이부프로펜의 위출혈·심장 경고가 그대로 적용되고 졸리게 됩니다 — 술과 운전을 피하세요.","ja":"NSAIDに眠くなる抗ヒスタミン薬を加えた薬です。イブプロフェンの胃出血・心臓の注意がそのまま当てはまり、眠くなります — 飲酒と運転は避けてください。"},"older_adults":{"en":"Diphenhydramine is on the AGS Beers Criteria list of medicines older adults should avoid, and AGS advises avoiding NSAIDs such as ibuprofen with heart failure or kidney disease. The label lists age 60 or older as a higher stomach-bleeding risk.","ko":"디펜히드라민은 AGS Beers 기준에서 노인이 피해야 할 약이며, AGS는 심부전·신장 질환이 있으면 이부프로펜 같은 NSAID를 피하라고 합니다. 라벨은 60세 이상을 위출혈 고위험으로 적고 있습니다.","ja":"ジフェンヒドラミンはAGS Beers基準で高齢者が避けるべき薬で、AGSは心不全・腎臓病があればイブプロフェンなどのNSAIDを避けるよう勧めています。ラベルは60歳以上を胃出血の高リスクとしています。"},"pregnancy":{"en":"Ask a health professional before use. Do not use ibuprofen in the last 3 months of pregnancy unless a doctor directs.","ko":"사용 전 의료인에게 물어보세요. 의사 지시 없이 임신 마지막 3개월에는 쓰지 마세요.","ja":"使用前に医療専門家に相談。医師の指示がなければ妊娠最後の3か月は使わないでください。"},"flags":["stomach","bleeding","blood_thinner","bp","heart","kidney","asthma","glaucoma","prostate","sedation","seniors","pregnancy","alcohol"],"classes":["nsaid","sedating_antihistamine","sleep_aid"],"supplement_note":null,"sources":[{"title":"DailyMed — Advil PM Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a3c30dd2-75f3-4f8b-88d7-4a63dea5bad7"},{"title":"AGS Health in Aging Foundation — Alternatives for Medications Listed in the AGS Beers Criteria (April 2023)","url":"https://www.healthinaging.org/sites/default/files/media/pdf/HIA-LearnMore-BEERS-alternatives23.pdf"}],"verified":"2026-10-22"},{"aka":["anti-itch cream","Cortizone-10","steroid cream","가려움 연고","かゆみ止め"],"brands":["Cortizone-10","store brand hydrocortisone 1%"],"active":[{"ingredient":"hydrocortisone","strength":"1%","purpose":{"en":"Anti-itch","ko":"가려움 완화제","ja":"かゆみ止め"}}],"directions_adult":{"en":"Adults and children 2+: apply to the affected area no more than 3 to 4 times a day.","ko":"성인 및 2세 이상: 하루 3~4번 이하로 해당 부위에 바르세요.","ja":"大人と2歳以上: 患部に1日3〜4回まで塗る。"},"max_daily":{"en":"3 to 4 times a day.","ko":"하루 3~4번.","ja":"1日3〜4回。"},"children":{"en":"Under 2: do not use; ask a doctor. Anal itching under 12: ask a doctor.","ko":"2세 미만: 사용하지 말고 의사에게. 12세 미만 항문 가려움: 의사에게.","ja":"2歳未満: 使わず医師に相談。12歳未満の肛門のかゆみ: 医師に相談。"},"do_not_use":[{"en":"On diaper rash, unless a doctor says so","ko":"의사 지시 없이 기저귀 발진에","ja":"医師の指示なくおむつかぶれに"},{"en":"For external genital itching if there is vaginal discharge — see a doctor","ko":"질 분비물이 있는데 외음부 가려움에 — 진료를","ja":"おりものがあるときの外陰部のかゆみ — 受診を"},{"en":"Inside the rectum (with fingers or an applicator)","ko":"직장 안(손가락이나 기구로)","ja":"直腸の中（指や器具で）"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"The condition gets worse, lasts more than 7 days, or clears and comes back within a few days","ko":"증상이 악화되거나 7일 넘게 지속되거나, 나았다가 며칠 안에 재발할 때","ja":"悪化する、7日を超えて続く、または治っても数日で再発する"},{"en":"Bleeding (with anal use)","ko":"출혈(항문 사용 시)","ja":"出血（肛門に使った場合）"}],"key_warning":{"en":"For external use only. Keep out of the eyes. Do not use for more than 7 days without a doctor.","ko":"외용으로만 쓰세요. 눈에 들어가지 않게 하세요. 의사 상담 없이 7일 넘게 쓰지 마세요.","ja":"外用のみ。目に入らないようにしてください。医師に相談せず7日を超えて使わないでください。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"hydrocortisone-cream","kind":"otc","category":"skin","name":{"en":"Hydrocortisone 1% cream","ko":"하이드로코르티손 1% 크림","ja":"ヒドロコルチゾン1%クリーム"},"uses":{"en":"Temporarily relieves itching from minor skin irritation, inflammation and rashes — eczema, insect bites, poison ivy/oak/sumac, soaps, detergents, cosmetics, jewelry, seborrheic dermatitis, psoriasis, and external genital or anal itching.","ko":"가벼운 피부 자극·염증·발진으로 인한 가려움을 일시적으로 완화합니다 — 습진, 벌레 물림, 옻나무류, 비누·세제·화장품·장신구, 지루성 피부염, 건선, 외음부·항문 가려움.","ja":"軽い皮膚の刺激・炎症・発疹によるかゆみを一時的にやわらげます — 湿疹、虫さされ、ウルシ類、石けん・洗剤・化粧品・アクセサリー、脂漏性皮膚炎、乾癬、外陰部・肛門のかゆみ。"},"sources":[{"title":"DailyMed — CVS Health Hydrocortisone 1% Anti-Itch Cream Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=546a1b8a-8254-432a-85c4-38ebee5ad568"}]},{"aka":["Neosporin","antibiotic ointment","후시딘 대신","抗生物質軟膏"],"brands":["Neosporin Original","store brand triple antibiotic"],"active":[{"ingredient":"bacitracin zinc","strength":"400 units per g","purpose":{"en":"First aid antibiotic","ko":"응급 항생제","ja":"応急用抗生物質"}},{"ingredient":"neomycin sulfate","strength":"3.5 mg per g","purpose":{"en":"First aid antibiotic","ko":"응급 항생제","ja":"応急用抗生物質"}},{"ingredient":"polymyxin b sulfate","strength":"5,000 units per g","purpose":{"en":"First aid antibiotic","ko":"응급 항생제","ja":"応急用抗生物質"}}],"directions_adult":{"en":"Clean the area. Apply a small amount (about a fingertip) 1 to 3 times a day. May cover with a sterile bandage.","ko":"상처를 깨끗이 하고 손가락 끝만큼 소량을 하루 1~3번 바르세요. 멸균 밴드로 덮어도 됩니다.","ja":"傷をきれいにし、指先ほどの少量を1日1〜3回塗る。滅菌ばんそうこうで覆ってもよい。"},"max_daily":{"en":"3 times a day; no more than 1 week.","ko":"하루 3번, 1주 이내.","ja":"1日3回、1週間まで。"},"children":null,"do_not_use":[{"en":"If allergic to any ingredient","ko":"성분에 알레르기가 있을 때","ja":"成分にアレルギーがある"},{"en":"In the eyes","ko":"눈에","ja":"目に"},{"en":"Over large areas of the body","ko":"몸의 넓은 부위에","ja":"体の広い範囲に"}],"ask_doctor":[{"en":"Deep or puncture wounds, animal bites, or serious burns","ko":"깊거나 찔린 상처, 동물에 물린 상처, 심한 화상","ja":"深い傷や刺し傷、動物にかまれた傷、重いやけど"}],"ask_pharmacist":[],"stop_use":[{"en":"You need it for more than 1 week, or the wound does not improve or gets worse","ko":"1주 넘게 필요하거나 상처가 낫지 않거나 악화될 때","ja":"1週間を超えて必要、または傷が治らない・悪化する"},{"en":"A rash or other allergic reaction","ko":"발진 등 알레르기 반응","ja":"発疹などのアレルギー反応"}],"key_warning":{"en":"Animal bites, puncture wounds and serious burns need a doctor, not just ointment. Neomycin can cause skin allergy — stop if a rash appears.","ko":"동물에 물린 상처, 찔린 상처, 심한 화상은 연고만으로 안 되고 진료가 필요합니다. 네오마이신은 피부 알레르기를 일으킬 수 있으니 발진이 생기면 중단하세요.","ja":"動物にかまれた傷、刺し傷、重いやけどは軟膏だけでなく受診が必要です。ネオマイシンは皮膚アレルギーを起こすことがあり、発疹が出たら中止してください。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"triple-antibiotic","kind":"otc","category":"first_aid","name":{"en":"Triple antibiotic ointment","ko":"3중 항생제 연고","ja":"3種抗生物質軟膏"},"uses":{"en":"Helps prevent infection in minor cuts, scrapes and burns.","ko":"가벼운 베인 상처, 긁힌 상처, 화상의 감염 예방을 돕습니다.","ja":"軽い切り傷、すり傷、やけどの感染予防を助けます。"},"sources":[{"title":"DailyMed — Neosporin Original ointment Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a3e6fe2e-1b74-4f22-9c7c-a00057439690"}]},{"aka":["Lotrimin AF","athlete's foot","무좀약","水虫薬"],"brands":["Lotrimin AF","store brand athlete's foot cream"],"active":[{"ingredient":"clotrimazole","strength":"1%","purpose":{"en":"Antifungal","ko":"항진균제","ja":"抗真菌薬"}}],"directions_adult":{"en":"Wash and dry the area well. Apply a thin layer twice a day (morning and night) every day for 2 weeks. Not effective on scalp or nails.","ko":"씻고 잘 말린 뒤 하루 2번(아침·저녁) 얇게 바르고 2주간 매일 사용하세요. 두피나 손발톱에는 효과가 없습니다.","ja":"洗ってよく乾かし、1日2回（朝・夜）薄く塗り、2週間毎日使う。頭皮や爪には効きません。"},"max_daily":{"en":"Twice a day.","ko":"하루 2번.","ja":"1日2回。"},"children":{"en":"Under 2: only if a doctor directs. Supervise children who use it.","ko":"2세 미만: 의사 지시가 있을 때만. 아이가 쓸 때는 지켜보세요.","ja":"2歳未満: 医師の指示があるときのみ。子どもが使うときは見守る。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Irritation occurs, or no improvement within 2 weeks","ko":"자극이 생기거나 2주 안에 나아지지 않을 때","ja":"刺激が出る、または2週間で良くならない"}],"key_warning":{"en":"For external use only. Keep out of the eyes. Nail and scalp fungus need a doctor.","ko":"외용으로만 쓰세요. 눈에 들어가지 않게 하세요. 손발톱·두피 곰팡이는 진료가 필요합니다.","ja":"外用のみ。目に入らないようにしてください。爪や頭皮のカビは受診が必要です。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"clotrimazole-cream","kind":"otc","category":"skin","name":{"en":"Clotrimazole 1% cream","ko":"클로트리마졸 1% 크림","ja":"クロトリマゾール1%クリーム"},"uses":{"en":"Cures most athlete's foot, jock itch and ringworm, and relieves the itching, burning, scaling and discomfort.","ko":"대부분의 무좀, 사타구니 완선, 체부 백선을 치료하고 가려움·화끈거림·각질·불편감을 덜어 줍니다.","ja":"ほとんどの水虫、いんきんたむし、ぜにたむしを治し、かゆみ・ヒリヒリ・皮むけ・不快感をやわらげます。"},"sources":[{"title":"DailyMed — up&up Athlete's Foot (clotrimazole 1%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=52b61859-11ae-4990-aa0c-9dc1dd00adf4"}]},{"aka":["Lamisil AT","athlete's foot","무좀약","水虫薬"],"brands":["Lamisil AT","store brand terbinafine cream"],"active":[{"ingredient":"terbinafine hydrochloride","strength":"1%","purpose":{"en":"Antifungal","ko":"항진균제","ja":"抗真菌薬"}}],"directions_adult":{"en":"Ages 12+: wash and dry the area. Athlete's foot between the toes: twice a day for 1 week. Bottom or sides of the foot: twice a day for 2 weeks. Jock itch and ringworm: once a day for 1 week. Wash hands after use.","ko":"12세 이상: 씻고 말린 뒤 — 발가락 사이 무좀: 하루 2번 1주. 발바닥·옆면: 하루 2번 2주. 완선·백선: 하루 1번 1주. 바른 뒤 손을 씻으세요.","ja":"12歳以上: 洗って乾かす — 指の間の水虫: 1日2回1週間。足の裏・側面: 1日2回2週間。いんきん・ぜにたむし: 1日1回1週間。使用後は手を洗う。"},"max_daily":{"en":"Twice a day (once a day for jock itch and ringworm).","ko":"하루 2번(완선·백선은 하루 1번).","ja":"1日2回（いんきん・ぜにたむしは1日1回）。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"On nails or scalp","ko":"손발톱이나 두피에","ja":"爪や頭皮に"},{"en":"In or near the mouth or eyes","ko":"입이나 눈 안·근처에","ja":"口や目の中・近くに"},{"en":"For vaginal yeast infections","ko":"질 칸디다증에","ja":"膣カンジダに"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Irritation is severe or gets worse","ko":"자극이 심하거나 악화될 때","ja":"刺激が強い・悪化する"}],"key_warning":{"en":"Shorter course than other antifungal creams — follow the weeks for your type of infection. Nail fungus needs a doctor.","ko":"다른 무좀 크림보다 사용 기간이 짧습니다 — 부위별 기간을 지키세요. 손발톱 무좀은 진료가 필요합니다.","ja":"他の水虫クリームより期間が短いです — 部位ごとの期間を守ってください。爪水虫は受診が必要です。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"terbinafine-cream","kind":"otc","category":"skin","name":{"en":"Terbinafine 1% cream","ko":"테르비나핀 1% 크림","ja":"テルビナフィン1%クリーム"},"uses":{"en":"Treats most athlete's foot, jock itch and ringworm, and relieves itching, burning, cracking and scaling.","ko":"대부분의 무좀, 사타구니 완선, 체부 백선을 치료하고 가려움·화끈거림·갈라짐·각질을 덜어 줍니다.","ja":"ほとんどの水虫、いんきんたむし、ぜにたむしを治し、かゆみ・ヒリヒリ・ひび割れ・皮むけをやわらげます。"},"sources":[{"title":"DailyMed — Lamisil AT Cream (terbinafine HCl 1%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=9dea4789-bf1c-1577-e053-2a95a90a5381"}]},{"aka":["Orajel","toothache gel","치통약","歯痛"],"brands":["Orajel","store brand oral pain relief gel"],"active":[{"ingredient":"benzocaine","strength":"20%","purpose":{"en":"Oral pain reliever","ko":"구강 진통제","ja":"口腔鎮痛薬"}},{"ingredient":"menthol","strength":"0.26%","purpose":{"en":"Oral pain reliever","ko":"구강 진통제","ja":"口腔鎮痛薬"}},{"ingredient":"zinc chloride","strength":"0.15%","purpose":{"en":"Oral astringent","ko":"구강 수렴제","ja":"口腔収れん薬"}}],"directions_adult":{"en":"Adults and children 2+: apply to the affected area up to 4 times a day, or as a dentist or doctor directs.","ko":"성인 및 2세 이상: 하루 최대 4번 해당 부위에 바르세요. 또는 치과의사·의사 지시대로.","ja":"大人と2歳以上: 患部に1日4回まで塗る。または歯科医・医師の指示どおり。"},"max_daily":{"en":"4 times a day; no more than 7 days unless a dentist or doctor directs.","ko":"하루 4번, 치과의사·의사 지시 없이 7일 이내.","ja":"1日4回、歯科医・医師の指示がなければ7日まで。"},"children":{"en":"Ages 2–12: ask a doctor first and supervise use. Under 2: do not use. Never for teething.","ko":"2~12세: 먼저 의사에게 묻고 사용을 지켜보세요. 2세 미만: 사용 금지. 이가 날 때 절대 사용 금지.","ja":"2〜12歳: 先に医師に相談し、使用を見守る。2歳未満: 使用しない。歯が生えるときには使わない。"},"do_not_use":[{"en":"For teething, or in children under 2","ko":"이가 날 때, 또는 2세 미만","ja":"歯が生えるとき、または2歳未満"},{"en":"If allergic to 'caine' numbing medicines (procaine, butacaine, benzocaine and others)","ko":"'-카인' 계열 마취제(프로카인, 부타카인, 벤조카인 등)에 알레르기가 있을 때","ja":"「〜カイン」系の麻酔薬（プロカイン、ブタカイン、ベンゾカインなど）にアレルギーがある"},{"en":"More than directed, or for more than 7 days","ko":"정해진 것보다 많이, 또는 7일 넘게","ja":"決められた以上、または7日を超えて"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Symptoms do not improve in 7 days, or swelling, rash or fever develops, or irritation, pain or redness continues or worsens","ko":"7일 안에 나아지지 않거나, 부기·발진·열이 생기거나, 자극·통증·발적이 계속·악화될 때","ja":"7日で良くならない、腫れ・発疹・発熱が出る、刺激・痛み・赤みが続く・悪化する"}],"key_warning":{"en":"Benzocaine can cause methemoglobinemia, a serious drop in blood oxygen, even if you used it before. Get emergency help for pale, gray or blue skin, headache, fast heartbeat, shortness of breath, dizziness, or tiredness. Never use for teething.","ko":"벤조카인은 이전에 써 봤어도 혈중 산소가 심하게 떨어지는 메트헤모글로빈혈증을 일으킬 수 있습니다. 창백하거나 회색·파란 피부, 두통, 빠른 심장박동, 숨참, 어지러움, 피로가 있으면 즉시 응급 도움을 받으세요. 이가 날 때는 절대 쓰지 마세요.","ja":"ベンゾカインは以前使ったことがあっても、血液の酸素が大きく下がるメトヘモグロビン血症を起こすことがあります。青白い・灰色・青い肌、頭痛、速い脈、息切れ、めまい、だるさがあればすぐ救急へ。歯が生えるときには絶対に使わないでください。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"benzocaine-oral-gel","kind":"otc","category":"oral","name":{"en":"Benzocaine oral gel (toothache)","ko":"벤조카인 구강 젤(치통)","ja":"ベンゾカイン口腔ジェル（歯痛）"},"uses":{"en":"Temporarily relieves pain from minor irritation or injury of the mouth and gums.","ko":"입안과 잇몸의 가벼운 자극이나 상처로 인한 통증을 일시적으로 완화합니다.","ja":"口と歯ぐきの軽い刺激やけがによる痛みを一時的にやわらげます。"},"sources":[{"title":"DailyMed — Orajel 3X Medicated for Toothache & Gum (benzocaine 20%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=99a2b061-0875-59a4-e053-2995a90ab373"}]},{"aka":["Abreva","cold sore","fever blister","입술포진","口唇ヘルペス"],"brands":["Abreva","store brand docosanol"],"active":[{"ingredient":"docosanol","strength":"10%","purpose":{"en":"Cold sore/fever blister treatment","ko":"입술 물집 치료제","ja":"口唇ヘルペス治療薬"}}],"directions_adult":{"en":"Adults and children 12+: wash hands before and after. Start at the first tingle. Rub in gently but completely, 5 times a day until healed.","ko":"12세 이상: 바르기 전후 손을 씻으세요. 따끔거림이 처음 느껴질 때 시작. 하루 5번, 나을 때까지 살살 완전히 문질러 바르세요.","ja":"12歳以上: 塗る前後に手を洗う。ピリピリを感じたらすぐ始める。1日5回、治るまでやさしく完全にすり込む。"},"max_daily":{"en":"5 times a day.","ko":"하루 5번.","ja":"1日5回。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"If allergic to any ingredient","ko":"성분에 알레르기가 있을 때","ja":"成分にアレルギーがある"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"The sore gets worse or is not healed within 10 days","ko":"물집이 악화되거나 10일 안에 낫지 않을 때","ja":"悪化する、または10日で治らない"}],"key_warning":{"en":"Do not share it — that can spread the infection. Keep away from the eyes.","ko":"다른 사람과 같이 쓰지 마세요 — 감염이 옮을 수 있습니다. 눈에 닿지 않게 하세요.","ja":"他の人と共有しないでください — 感染が広がります。目に入れないように。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"docosanol","kind":"otc","category":"skin","name":{"en":"Docosanol 10% cold sore cream","ko":"도코사놀 10% 입술 물집 크림","ja":"ドコサノール10%口唇ヘルペスクリーム"},"uses":{"en":"Treats cold sores/fever blisters on the face or lips; shortens healing time and how long tingling, pain, burning and itching last.","ko":"얼굴·입술의 입술 물집(구순포진)을 치료하고, 낫는 시간과 따끔거림·통증·화끈거림·가려움 기간을 줄입니다.","ja":"顔や唇の口唇ヘルペスを治療し、治るまでの時間と、ピリピリ・痛み・ヒリヒリ・かゆみの期間を短くします。"},"sources":[{"title":"DailyMed — Abreva (docosanol 10%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c39b38a7-dcdd-4c32-8f35-b565c4d3cec6"}]},{"aka":["acne","PanOxyl","여드름","にきび"],"brands":["PanOxyl","Neutrogena On-the-Spot","store brand acne gel"],"active":[{"ingredient":"benzoyl peroxide","strength":"2.5% (also sold as 5% and 10%)","purpose":{"en":"Acne treatment","ko":"여드름 치료제","ja":"にきび治療薬"}}],"directions_adult":{"en":"New users: test on 1 or 2 small areas for 3 days first. Clean the skin, apply a thin layer once a day, and increase to 2 or 3 times a day only if needed. If dryness or peeling bothers you, cut back to once a day or every other day.","ko":"처음 쓰는 경우 3일간 작은 부위 1~2곳에 먼저 시험하세요. 피부를 씻고 하루 1번 얇게 바르고, 필요하면 하루 2~3번으로 늘리세요. 건조·각질이 불편하면 하루 1번 또는 이틀에 1번으로 줄이세요.","ja":"初めての人は3日間、小さな部分1〜2か所で試す。肌を洗い、1日1回薄く塗り、必要なときだけ1日2〜3回に増やす。乾燥や皮むけがつらければ1日1回または1日おきに減らす。"},"max_daily":{"en":"3 times a day.","ko":"하루 3번.","ja":"1日3回。"},"children":null,"do_not_use":[{"en":"Very sensitive skin, or sensitivity to benzoyl peroxide","ko":"매우 민감한 피부, 또는 과산화벤조일에 민감한 경우","ja":"とても敏感な肌、または過酸化ベンゾイルに敏感な場合"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Irritation becomes severe","ko":"자극이 심해질 때","ja":"刺激が強くなる"}],"key_warning":{"en":"Can bleach hair, towels and colored fabric. Use sunscreen and avoid extra sun. Keep away from eyes, lips and mouth. Using other acne products at the same time increases dryness.","ko":"머리카락, 수건, 색깔 옷감을 탈색시킬 수 있습니다. 자외선 차단제를 쓰고 햇빛을 피하세요. 눈·입술·입에 닿지 않게 하세요. 다른 여드름 약과 함께 쓰면 더 건조해집니다.","ja":"髪、タオル、色物の布を脱色することがあります。日焼け止めを使い、日光を避けてください。目・唇・口に触れないように。他のにきび薬と併用すると乾燥が強まります。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"benzoyl-peroxide","kind":"otc","category":"skin","name":{"en":"Benzoyl peroxide acne gel","ko":"과산화벤조일 여드름 젤","ja":"過酸化ベンゾイルにきびジェル"},"uses":{"en":"Treats acne.","ko":"여드름을 치료합니다.","ja":"にきびを治療します。"},"sources":[{"title":"DailyMed — Benzoyl Peroxide 2.5% gel Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0ba5e88c-a4d5-4550-93fa-d3d7fee45f9f"}]},{"aka":["Nix","head lice","머릿니","アタマジラミ"],"brands":["Nix Lice Killing Creme Rinse","store brand lice treatment"],"active":[{"ingredient":"permethrin","strength":"1%","purpose":{"en":"Lice treatment","ko":"머릿니 치료제","ja":"シラミ駆除剤"}}],"directions_adult":{"en":"Wash hair with shampoo without conditioner and towel-dry. Shake, then soak the hair and scalp, starting behind the ears and at the back of the neck, keeping eyes tightly shut and covered. Leave on 10 minutes only, rinse with warm water, then comb out nits. If live lice are seen 7 or more days later, treat again.","ko":"컨디셔너 없는 샴푸로 감고 수건으로 말리세요. 흔든 뒤 귀 뒤와 목덜미부터 머리와 두피를 흠뻑 적시고, 눈은 꼭 감고 가리세요. 정확히 10분 후 미지근한 물로 헹구고 서캐를 빗으로 빼세요. 7일 이상 지나 살아 있는 이가 보이면 한 번 더 치료하세요.","ja":"コンディショナーなしのシャンプーで洗い、タオルで乾かす。よく振り、耳の後ろと首の後ろから髪と頭皮を十分ぬらし、目はしっかり閉じて覆う。10分だけ置いてぬるま湯で流し、卵をくしで取る。7日以上たって生きたシラミがいれば再治療。"},"max_daily":null,"children":{"en":"Do not use on babies under 2 months.","ko":"생후 2개월 미만 아기에게 쓰지 마세요.","ja":"生後2か月未満の赤ちゃんには使わないでください。"},"do_not_use":[{"en":"Near the eyes, or on eyebrows or eyelashes","ko":"눈 근처, 눈썹·속눈썹","ja":"目の近く、まゆ毛・まつ毛"},{"en":"Inside the nose, ears, mouth or vagina","ko":"코·귀·입·질 안","ja":"鼻・耳・口・膣の中"}],"ask_doctor":[{"en":"Ragweed allergy (may cause breathing trouble or an asthma attack)","ko":"돼지풀 알레르기(호흡 곤란·천식 발작 가능)","ja":"ブタクサアレルギー（呼吸困難やぜんそく発作の可能性）"}],"ask_pharmacist":[],"stop_use":[{"en":"Breathing difficulty, eye irritation, or scalp irritation or infection that continues","ko":"호흡 곤란, 눈 자극, 계속되는 두피 자극이나 감염","ja":"呼吸困難、目の刺激、続く頭皮の刺激や感染"}],"key_warning":{"en":"Leave on for 10 minutes only. Protect the eyes; if it gets in, flush with lots of water.","ko":"정확히 10분만 두세요. 눈을 보호하고, 들어가면 물로 충분히 씻어내세요.","ja":"10分だけ置いてください。目を守り、入ったら大量の水で洗い流してください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["asthma","children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"permethrin-lice","kind":"otc","category":"skin","name":{"en":"Permethrin 1% lice treatment","ko":"퍼메트린 1% 머릿니 치료제","ja":"ペルメトリン1%シラミ駆除剤"},"uses":{"en":"Treats head lice.","ko":"머릿니를 치료합니다.","ja":"アタマジラミを駆除します。"},"sources":[{"title":"DailyMed — Nix Lice Killing Creme Rinse (permethrin 1%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=cf7c2429-9ae0-4435-b695-aafd5f207d27"}]},{"aka":["poison ivy","calamine","옻","かぶれ"],"brands":["store brand calamine lotion"],"active":[{"ingredient":"calamine","strength":"8%","purpose":{"en":"Skin protectant","ko":"피부 보호제","ja":"皮膚保護剤"}},{"ingredient":"zinc oxide","strength":"8%","purpose":{"en":"Skin protectant","ko":"피부 보호제","ja":"皮膚保護剤"}}],"directions_adult":{"en":"Adults and children 2+: shake well. Wash the skin with soap and water and let it dry, then apply with cotton or a soft cloth as often as needed.","ko":"성인 및 2세 이상: 잘 흔드세요. 비누와 물로 씻고 말린 뒤, 솜이나 부드러운 천으로 필요할 때마다 바르세요.","ja":"大人と2歳以上: よく振る。石けんと水で洗って乾かし、綿ややわらかい布で必要なだけ塗る。"},"max_daily":null,"children":{"en":"Under 2: ask a doctor.","ko":"2세 미만: 의사에게 물어보세요.","ja":"2歳未満: 医師に相談。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"The condition worsens or does not improve within 7 days","ko":"악화되거나 7일 안에 나아지지 않을 때","ja":"悪化する、または7日で良くならない"}],"key_warning":{"en":"For external use only. Keep away from eyes and the inside of the mouth or nose.","ko":"외용으로만 쓰세요. 눈과 입·코 안에 닿지 않게 하세요.","ja":"外用のみ。目や口・鼻の中に触れないように。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"calamine","kind":"otc","category":"skin","name":{"en":"Calamine lotion","ko":"칼라민 로션","ja":"カラミンローション"},"uses":{"en":"Dries the oozing and weeping of poison ivy, poison oak and poison sumac.","ko":"옻나무류(포이즌 아이비·오크·수맥)로 인한 진물을 말려 줍니다.","ja":"ウルシ類（ポイズンアイビー・オーク・スマック）によるじくじくを乾かします。"},"sources":[{"title":"DailyMed — Calamine (calamine 8%, zinc oxide 8%) lotion Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=61929c97-bd6b-0d7c-e053-2991aa0aa571"}]},{"aka":["Betadine","iodine","빨간약","ポビドンヨード","イソジン"],"brands":["Betadine","store brand povidone-iodine"],"active":[{"ingredient":"povidone-iodine","strength":"10% (1% available iodine)","purpose":{"en":"First aid antiseptic","ko":"응급 소독제","ja":"応急消毒薬"}}],"directions_adult":{"en":"Clean the area. Apply a small amount 1 to 3 times a day. May cover with a sterile bandage once dry.","ko":"상처를 깨끗이 하고 하루 1~3번 소량을 바르세요. 마른 뒤 멸균 밴드로 덮어도 됩니다.","ja":"傷をきれいにし、1日1〜3回少量を塗る。乾いてから滅菌ばんそうこうで覆ってもよい。"},"max_daily":{"en":"3 times a day; no longer than 1 week unless a doctor directs.","ko":"하루 3번, 의사 지시 없이 1주 이내.","ja":"1日3回、医師の指示がなければ1週間まで。"},"children":null,"do_not_use":[{"en":"In the eyes or over large areas of the body","ko":"눈에, 또는 몸의 넓은 부위에","ja":"目に、または体の広い範囲に"},{"en":"Longer than 1 week unless a doctor directs","ko":"의사 지시 없이 1주 넘게","ja":"医師の指示なく1週間を超えて"}],"ask_doctor":[{"en":"Deep or puncture wounds, animal bites, or serious burns","ko":"깊거나 찔린 상처, 동물에 물린 상처, 심한 화상","ja":"深い傷や刺し傷、動物にかまれた傷、重いやけど"}],"ask_pharmacist":[],"stop_use":[{"en":"The wound does not improve or gets worse","ko":"상처가 낫지 않거나 악화될 때","ja":"傷が治らない・悪化する"}],"key_warning":{"en":"For minor wounds only. Animal bites, puncture wounds and serious burns need a doctor.","ko":"가벼운 상처에만 쓰세요. 동물에 물린 상처, 찔린 상처, 심한 화상은 진료가 필요합니다.","ja":"軽い傷だけに使ってください。動物にかまれた傷、刺し傷、重いやけどは受診が必要です。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"povidone-iodine","kind":"otc","category":"first_aid","name":{"en":"Povidone-iodine 10% antiseptic","ko":"포비돈 요오드 10% 소독약","ja":"ポビドンヨード10%消毒薬"},"uses":{"en":"First aid to help prevent infection in minor cuts, scrapes and burns.","ko":"가벼운 베인 상처, 긁힌 상처, 화상의 감염 예방 응급처치.","ja":"軽い切り傷、すり傷、やけどの感染予防の応急手当。"},"sources":[{"title":"DailyMed — Povidone Iodine Solution First Aid Antiseptic Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c2f07152-d7fb-4b1f-be77-c94618d5abd6"}]},{"aka":["peroxide","과산화수소","オキシドール"],"brands":["store brand hydrogen peroxide 3%"],"active":[{"ingredient":"hydrogen peroxide","strength":"3%","purpose":{"en":"First aid antiseptic / oral debriding agent","ko":"응급 소독제/구강 세정제","ja":"応急消毒薬・口腔洗浄薬"}}],"directions_adult":{"en":"First aid: clean the area and apply a small amount 1 to 3 times a day. Mouth rinse (ages 2+): mix with an equal amount of water, swish for at least 1 minute and spit out — do not swallow; up to 4 times a day.","ko":"응급처치: 상처를 닦고 하루 1~3번 소량을 바르세요. 입 헹굼(2세 이상): 같은 양의 물과 섞어 1분 이상 머금고 뱉으세요 — 삼키지 마세요. 하루 4번까지.","ja":"応急手当: 傷をきれいにし1日1〜3回少量を塗る。うがい（2歳以上）: 同量の水で薄め、1分以上口に含んで吐き出す — 飲み込まない。1日4回まで。"},"max_daily":{"en":"No longer than 1 week; mouth sores: see a dentist or doctor if not better in 7 days.","ko":"1주 이내. 입안 통증이 7일 안에 낫지 않으면 치과의사·의사에게.","ja":"1週間まで。口の痛みが7日で良くならなければ歯科医・医師へ。"},"children":{"en":"Mouth rinse: under 2 ask a dentist or doctor; supervise children under 12.","ko":"입 헹굼: 2세 미만은 치과의사·의사에게 묻고, 12세 미만은 지켜보세요.","ja":"うがい: 2歳未満は歯科医・医師に相談、12歳未満は見守る。"},"do_not_use":[{"en":"In the eyes or over large areas of the body","ko":"눈에, 또는 몸의 넓은 부위에","ja":"目に、または体の広い範囲に"},{"en":"Longer than 1 week","ko":"1주 넘게","ja":"1週間を超えて"}],"ask_doctor":[{"en":"Deep or puncture wounds, animal bites, or serious burns","ko":"깊거나 찔린 상처, 동물에 물린 상처, 심한 화상","ja":"深い傷や刺し傷、動物にかまれた傷、重いやけど"}],"ask_pharmacist":[],"stop_use":[{"en":"Swelling, rash or fever; or irritation, pain or redness continues or worsens","ko":"부기, 발진, 열; 또는 자극·통증·발적이 계속·악화될 때","ja":"腫れ、発疹、発熱、または刺激・痛み・赤みが続く・悪化する"}],"key_warning":{"en":"Do not swallow. If swallowed, call Poison Control (1-800-222-1222).","ko":"삼키지 마세요. 삼켰다면 중독센터(1-800-222-1222)에 전화하세요.","ja":"飲み込まないでください。飲んだら中毒センター（1-800-222-1222）へ。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"hydrogen-peroxide","kind":"otc","category":"first_aid","name":{"en":"Hydrogen peroxide 3%","ko":"과산화수소 3%","ja":"過酸化水素3%（オキシドール）"},"uses":{"en":"Helps prevent infection in minor cuts, scrapes and burns; as a diluted mouth rinse, helps remove mucus and secretions from an occasional sore mouth.","ko":"가벼운 상처·화상의 감염 예방을 돕고, 희석한 입 헹굼으로 가끔 생기는 입안 통증의 점액·분비물 제거를 돕습니다.","ja":"軽い傷・やけどの感染予防を助け、薄めたうがいで、ときどきの口の痛みの粘液・分泌物を取り除くのを助けます。"},"sources":[{"title":"DailyMed — Hydrogen Peroxide 3% Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=e19228e9-6f87-456e-a222-f979a234d589"}]},{"aka":["burn gel","aloe","sunburn","화상연고","やけど"],"brands":["store brand burn relief aloe gel"],"active":[{"ingredient":"lidocaine","strength":"0.5% (HCl)","purpose":{"en":"External analgesic","ko":"외용 진통제","ja":"外用鎮痛薬"}}],"directions_adult":{"en":"Adults and children 2+: apply to the affected area no more than 3 to 4 times a day.","ko":"성인 및 2세 이상: 하루 3~4번 이하로 해당 부위에 바르세요.","ja":"大人と2歳以上: 患部に1日3〜4回まで塗る。"},"max_daily":{"en":"3 to 4 times a day.","ko":"하루 3~4번.","ja":"1日3〜4回。"},"children":{"en":"Under 2: ask a doctor.","ko":"2세 미만: 의사에게 물어보세요.","ja":"2歳未満: 医師に相談。"},"do_not_use":[{"en":"In large amounts, especially over raw or blistered skin","ko":"많은 양을, 특히 벗겨지거나 물집 잡힌 피부에","ja":"大量に、特にただれた・水ぶくれの皮膚に"}],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"It gets worse, lasts more than 7 days, or clears and comes back within a few days","ko":"악화되거나 7일 넘게 지속되거나, 나았다가 며칠 안에 재발할 때","ja":"悪化する、7日を超えて続く、または治っても数日で再発する"}],"key_warning":{"en":"For minor burns only. Do not use large amounts on raw or blistered skin; serious burns need medical care.","ko":"가벼운 화상에만 쓰세요. 벗겨지거나 물집 잡힌 피부에 많이 바르지 말고, 심한 화상은 진료가 필요합니다.","ja":"軽いやけどだけに使ってください。ただれた・水ぶくれの皮膚に大量に塗らず、重いやけどは受診が必要です。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"burn-gel-lidocaine","kind":"otc","category":"first_aid","name":{"en":"Burn relief gel (lidocaine + aloe)","ko":"화상 젤(리도카인+알로에)","ja":"やけど用ジェル（リドカイン+アロエ）"},"uses":{"en":"Temporarily relieves pain and itching from sunburn, minor burns, insect bites, minor cuts, scrapes and skin irritation.","ko":"햇볕 화상, 가벼운 화상, 벌레 물림, 가벼운 상처, 피부 자극의 통증과 가려움을 일시적으로 완화합니다.","ja":"日焼け、軽いやけど、虫さされ、軽い傷、皮膚の刺激による痛みとかゆみを一時的にやわらげます。"},"sources":[{"title":"DailyMed — Good Sense Burn Relief Aloe (lidocaine HCl 0.5%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=b5a7f629-a88d-b49d-e053-2995a90a49fa"}]},{"aka":["anticavity toothpaste","Crest","불소","フッ素"],"brands":["Crest Cavity Protection","Colgate","store brand anticavity toothpaste"],"active":[{"ingredient":"sodium fluoride","strength":"0.243% (0.15% w/v fluoride ion)","purpose":{"en":"Anticavity","ko":"충치 예방","ja":"むし歯予防"}}],"directions_adult":{"en":"Adults and children 2+: brush thoroughly after meals or at least twice a day, or as a dentist directs. Do not swallow.","ko":"성인 및 2세 이상: 식후 또는 하루 최소 2번 꼼꼼히 닦으세요. 또는 치과의사 지시대로. 삼키지 마세요.","ja":"大人と2歳以上: 食後または1日2回以上しっかりみがく。または歯科医の指示どおり。飲み込まない。"},"max_daily":null,"children":{"en":"Under 6: use a pea-sized amount and supervise brushing. Under 2: ask a dentist.","ko":"6세 미만: 완두콩만큼만 쓰고 양치를 지켜보세요. 2세 미만: 치과의사에게 물어보세요.","ja":"6歳未満: 豆粒大を使い、歯みがきを見守る。2歳未満: 歯科医に相談。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[],"key_warning":{"en":"Keep away from children under 6. If more than the amount used for brushing is swallowed, call Poison Control (1-800-222-1222).","ko":"6세 미만 아이 손이 닿지 않게 하세요. 양치에 쓰는 양보다 많이 삼켰다면 중독센터(1-800-222-1222)에 전화하세요.","ja":"6歳未満の子どもの手の届かない所に。歯みがきに使う量より多く飲み込んだら中毒センター（1-800-222-1222）へ。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"fluoride-toothpaste","kind":"otc","category":"oral","name":{"en":"Fluoride toothpaste","ko":"불소 치약","ja":"フッ素入り歯みがき"},"uses":{"en":"Helps protect teeth and roots against cavities.","ko":"치아와 치아 뿌리를 충치로부터 보호합니다.","ja":"歯と歯の根をむし歯から守ります。"},"sources":[{"title":"DailyMed — Crest Cavity Protection (sodium fluoride 0.243%) Drug Facts","url":"https://www.dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=23851360-e30e-dd97-e063-6394a90a5474"}]},{"aka":["Nicorette","stop smoking","금연껌","禁煙ガム"],"brands":["Nicorette","store brand nicotine gum"],"active":[{"ingredient":"nicotine","strength":"2 mg or 4 mg per piece (as nicotine polacrilex)","purpose":{"en":"Stop smoking aid","ko":"금연 보조제","ja":"禁煙補助薬"}}],"directions_adult":{"en":"Adults 18+: stop smoking completely. First cigarette within 30 minutes of waking — use 4 mg; later than 30 minutes — use 2 mg. Weeks 1–6: 1 piece every 1–2 hours (at least 9 a day); weeks 7–9: every 2–4 hours; weeks 10–12: every 4–8 hours. Chew slowly until it tingles, then park it between cheek and gum; repeat for about 30 minutes. No food or drink 15 minutes before or while chewing.","ko":"18세 이상: 담배를 완전히 끊으세요. 기상 후 30분 이내 첫 담배 — 4 mg, 30분 이후 — 2 mg. 1~6주: 1~2시간마다 1개(하루 9개 이상), 7~9주: 2~4시간마다, 10~12주: 4~8시간마다. 얼얼해질 때까지 천천히 씹고 볼과 잇몸 사이에 두기를 약 30분 반복. 씹기 15분 전과 씹는 동안 음식·음료 금지.","ja":"18歳以上: たばこを完全にやめる。起床30分以内に1本目 — 4 mg、30分以降 — 2 mg。1〜6週: 1〜2時間ごとに1個（1日9個以上）、7〜9週: 2〜4時間ごと、10〜12週: 4〜8時間ごと。ピリッとするまでゆっくりかみ、頬と歯ぐきの間に置くのを約30分くり返す。かむ15分前とかんでいる間は飲食しない。"},"max_daily":{"en":"24 pieces a day; complete the 12-week program and talk to a health care provider if you need it longer.","ko":"하루 24개. 12주 프로그램을 마치고, 더 필요하면 의료인과 상의하세요.","ja":"1日24個まで。12週間を終え、さらに必要なら医療者に相談。"},"children":{"en":"Under 18: ask a doctor. Used and unused pieces/patches can poison children and pets — call Poison Control (1-800-222-1222).","ko":"18세 미만: 의사에게 물어보세요. 쓴 것이든 새것이든 아이와 반려동물에게 중독을 일으킬 수 있습니다 — 중독센터(1-800-222-1222).","ja":"18歳未満: 医師に相談。使用済み・未使用どちらも子どもやペットの中毒の原因になります — 中毒センター（1-800-222-1222）。"},"do_not_use":[],"ask_doctor":[{"en":"A sodium-restricted diet","ko":"나트륨 제한 식이","ja":"塩分制限食"},{"en":"Heart disease, a recent heart attack, or an irregular heartbeat; high blood pressure not controlled by medicine","ko":"심장병, 최근 심장마비, 부정맥; 약으로 조절되지 않는 고혈압","ja":"心臓病、最近の心臓発作、不整脈；薬でコントロールできていない高血圧"},{"en":"A stomach ulcer or diabetes","ko":"위궤양 또는 당뇨","ja":"胃潰瘍または糖尿病"},{"en":"A history of seizures","ko":"경련(발작) 병력","ja":"けいれん発作の既往"}],"ask_pharmacist":[{"en":"Another non-nicotine stop-smoking medicine, or prescription medicine for depression or asthma (the dose may need changing)","ko":"니코틴 없는 다른 금연약, 또는 우울증·천식 처방약(용량 조절이 필요할 수 있음)","ja":"ニコチンを含まない他の禁煙薬、またはうつ病・ぜんそくの処方薬（量の調整が必要なことがあります)"}],"stop_use":[{"en":"Mouth, teeth or jaw problems","ko":"입, 치아, 턱 문제","ja":"口・歯・あごの問題"},{"en":"Irregular heartbeat or palpitations, or signs of too much nicotine: nausea, vomiting, dizziness, weakness, fast heartbeat","ko":"부정맥·두근거림, 또는 니코틴 과다 증상: 메스꺼움, 구토, 어지러움, 쇠약감, 빠른 심장박동","ja":"不整脈・動悸、またはニコチン過量の症状: 吐き気、嘔吐、めまい、脱力、速い脈"},{"en":"An allergic reaction such as trouble breathing or rash","ko":"호흡 곤란이나 발진 같은 알레르기 반응","ja":"呼吸困難や発疹などのアレルギー反応"}],"key_warning":{"en":"Keep used and unused gum away from children and pets — it can poison them.","ko":"쓴 껌이든 새 껌이든 아이와 반려동물이 닿지 않게 하세요 — 중독될 수 있습니다.","ja":"使用済み・未使用のガムは子どもやペットから遠ざけてください — 中毒を起こします。"},"older_adults":null,"pregnancy":{"en":"Use only on a health care provider's advice. It is believed safer than smoking, but risks to the baby are not fully known.","ko":"의료인의 조언이 있을 때만 쓰세요. 흡연보다는 안전하다고 여겨지지만 아기에 대한 위험은 완전히 알려져 있지 않습니다.","ja":"医療者の助言があるときのみ使ってください。喫煙よりは安全と考えられていますが、赤ちゃんへのリスクは完全には分かっていません。"},"flags":["heart","bp","diabetes","pregnancy","children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"nicotine-gum","kind":"otc","category":"quit_smoking","name":{"en":"Nicotine gum","ko":"니코틴 껌","ja":"ニコチンガム"},"uses":{"en":"Reduces nicotine cravings and withdrawal symptoms when you quit smoking.","ko":"금연할 때 니코틴 갈망과 금단 증상을 줄입니다.","ja":"禁煙時のニコチンへの欲求と離脱症状をやわらげます。"},"sources":[{"title":"DailyMed — Basic Care Nicotine Polacrilex Gum Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=90f2da70-c58f-44fb-bdbd-5c95440c1198"}]},{"aka":["NicoDerm CQ","stop smoking","금연패치","禁煙パッチ"],"brands":["NicoDerm CQ","Habitrol","store brand nicotine patch"],"active":[{"ingredient":"nicotine","strength":"21 mg (Step 1), 14 mg (Step 2) or 7 mg (Step 3) per 24 hours","purpose":{"en":"Stop smoking aid","ko":"금연 보조제","ja":"禁煙補助薬"}}],"directions_adult":{"en":"Adults 18+: stop smoking completely when you start. More than 10 cigarettes a day: Step 1 for weeks 1–6, Step 2 for weeks 7–8, Step 3 for weeks 9–10. 10 or fewer a day: Step 2 for 6 weeks, then Step 3 for 2 weeks, then stop. Put one new patch on clean, dry, hairless skin every 24 hours, press for 10 seconds, and wash hands after.","ko":"18세 이상: 시작할 때 담배를 완전히 끊으세요. 하루 10개비 초과: 1~6주 1단계, 7~8주 2단계, 9~10주 3단계. 10개비 이하: 2단계 6주, 3단계 2주 후 중단. 24시간마다 새 패치 1장을 깨끗하고 마른, 털 없는 피부에 10초간 눌러 붙이고 손을 씻으세요.","ja":"18歳以上: 始めるときにたばこを完全にやめる。1日10本超: 1〜6週ステップ1、7〜8週ステップ2、9〜10週ステップ3。10本以下: ステップ2を6週、ステップ3を2週、その後終了。24時間ごとに新しいパッチ1枚を、清潔で乾いた毛のない皮膚に10秒押して貼り、手を洗う。"},"max_daily":{"en":"One patch at a time, a new one every 24 hours. Do not cut patches. Talk to your provider if you need it beyond the program.","ko":"한 번에 1장, 24시간마다 새 패치. 자르지 마세요. 프로그램 이후에도 필요하면 의료인과 상의하세요.","ja":"1回に1枚、24時間ごとに新しいもの。切らないこと。プログラム後も必要なら医療者に相談。"},"children":{"en":"Under 18: ask a doctor. Used and unused pieces/patches can poison children and pets — call Poison Control (1-800-222-1222).","ko":"18세 미만: 의사에게 물어보세요. 쓴 것이든 새것이든 아이와 반려동물에게 중독을 일으킬 수 있습니다 — 중독센터(1-800-222-1222).","ja":"18歳未満: 医師に相談。使用済み・未使用どちらも子どもやペットの中毒の原因になります — 中毒センター（1-800-222-1222）。"},"do_not_use":[],"ask_doctor":[{"en":"Heart disease, a recent heart attack, or an irregular heartbeat; high blood pressure not controlled by medicine","ko":"심장병, 최근 심장마비, 부정맥; 약으로 조절되지 않는 고혈압","ja":"心臓病、最近の心臓発作、不整脈；薬でコントロールできていない高血圧"},{"en":"Allergy to adhesive tape, or skin problems","ko":"반창고 알레르기, 또는 피부 질환","ja":"ばんそうこうアレルギー、または皮膚の病気"},{"en":"Stomach ulcer or diabetes; history of seizures","ko":"위궤양 또는 당뇨; 경련 병력","ja":"胃潰瘍または糖尿病；けいれん発作の既往"}],"ask_pharmacist":[{"en":"Another non-nicotine stop-smoking medicine, or prescription medicine for depression or asthma (the dose may need changing)","ko":"니코틴 없는 다른 금연약, 또는 우울증·천식 처방약(용량 조절이 필요할 수 있음)","ja":"ニコチンを含まない他の禁煙薬、またはうつ病・ぜんそくの処方薬（量の調整が必要なことがあります)"}],"stop_use":[{"en":"Skin redness that does not go away after 4 days, skin swelling, or rash","ko":"4일이 지나도 사라지지 않는 피부 발적, 부기, 발진","ja":"4日たっても消えない皮膚の赤み、腫れ、発疹"},{"en":"Irregular heartbeat or palpitations, or signs of too much nicotine: nausea, vomiting, dizziness, weakness, fast heartbeat","ko":"부정맥·두근거림, 또는 니코틴 과다 증상: 메스꺼움, 구토, 어지러움, 쇠약감, 빠른 심장박동","ja":"不整脈・動悸、またはニコチン過量の症状: 吐き気、嘔吐、めまい、脱力、速い脈"},{"en":"An allergic reaction","ko":"알레르기 반응","ja":"アレルギー反応"}],"key_warning":{"en":"Vivid dreams or trouble sleeping: take the patch off at bedtime. Fold used patches sticky sides together and put them in the pouch — they can still poison children and pets.","ko":"생생한 꿈이나 수면 문제가 있으면 자기 전에 떼세요. 쓴 패치는 접착면끼리 접어 파우치에 넣으세요 — 아이와 반려동물에게 여전히 위험합니다.","ja":"鮮明な夢や不眠があれば就寝前にはがす。使用済みパッチは粘着面を合わせて折り、袋に入れる — 子どもやペットには今でも危険です。"},"older_adults":null,"pregnancy":{"en":"Use only on a health care provider's advice. It is believed safer than smoking, but risks to the baby are not fully known.","ko":"의료인의 조언이 있을 때만 쓰세요. 흡연보다는 안전하다고 여겨지지만 아기에 대한 위험은 완전히 알려져 있지 않습니다.","ja":"医療者の助言があるときのみ使ってください。喫煙よりは安全と考えられていますが、赤ちゃんへのリスクは完全には分かっていません。"},"flags":["bp","children","diabetes","heart","pregnancy","stomach"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"nicotine-patch","kind":"otc","category":"quit_smoking","name":{"en":"Nicotine patch","ko":"니코틴 패치","ja":"ニコチンパッチ"},"uses":{"en":"Reduces withdrawal symptoms, including nicotine craving, when you quit smoking.","ko":"금연할 때 니코틴 갈망을 포함한 금단 증상을 줄입니다.","ja":"禁煙時のニコチンへの欲求を含む離脱症状をやわらげます。"},"sources":[{"title":"DailyMed — NicoDerm CQ (nicotine transdermal system) Drug Facts, rev. 7/2025","url":"https://dailymed.nlm.nih.gov/dailymed/getFile.cfm?setid=93b2d1b9-83c1-40b5-b6af-90c38c8d6cef&type=pdf"}]},{"aka":["Unisom SleepTabs","sleep aid","수면제","睡眠薬"],"brands":["Unisom SleepTabs","store brand nighttime sleep aid"],"active":[{"ingredient":"doxylamine","strength":"25 mg (succinate) per tablet","purpose":{"en":"Nighttime sleep aid","ko":"야간 수면 보조제","ja":"夜間睡眠補助薬"}}],"directions_adult":{"en":"Adults and children 12+: 1 tablet 30 minutes before bedtime, once a day, or as a doctor directs.","ko":"12세 이상: 자기 30분 전 1정, 하루 1번, 또는 의사 지시대로.","ja":"12歳以上: 就寝30分前に1錠、1日1回、または医師の指示どおり。"},"max_daily":{"en":"1 tablet a day.","ko":"하루 1정.","ja":"1日1錠。"},"children":{"en":"Under 12: do not use.","ko":"12세 미만: 사용 금지.","ja":"12歳未満: 使用しない。"},"do_not_use":[{"en":"With any other product containing doxylamine","ko":"독실아민이 든 다른 제품과 함께","ja":"ドキシラミンを含む他の製品と一緒に"},{"en":"Unless you have time for a full night's sleep","ko":"밤새 충분히 잘 시간이 없을 때","ja":"一晩しっかり眠る時間がないとき"}],"ask_doctor":[{"en":"Glaucoma; a breathing problem such as emphysema or chronic bronchitis; trouble urinating from an enlarged prostate","ko":"녹내장, 폐기종·만성 기관지염 같은 호흡 문제, 전립선 비대로 인한 배뇨 곤란","ja":"緑内障、肺気腫・慢性気管支炎などの呼吸の問題、前立腺肥大による排尿困難"}],"ask_pharmacist":[{"en":"Sedatives or other sleep aids, tranquilizers, other antihistamines, or any other medicine","ko":"진정제나 다른 수면제, 신경안정제, 다른 항히스타민제, 또는 다른 모든 약","ja":"鎮静薬や他の睡眠薬、精神安定薬、他の抗ヒスタミン薬、その他の薬"}],"stop_use":[{"en":"Sleeplessness lasts more than 2 weeks — it can be a sign of a serious illness","ko":"불면이 2주 넘게 지속될 때 — 심각한 질환의 신호일 수 있음","ja":"不眠が2週間を超えて続く — 重い病気のサインのことがあります"}],"key_warning":{"en":"Take only at bedtime. Do not drink alcohol, drive or use machinery after taking it. Many night-time cold and pain products already contain a sleep antihistamine — do not double up.","ko":"자기 직전에만 드세요. 복용 후 술, 운전, 기계 조작은 하지 마세요. 많은 야간용 감기약·진통제에 이미 수면 항히스타민이 들어 있으니 겹쳐 먹지 마세요.","ja":"就寝前にだけ飲んでください。服用後の飲酒、運転、機械の操作はしないこと。夜用のかぜ薬・鎮痛薬の多くにはすでに眠くなる抗ヒスタミン薬が入っているので重ねて飲まないでください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["sedation","glaucoma","prostate","alcohol","children"],"classes":["sedating_antihistamine","sleep_aid"],"supplement_note":null,"verified":"2026-10-22","id":"doxylamine","kind":"otc","category":"sleep","name":{"en":"Doxylamine (sleep aid)","ko":"독실아민(수면 보조제)","ja":"ドキシラミン（睡眠補助薬）"},"uses":{"en":"Helps reduce difficulty falling asleep.","ko":"잠들기 어려운 것을 줄이는 데 도움을 줍니다.","ja":"寝つきの悪さをやわらげます。"},"sources":[{"title":"DailyMed — Unisom SleepTabs (doxylamine succinate 25 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f591d52f-5610-4517-a96f-1ed63deb00bc"}]},{"aka":["Monistat","yeast infection","질염","カンジダ"],"brands":["Monistat 7","store brand miconazole 7"],"active":[{"ingredient":"miconazole nitrate","strength":"2%","purpose":{"en":"Vaginal antifungal","ko":"질 항진균제","ja":"膣抗真菌薬"}}],"directions_adult":{"en":"Ages 12+: insert 1 applicatorful into the vagina at bedtime for 7 nights in a row. For itching outside, apply a small amount to the skin up to twice a day for up to 7 days.","ko":"12세 이상: 7일 밤 연속, 자기 전 질 안에 어플리케이터 1개 분량을 넣으세요. 외부 가려움에는 피부에 소량을 하루 2번까지, 최대 7일.","ja":"12歳以上: 7晩続けて就寝時に膣内へアプリケーター1本分を入れる。外側のかゆみには少量を1日2回まで、最長7日。"},"max_daily":null,"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"If a doctor has never diagnosed you with a vaginal yeast infection","ko":"의사에게 칸디다 질염 진단을 받은 적이 없을 때","ja":"医師に膣カンジダと診断されたことがない"}],"ask_doctor":[{"en":"Vaginal itching or discomfort for the first time","ko":"처음 생긴 질 가려움이나 불편감","ja":"初めての膣のかゆみや不快感"},{"en":"Lower belly, back or shoulder pain, fever, chills, nausea, vomiting, or foul-smelling discharge","ko":"아랫배·등·어깨 통증, 열, 오한, 메스꺼움, 구토, 악취 나는 분비물","ja":"下腹部・背中・肩の痛み、発熱、寒気、吐き気、嘔吐、悪臭のあるおりもの"},{"en":"Frequent yeast infections; possible pregnancy; diabetes; a weak immune system or HIV exposure","ko":"잦은 재발, 임신 가능성, 당뇨, 면역 저하 또는 HIV 노출","ja":"くり返す感染、妊娠の可能性、糖尿病、免疫低下またはHIV曝露"}],"ask_pharmacist":[{"en":"Warfarin (bleeding or bruising may occur)","ko":"와파린(출혈·멍이 생길 수 있음)","ja":"ワルファリン（出血やあざが出ることがあります）"}],"stop_use":[{"en":"No improvement in 3 days, or symptoms last more than 7 days","ko":"3일 안에 나아지지 않거나 7일 넘게 지속될 때","ja":"3日で良くならない、または7日を超えて続く"},{"en":"Rash, hives, belly pain, fever, chills, nausea, vomiting or foul-smelling discharge","ko":"발진, 두드러기, 복통, 열, 오한, 메스꺼움, 구토, 악취 분비물","ja":"発疹、じんましん、腹痛、発熱、寒気、吐き気、嘔吐、悪臭のあるおりもの"}],"key_warning":{"en":"Can damage condoms and diaphragms, so they may not prevent pregnancy or STDs. During treatment avoid tampons, douches, spermicides, other vaginal products and intercourse.","ko":"콘돔과 페서리를 손상시켜 피임·성병 예방이 안 될 수 있습니다. 치료 중 탐폰, 질 세척, 살정제, 다른 질 제품, 성관계를 피하세요.","ja":"コンドームやペッサリーを傷め、避妊や性感染症予防ができなくなることがあります。治療中はタンポン、膣洗浄、殺精子剤、他の膣用製品、性交を避けてください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["diabetes","blood_thinner","pregnancy"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"miconazole-vaginal","kind":"otc","category":"womens","name":{"en":"Miconazole vaginal cream (yeast infection)","ko":"미코나졸 질 크림(칸디다 질염)","ja":"ミコナゾール膣クリーム（カンジダ）"},"uses":{"en":"Treats vaginal yeast infections and relieves the external itching and irritation.","ko":"질 칸디다증을 치료하고 외부 가려움과 자극을 덜어 줍니다.","ja":"膣カンジダを治療し、外側のかゆみと刺激をやわらげます。"},"sources":[{"title":"DailyMed — Monistat 7 (miconazole nitrate 2%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c4b68aff-e95f-47ae-b190-6a671bef1877"}]},{"aka":["Plan B One-Step","morning-after pill","응급피임약","緊急避妊薬"],"brands":["Plan B One-Step","Take Action","My Way","store brand emergency contraceptive"],"active":[{"ingredient":"levonorgestrel","strength":"1.5 mg per tablet","purpose":{"en":"Emergency contraceptive","ko":"응급 피임약","ja":"緊急避妊薬"}}],"directions_adult":{"en":"Take 1 tablet as soon as possible within 72 hours (3 days) after unprotected sex. The sooner, the better it works. If you vomit within 2 hours, call a health care professional to ask whether to take another dose.","ko":"피임하지 않은 성관계 후 72시간(3일) 이내 가능한 한 빨리 1정. 빠를수록 효과가 좋습니다. 2시간 안에 토하면 다시 먹어야 하는지 의료인에게 전화로 물어보세요.","ja":"避妊しなかった性交から72時間（3日）以内、できるだけ早く1錠。早いほど効果的です。2時間以内に吐いたら、もう一度飲むべきか医療者に電話で確認してください。"},"max_daily":{"en":"1 tablet.","ko":"1정.","ja":"1錠。"},"children":null,"do_not_use":[{"en":"If you are already pregnant (it will not work)","ko":"이미 임신한 경우(효과 없음)","ja":"すでに妊娠している（効きません）"},{"en":"For regular birth control","ko":"일반적인 피임 목적으로","ja":"通常の避妊目的で"},{"en":"If you have had an allergic reaction to levonorgestrel","ko":"레보노르게스트렐에 알레르기 반응이 있었던 경우","ja":"レボノルゲストレルでアレルギー反応が出たことがある"}],"ask_doctor":[],"ask_pharmacist":[{"en":"Efavirenz (HIV), rifampin (tuberculosis), or seizure medicine — these may make it work less well","ko":"에파비렌즈(HIV), 리팜핀(결핵), 경련약 — 효과가 떨어질 수 있음","ja":"エファビレンツ（HIV）、リファンピシン（結核）、てんかんの薬 — 効果が下がることがあります"}],"stop_use":[],"key_warning":{"en":"Does not protect against HIV or other sexually transmitted infections. Possible side effects: period changes, tiredness, breast pain, nausea, headache, vomiting, lower belly pain, dizziness.","ko":"HIV나 다른 성병을 막지 못합니다. 생리 변화, 피로, 유방 통증, 메스꺼움, 두통, 구토, 아랫배 통증, 어지러움이 생길 수 있습니다.","ja":"HIVや他の性感染症は防げません。生理の変化、だるさ、乳房の痛み、吐き気、頭痛、嘔吐、下腹部痛、めまいが出ることがあります。"},"older_adults":null,"pregnancy":{"en":"Do not use if already pregnant.","ko":"이미 임신했다면 쓰지 마세요.","ja":"すでに妊娠している場合は使わないでください。"},"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"levonorgestrel-ec","kind":"otc","category":"womens","name":{"en":"Levonorgestrel emergency contraceptive","ko":"레보노르게스트렐 응급피임약","ja":"レボノルゲストレル緊急避妊薬"},"uses":{"en":"Reduces the chance of pregnancy after unprotected sex (if a contraceptive failed or none was used).","ko":"피임하지 않은 성관계 후(피임 실패 또는 미사용) 임신 가능성을 줄입니다.","ja":"避妊しなかった性交の後（避妊の失敗や未使用）に妊娠の可能性を下げます。"},"sources":[{"title":"DailyMed — Plan B One-Step (levonorgestrel 1.5 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6ce6b40e-14ac-47bd-a648-ddf9e452e559"}]},{"aka":["Desitin","diaper rash","기저귀 발진","おむつかぶれ"],"brands":["Desitin Maximum Strength
