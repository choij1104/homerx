","store brand diaper rash paste"],"active":[{"ingredient":"zinc oxide","strength":"40%","purpose":{"en":"Skin protectant","ko":"피부 보호제","ja":"皮膚保護剤"}}],"directions_adult":{"en":"Change wet or soiled diapers promptly, clean the diaper area, and let it dry. Apply a generous layer as often as needed, especially at bedtime or when a wet diaper may stay on longer.","ko":"젖거나 더러운 기저귀를 바로 갈고, 기저귀 부위를 닦아 말리세요. 필요할 때마다, 특히 자기 전이나 기저귀를 오래 찰 때 넉넉히 바르세요.","ja":"ぬれた・汚れたおむつはすぐ替え、おむつの部分をきれいにして乾かす。必要なたびに、特に就寝前や長くおむつをつけるときにたっぷり塗る。"},"max_daily":null,"children":{"en":"Made for babies; follow the directions above.","ko":"아기용 제품입니다. 위 용법을 따르세요.","ja":"赤ちゃん用です。上の用法に従ってください。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"The rash gets worse, lasts more than 7 days, or clears and comes back within a few days","ko":"발진이 악화되거나 7일 넘게 지속되거나, 나았다가 며칠 안에 재발할 때","ja":"かぶれが悪化する、7日を超えて続く、または治っても数日で再発する"}],"key_warning":{"en":"For external use only; keep out of the eyes. If swallowed, call Poison Control (1-800-222-1222).","ko":"외용으로만 쓰고 눈에 들어가지 않게 하세요. 삼켰다면 중독센터(1-800-222-1222)에 전화하세요.","ja":"外用のみ。目に入れないように。飲み込んだら中毒センター（1-800-222-1222）へ。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"zinc-oxide-diaper","kind":"otc","category":"children","name":{"en":"Zinc oxide diaper rash paste","ko":"산화아연 기저귀 발진 연고","ja":"酸化亜鉛おむつかぶれ軟膏"},"uses":{"en":"Treats and prevents diaper rash; protects chafed skin and helps seal out wetness.","ko":"기저귀 발진을 치료·예방하고, 쓸린 피부를 보호하며 습기를 막아 줍니다.","ja":"おむつかぶれを治療・予防し、こすれた肌を守り湿気を防ぎます。"},"sources":[{"title":"DailyMed — Desitin Maximum Strength (zinc oxide 40%) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=af64fc2f-c027-4a68-b368-ee06744a2452"}]},{"aka":["Midol Complete","period pain","생리통","生理痛"],"brands":["Midol Complete","store brand menstrual complete"],"active":[{"ingredient":"acetaminophen","strength":"500 mg per caplet","purpose":{"en":"Pain reliever","ko":"진통제","ja":"鎮痛薬"}},{"ingredient":"caffeine","strength":"60 mg per caplet","purpose":{"en":"Diuretic","ko":"이뇨제","ja":"利尿薬"}},{"ingredient":"pyrilamine","strength":"15 mg (maleate) per caplet","purpose":{"en":"Antihistamine","ko":"항히스타민제","ja":"抗ヒスタミン薬"}}],"directions_adult":{"en":"Adults and children 12+: 2 caplets with water every 6 hours as needed.","ko":"12세 이상: 필요하면 6시간마다 물과 함께 2정.","ja":"12歳以上: 必要に応じ6時間ごとに水で2錠。"},"max_daily":{"en":"6 caplets in 24 hours.","ko":"24시간에 6정.","ja":"24時間で6錠。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"With any other medicine containing acetaminophen (prescription or OTC)","ko":"아세트아미노펜이 든 다른 약(처방약·일반약)과 함께","ja":"アセトアミノフェンを含む他の薬（処方薬・市販薬）と一緒に"}],"ask_doctor":[{"en":"Liver disease","ko":"간 질환","ja":"肝臓病"},{"en":"Glaucoma; a breathing problem such as emphysema or chronic bronchitis; trouble urinating from an enlarged prostate","ko":"녹내장, 폐기종·만성 기관지염 같은 호흡 문제, 전립선 비대로 인한 배뇨 곤란","ja":"緑内障、肺気腫・慢性気管支炎などの呼吸の問題、前立腺肥大による排尿困難"}],"ask_pharmacist":[{"en":"Warfarin, or sedatives or tranquilizers","ko":"와파린, 또는 진정제·신경안정제","ja":"ワルファリン、または鎮静薬・精神安定薬"}],"stop_use":[{"en":"Pain gets worse or lasts more than 10 days; fever gets worse or lasts more than 3 days; new symptoms, redness or swelling","ko":"통증이 악화되거나 10일 넘게, 열이 악화되거나 3일 넘게 지속; 새 증상, 발적, 부기","ja":"痛みが悪化または10日を超える、熱が悪化または3日を超える、新しい症状、赤み、腫れ"},{"en":"Skin reddening, blisters or rash — get medical help right away","ko":"피부 붉어짐, 물집, 발진 — 즉시 진료","ja":"皮膚の赤み、水ぶくれ、発疹 — すぐ受診"}],"key_warning":{"en":"Contains acetaminophen: severe liver damage may occur above 4,000 mg in 24 hours, with other acetaminophen products, or with 3+ drinks a day. May cause drowsiness. Limit other caffeine.","ko":"아세트아미노펜이 들어 있습니다: 24시간 4,000 mg 초과, 다른 아세트아미노펜 제품과 함께, 하루 3잔 이상 음주 시 심각한 간 손상이 생길 수 있습니다. 졸릴 수 있으며, 다른 카페인 섭취를 줄이세요.","ja":"アセトアミノフェンを含みます: 24時間で4,000 mg超、他のアセトアミノフェン製品との併用、1日3杯以上の飲酒で重い肝障害が起こることがあります。眠くなることがあり、他のカフェインは控えてください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["liver","alcohol","sedation","glaucoma","prostate","blood_thinner"],"classes":["acetaminophen","sedating_antihistamine"],"supplement_note":null,"verified":"2026-10-22","id":"menstrual-complete","kind":"otc","category":"womens","name":{"en":"Menstrual pain relief (acetaminophen + caffeine + pyrilamine)","ko":"생리통약(아세트아미노펜+카페인+피릴라민)","ja":"生理痛薬（アセトアミノフェン+カフェイン+ピリラミン）"},"uses":{"en":"Temporarily relieves period-related bloating, water-weight gain, cramps, headache, backache, tiredness and muscle aches.","ko":"생리와 관련된 붓기, 수분 체중 증가, 생리통, 두통, 요통, 피로, 근육통을 일시적으로 완화합니다.","ja":"生理に伴うむくみ、水分による体重増加、生理痛、頭痛、腰痛、だるさ、筋肉痛を一時的にやわらげます。"},"sources":[{"title":"DailyMed — Menstrual Complete Pain Relief (acetaminophen 500 mg, caffeine 60 mg, pyrilamine 15 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=210efe01-3cf4-404c-84b0-314615467ace"}]},{"aka":["AZO","urinary pain","UTI pain","방광염","膀胱炎"],"brands":["AZO Urinary Pain Relief","store brand urinary pain relief"],"active":[{"ingredient":"phenazopyridine","strength":"99.5 mg (HCl) per tablet","purpose":{"en":"Urinary tract analgesic","ko":"요로 진통제","ja":"尿路鎮痛薬"}}],"directions_adult":{"en":"Adults and children 12+: 2 tablets 3 times a day with or after meals, with a full glass of water.","ko":"12세 이상: 하루 3번 2정씩, 식사와 함께 또는 식후에 물 한 컵과 함께.","ja":"12歳以上: 1日3回2錠、食事と一緒か食後にコップ1杯の水で。"},"max_daily":{"en":"No more than 2 days (12 tablets) without a doctor.","ko":"의사 상담 없이 2일(12정)까지.","ja":"医師に相談せず2日（12錠）まで。"},"children":{"en":"Under 12: only if a doctor says so.","ko":"12세 미만: 의사가 권할 때만.","ja":"12歳未満: 医師が勧めるときのみ。"},"do_not_use":[{"en":"If you have G6PD deficiency, unless a doctor approves","ko":"G6PD 결핍증이 있으면(의사 승인 없이는)","ja":"G6PD欠乏症がある場合（医師の許可がなければ）"}],"ask_doctor":[{"en":"Kidney disease","ko":"신장 질환","ja":"腎臓病"},{"en":"Allergies to foods, preservatives or dyes, or a past reaction to phenazopyridine","ko":"음식·보존료·색소 알레르기, 또는 페나조피리딘 반응 경험","ja":"食品・保存料・色素のアレルギー、またはフェナゾピリジンでの反応歴"}],"ask_pharmacist":[],"stop_use":[{"en":"Symptoms last more than 2 days, or you suspect a side effect","ko":"증상이 2일 넘게 지속되거나 부작용이 의심될 때","ja":"症状が2日を超える、または副作用が疑われる"}],"key_warning":{"en":"Pain relief only — it does not treat the infection; see a provider for a suspected UTI. Turns urine reddish-orange and can stain clothes and soft contact lenses. Its label states FDA has not found this drug safe and effective.","ko":"통증만 줄이며 감염을 치료하지 않습니다 — 요로감염이 의심되면 진료를 받으세요. 소변이 붉은 주황색이 되고 옷과 소프트 렌즈를 물들일 수 있습니다. 라벨에는 FDA가 이 약의 안전성과 효과를 인정하지 않았다고 적혀 있습니다.","ja":"痛みを抑えるだけで感染は治しません — 尿路感染症が疑われたら受診を。尿が赤みがかったオレンジ色になり、服やソフトコンタクトレンズを染めることがあります。ラベルにはFDAがこの薬を安全で有効と認めていないと書かれています。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["kidney","stomach"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"phenazopyridine","kind":"otc","category":"womens","name":{"en":"Phenazopyridine (urinary pain relief)","ko":"페나조피리딘(배뇨통 완화)","ja":"フェナゾピリジン（排尿痛の緩和）"},"uses":{"en":"Relieves urinary pain, burning, urgency and frequency from a urinary tract infection. It does not treat the infection.","ko":"요로감염으로 인한 배뇨통, 화끈거림, 급한 소변, 잦은 소변을 완화합니다. 감염 자체를 치료하지는 않습니다.","ja":"尿路感染症による排尿痛、しみる感じ、尿意切迫、頻尿をやわらげます。感染そのものは治しません。"},"sources":[{"title":"DailyMed — AZO Urinary Pain Relief Maximum Strength (phenazopyridine 99.5 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=b4874fe2-d98b-4b5c-baad-d75070947842"},{"title":"NCCIH — Cranberry (people with a suspected UTI should see a health care provider)","url":"https://www.nccih.nih.gov/health/cranberry"}]},{"aka":["children's cold medicine","honey for cough","children's Tylenol","children's Motrin","어린이 감기약","子どもの風邪薬"],"brands":["Children's Tylenol","Children's Motrin","Children's Advil"],"active":[],"directions_adult":{"en":"Rest and fluids; a clean cool-mist humidifier; saline drops and a suction bulb for young children. For fever, young children can take children's acetaminophen or ibuprofen — ask the child's provider for the right dose and follow the label. No throat lozenges under age 4.","ko":"휴식과 수분, 깨끗한 냉가습기, 어린아이는 식염수 점비액과 코 흡입기. 열에는 어린이용 아세트아미노펜이나 이부프로펜을 쓸 수 있으며, 정확한 용량은 아이의 의료인에게 묻고 라벨을 따르세요. 4세 미만은 목캔디(트로키) 금지.","ja":"休息と水分、清潔な加湿器（冷却ミスト）、幼い子には生理食塩水の点鼻と鼻吸い器。熱には子ども用アセトアミノフェンかイブプロフェンが使えます。正しい量は子どもの医療者に聞き、ラベルに従ってください。4歳未満にのど飴（トローチ）は使わない。"},"max_daily":null,"children":{"en":"Dose by the child's product label or the provider's advice — never use an adult product for a child.","ko":"아이용 제품 라벨이나 의료인 안내대로 주세요 — 어른 약을 아이에게 쓰지 마세요.","ja":"子ども用製品のラベルか医療者の指示どおりに — 大人用の薬を子どもに使わないでください。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Trouble breathing or fast breathing, or signs of dehydration","ko":"숨쉬기 힘들거나 빠른 호흡, 탈수 증상","ja":"呼吸が苦しい・速い、脱水の兆候"},{"en":"Fever lasting more than 4 days, or symptoms lasting more than 10 days without getting better","ko":"4일 넘는 열, 또는 10일 넘게 나아지지 않는 증상","ja":"4日を超える発熱、または10日を超えて良くならない症状"},{"en":"Fever or cough that improves and then comes back or gets worse","ko":"열이나 기침이 좋아졌다가 다시 나빠질 때","ja":"熱やせきが良くなった後に再び悪化する"}],"key_warning":{"en":"No OTC cough and cold medicine under age 6. No honey under age 1. Trouble breathing needs care right away.","ko":"6세 미만은 일반 감기·기침약 금지. 1세 미만은 꿀 금지. 숨쉬기 힘들면 즉시 진료.","ja":"6歳未満に市販のかぜ・せき薬は使わない。1歳未満にはちみつは与えない。呼吸が苦しければすぐ受診。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"kids-cold-fever","kind":"guide","category":"children","name":{"en":"Children's colds, coughs and fever — what helps","ko":"아이 감기·기침·열 — 도움이 되는 것","ja":"子どものかぜ・せき・熱 — 役立つこと"},"uses":{"en":"OTC cough and cold medicines are not recommended for children under 6 — they can cause serious, sometimes life-threatening side effects. Honey can help a cough in children 1 year and older; never give honey to a baby under 1. Antibiotics do not help colds.","ko":"6세 미만 아이에게는 일반 감기·기침약을 권하지 않습니다 — 심각하고 때로는 생명을 위협하는 부작용이 생길 수 있습니다. 꿀은 1세 이상 아이의 기침에 도움이 될 수 있으며, 1세 미만 아기에게는 절대 주지 마세요. 항생제는 감기에 도움이 되지 않습니다.","ja":"6歳未満の子どもには市販のかぜ・せき薬は勧められません — 重く、時に命にかかわる副作用が起こることがあります。はちみつは1歳以上の子どものせきに役立つことがあり、1歳未満の赤ちゃんには絶対に与えないでください。抗菌薬はかぜには効きません。"},"sources":[{"title":"CDC — Manage Common Cold","url":"https://www.cdc.gov/common-cold/treatment/index.html"}]},{"aka":["gout","통풍","痛風"],"brands":[],"active":[],"directions_adult":{"en":"Ask your provider about the right dose — gout attacks may need more than the OTC label dose, and some people need prescription medicines (colchicine, steroids). Long term: cut down alcohol, especially beer.","ko":"적절한 용량은 의료인에게 물어보세요 — 통풍 발작에는 일반약 라벨 용량보다 더 필요할 수 있고, 일부는 처방약(콜히친, 스테로이드)이 필요합니다. 장기적으로는 술, 특히 맥주를 줄이세요.","ja":"正しい量は医療者に相談してください — 痛風発作には市販薬ラベルより多い量が必要なことがあり、処方薬（コルヒチン、ステロイド）が必要な人もいます。長期的には飲酒、特にビールを減らしましょう。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Symptoms of a gout attack (see your provider), or lumps (tophi) under the skin","ko":"통풍 발작 증상(진료 필요), 또는 피부 아래 덩어리(통풍결절)","ja":"痛風発作の症状（受診を）、または皮膚の下のしこり（痛風結節）"},{"en":"Fever with a hot, swollen joint","ko":"뜨겁고 부은 관절과 함께 열이 날 때","ja":"熱く腫れた関節とともに発熱がある"}],"key_warning":{"en":"NSAIDs are not safe for everyone (kidney disease, ulcers, heart disease, blood thinners). Check with your provider before taking more than the label dose.","ko":"NSAID는 누구에게나 안전하지 않습니다(신장 질환, 궤양, 심장병, 혈액 희석제). 라벨보다 많이 먹기 전에 의료인에게 확인하세요.","ja":"NSAIDは誰にでも安全ではありません（腎臓病、潰瘍、心臓病、抗凝固薬）。ラベルより多く飲む前に医療者に確認を。"},"older_adults":null,"pregnancy":null,"flags":["kidney","stomach","heart","blood_thinner"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"gout-flare","kind":"guide","category":"pain","name":{"en":"Gout attack — first steps","ko":"통풍 발작 — 첫 대처","ja":"痛風発作 — 最初の対応"},"uses":{"en":"A gout attack causes sudden, severe joint pain and swelling, often in the big toe. Treat it as soon as it starts: NSAIDs such as ibuprofen or naproxen are often used when symptoms begin. Pain often eases within 12 hours and is usually gone within 48 hours.","ko":"통풍 발작은 흔히 엄지발가락 등 관절에 갑자기 심한 통증과 부기를 일으킵니다. 시작되면 바로 대처하세요: 증상이 시작될 때 이부프로펜이나 나프록센 같은 NSAID를 흔히 씁니다. 통증은 보통 12시간 안에 줄고 48시간 안에 사라집니다.","ja":"痛風発作は、多くは足の親指などの関節に突然の強い痛みと腫れを起こします。始まったらすぐ対処を：症状が出たときにイブプロフェンやナプロキセンなどのNSAIDがよく使われます。痛みは多くは12時間以内に和らぎ、通常48時間以内に治まります。"},"sources":[{"title":"MedlinePlus — Gout (Medical Encyclopedia)","url":"https://medlineplus.gov/ency/article/000422.htm"},{"title":"DailyMed — Advil (ibuprofen 200 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=772360bd-8631-4d24-b4db-5a7e6e1d9a13"}]},{"aka":["Pepcid","H2 blocker","acid reducer","위산 억제제","胃薬"],"brands":["Pepcid AC","store brand acid reducer"],"active":[{"ingredient":"famotidine","strength":"20 mg per tablet (Maximum Strength)","purpose":{"en":"Acid reducer","ko":"위산 억제제","ja":"胃酸抑制薬"}}],"directions_adult":{"en":"Adults and children 12+ (20 mg tablet): to relieve, swallow 1 tablet with a glass of water — do not chew. To prevent, take 1 tablet with water 10 to 60 minutes before the food or drink that causes heartburn.","ko":"12세 이상(20 mg정): 완화 — 물 한 컵과 1정을 씹지 말고 삼키세요. 예방 — 속쓰림을 일으키는 음식·음료 10~60분 전에 1정.","ja":"12歳以上（20 mg錠）: 症状をやわらげる — 水と1錠をかまずに飲む。予防 — 原因となる飲食の10〜60分前に1錠。"},"max_daily":{"en":"2 tablets in 24 hours; no more than 14 days unless a doctor says so.","ko":"24시간에 2정, 의사 지시 없이 14일 넘게 쓰지 마세요.","ja":"24時間で2錠まで。医師の指示がなければ14日まで。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[{"en":"If allergic to famotidine or other acid reducers","ko":"파모티딘이나 다른 위산 억제제에 알레르기가 있을 때","ja":"ファモチジンや他の胃酸抑制薬にアレルギーがある"},{"en":"Trouble or pain swallowing, vomiting blood, or bloody or black stools — see a doctor","ko":"삼키기 어렵거나 아플 때, 피를 토할 때, 피가 섞이거나 검은 변 — 진료를 받으세요","ja":"飲み込みにくい・痛い、吐血、血の混じった便や黒い便 — 受診してください"},{"en":"With other acid reducers","ko":"다른 위산 억제제와 함께","ja":"他の胃酸抑制薬と一緒に"}],"ask_doctor":[{"en":"Heartburn for more than 3 months","ko":"3개월 넘은 속쓰림","ja":"3か月を超える胸やけ"},{"en":"Heartburn with lightheadedness, sweating or dizziness; chest or shoulder pain with shortness of breath, sweating, pain spreading to arms, neck or shoulders; frequent chest pain","ko":"어지럼·식은땀을 동반한 속쓰림, 숨참·식은땀·팔·목·어깨로 퍼지는 통증을 동반한 가슴·어깨 통증, 잦은 가슴 통증","ja":"ふらつき・冷や汗を伴う胸やけ、息切れ・冷や汗・腕や首や肩に広がる痛みを伴う胸や肩の痛み、頻繁な胸の痛み"},{"en":"Frequent wheezing (especially with heartburn), unexplained weight loss, nausea or vomiting, or stomach pain","ko":"잦은 쌕쌕거림(특히 속쓰림과 함께), 설명되지 않는 체중 감소, 메스꺼움·구토, 복통","ja":"頻繁なぜん鳴（特に胸やけと一緒）、原因不明の体重減少、吐き気・嘔吐、腹痛"},{"en":"Kidney disease","ko":"신장 질환","ja":"腎臓病"}],"ask_pharmacist":[{"en":"Any prescription medicine (acid reducers/antacids can interact with some)","ko":"처방약을 복용 중인 경우(위산 억제제·제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（胃酸を抑える薬・制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[{"en":"Heartburn continues or gets worse","ko":"속쓰림이 계속되거나 악화될 때","ja":"胸やけが続く・悪化する"},{"en":"You need it for more than 14 days","ko":"14일 넘게 필요할 때","ja":"14日を超えて必要"}],"key_warning":{"en":"Chest pain with sweating, shortness of breath, or pain spreading to the arm, neck or jaw may be a heart attack, not heartburn — call 911.","ko":"식은땀, 숨참, 팔·목·턱으로 퍼지는 통증을 동반한 가슴 통증은 속쓰림이 아니라 심장마비일 수 있습니다 — 911에 전화하세요.","ja":"冷や汗、息切れ、腕・首・あごに広がる痛みを伴う胸の痛みは胸やけではなく心臓発作かもしれません — 911に電話してください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["kidney"],"classes":["h2_blocker"],"supplement_note":null,"verified":"2026-10-22","id":"famotidine","kind":"otc","category":"stomach","name":{"en":"Famotidine","ko":"파모티딘","ja":"ファモチジン"},"uses":{"en":"Relieves heartburn from acid indigestion and sour stomach, and prevents it when taken before foods or drinks that cause it.","ko":"위산 과다·신트림으로 인한 속쓰림을 완화하고, 속쓰림을 일으키는 음식·음료 전에 먹으면 예방합니다.","ja":"胃酸過多・すっぱいげっぷによる胸やけをやわらげ、原因となる飲食の前に飲むと予防します。"},"sources":[{"title":"DailyMed — Pepcid AC Maximum Strength (famotidine 20 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=14406cd8-468b-403d-9be2-43decd304214"}]},{"aka":["Prilosec","PPI","proton pump inhibitor","양성자펌프억제제"],"brands":["Prilosec OTC","store brand omeprazole 20 mg"],"active":[{"ingredient":"omeprazole","strength":"20 mg per delayed-release tablet","purpose":{"en":"Acid reducer","ko":"위산 억제제","ja":"胃酸抑制薬"}}],"directions_adult":{"en":"Adults 18+: 1 tablet a day, every 24 hours, for 14 days. Swallow whole with water in the morning before eating; do not chew or crush.","ko":"18세 이상: 하루 1정, 24시간마다, 14일간. 아침 식사 전에 물과 함께 통째로 삼키고 씹거나 부수지 마세요.","ja":"18歳以上: 1日1錠を24時間ごとに14日間。朝食前に水で丸ごと飲み、かんだり砕いたりしないでください。"},"max_daily":{"en":"1 tablet a day. Repeat a 14-day course no more often than every 4 months unless a doctor directs.","ko":"하루 1정. 14일 요법은 의사 지시 없이 4개월에 한 번까지만 반복.","ja":"1日1錠。14日間の治療は、医師の指示がなければ4か月に1回まで。"},"children":{"en":"Under 18: ask a doctor. Heartburn in children may be a sign of a serious condition.","ko":"18세 미만: 의사에게 물어보세요. 아이의 속쓰림은 심각한 질환의 신호일 수 있습니다.","ja":"18歳未満: 医師に相談。子どもの胸やけは重い病気のサインのことがあります。"},"do_not_use":[{"en":"If allergic to omeprazole","ko":"오메프라졸에 알레르기가 있을 때","ja":"オメプラゾールにアレルギーがある"},{"en":"Trouble or pain swallowing, vomiting blood, or bloody or black stools — see a doctor","ko":"삼키기 어렵거나 아플 때, 피를 토할 때, 피가 섞이거나 검은 변 — 진료를 받으세요","ja":"飲み込みにくい・痛い、吐血、血の混じった便や黒い便 — 受診してください"},{"en":"Heartburn with lightheadedness, sweating or dizziness; chest or shoulder pain with shortness of breath, sweating, pain spreading to arms, neck or shoulders; frequent chest pain","ko":"어지럼·식은땀을 동반한 속쓰림, 숨참·식은땀·팔·목·어깨로 퍼지는 통증을 동반한 가슴·어깨 통증, 잦은 가슴 통증","ja":"ふらつき・冷や汗を伴う胸やけ、息切れ・冷や汗・腕や首や肩に広がる痛みを伴う胸や肩の痛み、頻繁な胸の痛み"}],"ask_doctor":[{"en":"Heartburn for more than 3 months","ko":"3개월 넘은 속쓰림","ja":"3か月を超える胸やけ"},{"en":"Frequent wheezing (especially with heartburn), unexplained weight loss, nausea or vomiting, or stomach pain","ko":"잦은 쌕쌕거림(특히 속쓰림과 함께), 설명되지 않는 체중 감소, 메스꺼움·구토, 복통","ja":"頻繁なぜん鳴（特に胸やけと一緒）、原因不明の体重減少、吐き気・嘔吐、腹痛"}],"ask_pharmacist":[{"en":"Any prescription medicine (acid reducers/antacids can interact with some)","ko":"처방약을 복용 중인 경우(위산 억제제·제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（胃酸を抑える薬・制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[{"en":"Heartburn continues or worsens, or you need it more than 14 days or more than one course every 4 months","ko":"속쓰림이 계속·악화되거나, 14일 넘게 또는 4개월에 2번 이상 필요할 때","ja":"胸やけが続く・悪化する、14日を超えて、または4か月に2回以上必要"},{"en":"Diarrhea, rash or joint pain","ko":"설사, 발진, 관절통","ja":"下痢、発疹、関節痛"},{"en":"Skin reddening, blisters or rash — stop and get medical help right away","ko":"피부 붉어짐, 물집, 발진 — 중단하고 즉시 진료","ja":"皮膚の赤み、水ぶくれ、発疹 — 中止してすぐ受診"}],"key_warning":{"en":"Chest pain with sweating, shortness of breath, or pain spreading to the arm, neck or jaw may be a heart attack, not heartburn — call 911.","ko":"식은땀, 숨참, 팔·목·턱으로 퍼지는 통증을 동반한 가슴 통증은 속쓰림이 아니라 심장마비일 수 있습니다 — 911에 전화하세요.","ja":"冷や汗、息切れ、腕・首・あごに広がる痛みを伴う胸の痛みは胸やけではなく心臓発作かもしれません — 911に電話してください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":[],"classes":["ppi"],"supplement_note":null,"verified":"2026-10-22","id":"omeprazole","kind":"otc","category":"stomach","name":{"en":"Omeprazole (14-day course)","ko":"오메프라졸(14일 요법)","ja":"オメプラゾール（14日間）"},"uses":{"en":"Treats frequent heartburn (2 or more days a week). Not for immediate relief — it may take 1 to 4 days for full effect.","ko":"잦은 속쓰림(주 2일 이상)을 치료합니다. 즉각적인 완화용이 아니며, 충분한 효과에 1~4일 걸릴 수 있습니다.","ja":"頻繁な胸やけ（週2日以上）の治療薬です。すぐ効く薬ではなく、十分な効果まで1〜4日かかることがあります。"},"sources":[{"title":"DailyMed — Prilosec OTC (omeprazole 20 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=77ed80a2-a482-4838-ac55-4865b5c31d9f"}]},{"aka":["Tums","antacid","제산제","制酸薬"],"brands":["Tums Extra Strength","store brand antacid"],"active":[{"ingredient":"calcium carbonate","strength":"750 mg per chewable tablet (Extra Strength)","purpose":{"en":"Antacid","ko":"제산제","ja":"制酸薬"}}],"directions_adult":{"en":"Adults and children 12+: chew 2 to 4 tablets as symptoms occur, or as a doctor directs.","ko":"12세 이상: 증상이 있을 때 2~4정을 씹어 드세요. 또는 의사 지시대로.","ja":"12歳以上: 症状があるとき2〜4錠をかんで飲む。または医師の指示どおり。"},"max_daily":{"en":"No more than 10 tablets in 24 hours (6 if pregnant). Do not use the maximum dose for more than 2 weeks unless a doctor supervises.","ko":"24시간에 10정(임신 중 6정)까지. 의사 감독 없이 최대 용량을 2주 넘게 쓰지 마세요.","ja":"24時間で10錠まで（妊娠中は6錠）。医師の管理なしに最大量を2週間を超えて使わないでください。"},"children":{"en":"The label gives directions only for ages 12 and up.","ko":"라벨에는 12세 이상 용법만 있습니다.","ja":"ラベルの用法は12歳以上のみです。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Any prescription medicine (acid reducers/antacids can interact with some)","ko":"처방약을 복용 중인 경우(위산 억제제·제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（胃酸を抑える薬・制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[{"en":"Symptoms last more than 2 weeks","ko":"증상이 2주 넘게 지속될 때","ja":"症状が2週間を超えて続く"}],"key_warning":{"en":"Antacids can change how some prescription medicines are absorbed — ask the pharmacist about timing.","ko":"제산제는 일부 처방약의 흡수를 바꿀 수 있습니다 — 복용 시간 간격을 약사에게 물어보세요.","ja":"制酸薬は一部の処方薬の吸収を変えることがあります — 飲む間隔を薬剤師に聞いてください。"},"older_adults":null,"pregnancy":{"en":"If pregnant, no more than 6 tablets in 24 hours.","ko":"임신 중에는 24시간에 6정까지.","ja":"妊娠中は24時間で6錠まで。"},"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"calcium-carbonate-antacid","kind":"otc","category":"stomach","name":{"en":"Calcium carbonate antacid","ko":"탄산칼슘 제산제","ja":"炭酸カルシウム制酸薬"},"uses":{"en":"Relieves heartburn, acid indigestion, sour stomach, and upset stomach from these.","ko":"속쓰림, 위산 과다, 신트림과 이로 인한 속 불편을 완화합니다.","ja":"胸やけ、胃酸過多、すっぱいげっぷと、それによる胃の不快感をやわらげます。"},"sources":[{"title":"DailyMed — Tums Extra Strength (calcium carbonate 750 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3988e3f8-b276-43a0-bdd3-01ddd422c986"}]},{"aka":["Imodium","anti-diarrheal","지사제","下痢止め"],"brands":["Imodium A-D","store brand anti-diarrheal"],"active":[{"ingredient":"loperamide hcl","strength":"2 mg per caplet","purpose":{"en":"Anti-diarrheal","ko":"지사제","ja":"止瀉薬"}}],"directions_adult":{"en":"Adults and children 12+: 2 caplets after the first loose stool, then 1 caplet after each later loose stool. Drink plenty of clear fluids.","ko":"12세 이상: 첫 묽은 변 후 2정, 이후 묽은 변마다 1정. 맑은 수분을 충분히 드세요.","ja":"12歳以上: 最初の軟便の後に2錠、その後は軟便ごとに1錠。透明な水分を十分にとってください。"},"max_daily":{"en":"No more than 4 caplets in 24 hours.","ko":"24시간에 4정까지.","ja":"24時間で4錠まで。"},"children":{"en":"Ages 6–11: follow the age/weight table on the package. Ages 2–5: ask a doctor. Under 2: do not use.","ko":"6~11세: 포장의 나이·체중 표를 따르세요. 2~5세: 의사에게 물어보세요. 2세 미만: 사용 금지.","ja":"6〜11歳: 箱の年齢・体重表に従う。2〜5歳: 医師に相談。2歳未満: 使用しない。"},"do_not_use":[{"en":"If you have had a rash or other allergic reaction to loperamide","ko":"로페라미드에 발진 등 알레르기 반응이 있었던 경우","ja":"ロペラミドで発疹などのアレルギー反応が出たことがある"},{"en":"If you have bloody or black stool","ko":"피가 섞이거나 검은 변이 있을 때","ja":"血の混じった便や黒い便がある"}],"ask_doctor":[{"en":"Fever or mucus in the stool","ko":"열, 변에 점액","ja":"発熱、便に粘液"},{"en":"A history of liver disease","ko":"간 질환 병력","ja":"肝臓病の既往"},{"en":"A history of abnormal heart rhythm","ko":"부정맥 병력","ja":"不整脈の既往"}],"ask_pharmacist":[{"en":"Any prescription medicine","ko":"처방약을 복용 중인 경우","ja":"処方薬を飲んでいる場合"}],"stop_use":[{"en":"Symptoms get worse or diarrhea lasts more than 2 days","ko":"증상이 악화되거나 설사가 2일 넘게 지속될 때","ja":"症状が悪化する、または下痢が2日を超えて続く"},{"en":"Your belly swells or bulges","ko":"배가 붓거나 불룩해질 때","ja":"おなかが張る・ふくらむ"}],"key_warning":{"en":"Taking more than directed can cause serious heart problems or death. In an overdose, call Poison Control (1-800-222-1222) right away. May cause tiredness, drowsiness or dizziness.","ko":"정해진 양보다 많이 먹으면 심각한 심장 문제나 사망을 일으킬 수 있습니다. 과다 복용 시 즉시 중독센터(1-800-222-1222)에 전화하세요. 피로, 졸음, 어지러움이 생길 수 있습니다.","ja":"決められた量より多く飲むと重い心臓の問題や死亡につながることがあります。飲みすぎたらすぐ中毒センター（1-800-222-1222）へ。だるさ、眠気、めまいが出ることがあります。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["liver","heart","sedation","children"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"loperamide","kind":"otc","category":"stomach","name":{"en":"Loperamide","ko":"로페라미드","ja":"ロペラミド"},"uses":{"en":"Controls symptoms of diarrhea, including travelers' diarrhea.","ko":"여행자 설사를 포함한 설사 증상을 조절합니다.","ja":"旅行者下痢を含む下痢の症状をおさえます。"},"sources":[{"title":"DailyMed — Imodium A-D (loperamide HCl 2 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=01da76d0-1979-4c45-9d39-c72ae4e4ffe2"}]},{"aka":["Pepto-Bismol","pink stomach medicine","펩토비스몰"],"brands":["Pepto-Bismol","Kaopectate","store brand stomach relief"],"active":[{"ingredient":"bismuth subsalicylate","strength":"262 mg per chewable tablet","purpose":{"en":"Upset stomach reliever / antidiarrheal","ko":"위장 불편 완화제/지사제","ja":"胃の不快感緩和薬・止瀉薬"}}],"directions_adult":{"en":"Adults and children 12+: chew or dissolve 2 tablets every ½ to 1 hour as needed. Use until diarrhea stops, but no more than 2 days. Drink plenty of clear fluids.","ko":"12세 이상: 필요하면 30분~1시간마다 2정을 씹거나 녹여 드세요. 설사가 멈출 때까지, 단 2일 이내. 맑은 수분을 충분히 드세요.","ja":"12歳以上: 必要に応じ30分〜1時間ごとに2錠をかむか溶かす。下痢が止まるまで、ただし2日まで。透明な水分を十分にとる。"},"max_daily":{"en":"No more than 8 doses (16 tablets) in 24 hours; no more than 2 days.","ko":"24시간에 8회(16정)까지, 2일 이내.","ja":"24時間で8回（16錠）まで、2日まで。"},"children":{"en":"Under 12: ask a doctor. Children and teenagers who have or are recovering from chickenpox or flu-like symptoms should not use this (Reye's syndrome).","ko":"12세 미만: 의사에게 물어보세요. 수두나 독감 같은 증상이 있거나 회복 중인 어린이·청소년은 쓰면 안 됩니다(라이 증후군).","ja":"12歳未満: 医師に相談。水ぼうそうやインフルエンザのような症状がある、または回復中の子ども・10代は使わないでください（ライ症候群）。"},"do_not_use":[{"en":"If allergic to salicylates, including aspirin, or taking other salicylate products","ko":"아스피린 등 살리실산염에 알레르기가 있거나 다른 살리실산염 제품을 먹고 있을 때","ja":"アスピリンなどサリチル酸系にアレルギーがある、または他のサリチル酸系製品を飲んでいる"},{"en":"An ulcer, a bleeding problem, or bloody or black stool","ko":"궤양, 출혈 문제, 피가 섞이거나 검은 변","ja":"潰瘍、出血の問題、血の混じった便や黒い便"}],"ask_doctor":[{"en":"Fever or mucus in the stool","ko":"열, 변에 점액","ja":"発熱、便に粘液"}],"ask_pharmacist":[{"en":"Medicine for blood thinning (anticoagulation), diabetes, gout or arthritis","ko":"혈액 희석(항응고), 당뇨, 통풍, 관절염 약","ja":"血液をさらさらにする薬（抗凝固薬）、糖尿病、痛風、関節炎の薬"}],"stop_use":[{"en":"Symptoms get worse or last more than 2 days","ko":"증상이 악화되거나 2일 넘게 지속될 때","ja":"症状が悪化する、または2日を超える"},{"en":"Ringing in the ears or loss of hearing","ko":"귀울림이나 청력 감소","ja":"耳鳴りや聞こえにくさ"}],"key_warning":{"en":"Contains a salicylate (aspirin relative) — do not combine with aspirin, and check with a pharmacist if you take a blood thinner. A dark tongue or stool is harmless and temporary.","ko":"살리실산염(아스피린 계열)이 들어 있습니다 — 아스피린과 함께 먹지 말고, 혈액 희석제를 먹고 있으면 약사에게 확인하세요. 혀나 변이 검게 되는 것은 일시적이고 무해합니다.","ja":"サリチル酸系（アスピリンの仲間）を含みます — アスピリンと併用せず、血液をさらさらにする薬を飲んでいれば薬剤師に確認を。舌や便が黒くなるのは一時的で無害です。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["bleeding","blood_thinner","diabetes","children"],"classes":["salicylate"],"supplement_note":null,"verified":"2026-10-22","id":"bismuth-subsalicylate","kind":"otc","category":"stomach","name":{"en":"Bismuth subsalicylate","ko":"차살리실산 비스무트","ja":"次サリチル酸ビスマス"},"uses":{"en":"Relieves travelers' diarrhea, diarrhea, and upset stomach from overeating and drinking, including heartburn, indigestion, nausea, gas, belching and fullness.","ko":"여행자 설사, 설사, 과식·과음으로 인한 속 불편(속쓰림, 소화불량, 메스꺼움, 가스, 트림, 더부룩함)을 완화합니다.","ja":"旅行者下痢、下痢、食べすぎ・飲みすぎによる胃の不快感（胸やけ、消化不良、吐き気、ガス、げっぷ、膨満感）をやわらげます。"},"sources":[{"title":"DailyMed — Pepto Bismol chewable tablets (bismuth subsalicylate 262 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=033bccc6-6e81-487f-91fe-9d7cc465e1b2"}]},{"aka":["MiraLAX","PEG","osmotic laxative","변비약","便秘薬"],"brands":["MiraLAX","store brand clearlax"],"active":[{"ingredient":"polyethylene glycol 3350","strength":"17 g per dose","purpose":{"en":"Osmotic laxative","ko":"삼투성 변비약","ja":"浸透圧性下剤"}}],"directions_adult":{"en":"Adults and children 17+: once a day, stir 17 g (one packet, or the cap filled to the line) into 4 to 8 oz of any drink until fully dissolved, then drink. Do not drink if there are clumps. Do not mix with starch-based thickeners.","ko":"17세 이상: 하루 1번, 17 g(1포 또는 뚜껑 표시선까지)을 음료 4~8온스(약 120~240 mL)에 완전히 녹여 마시세요. 덩어리가 있으면 마시지 마세요. 전분계 점도증진제와 섞지 마세요.","ja":"17歳以上: 1日1回、17 g（1包、またはキャップの線まで）を飲み物4〜8オンス（約120〜240 mL）に完全に溶かして飲む。かたまりがあれば飲まない。でんぷん系のとろみ剤と混ぜない。"},"max_daily":{"en":"Once a day; no more than 7 days.","ko":"하루 1번, 7일 이내.","ja":"1日1回、7日まで。"},"children":{"en":"16 and under: ask a doctor.","ko":"16세 이하: 의사에게 물어보세요.","ja":"16歳以下: 医師に相談。"},"do_not_use":[{"en":"If allergic to polyethylene glycol","ko":"폴리에틸렌글리콜에 알레르기가 있을 때","ja":"ポリエチレングリコールにアレルギーがある"},{"en":"If you have kidney disease, unless a doctor directs","ko":"신장 질환이 있으면(의사 지시가 없는 한)","ja":"腎臓病がある場合（医師の指示がない限り）"}],"ask_doctor":[{"en":"Nausea, vomiting or belly pain","ko":"메스꺼움, 구토, 복통","ja":"吐き気、嘔吐、腹痛"},{"en":"A sudden change in bowel habits lasting over 2 weeks","ko":"2주 넘게 지속된 갑작스러운 배변 습관 변화","ja":"2週間を超えて続く急な便通の変化"},{"en":"Irritable bowel syndrome","ko":"과민성 대장 증후군","ja":"過敏性腸症候群"}],"ask_pharmacist":[{"en":"Any prescription medicine","ko":"처방약을 복용 중인 경우","ja":"処方薬を飲んでいる場合"}],"stop_use":[{"en":"Rectal bleeding, or nausea, bloating, cramping or belly pain gets worse","ko":"항문 출혈, 또는 메스꺼움·더부룩함·경련·복통이 악화될 때","ja":"肛門からの出血、または吐き気・張り・けいれん・腹痛の悪化"},{"en":"Diarrhea","ko":"설사","ja":"下痢"},{"en":"You need a laxative for more than 1 week","ko":"변비약이 1주 넘게 필요할 때","ja":"下剤が1週間を超えて必要"}],"key_warning":{"en":"Rectal bleeding or worsening belly pain can be serious — stop and see a doctor.","ko":"항문 출혈이나 악화되는 복통은 심각할 수 있습니다 — 중단하고 진료를 받으세요.","ja":"肛門からの出血や悪化する腹痛は重大なことがあります — 中止して受診してください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["kidney"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"peg-3350","kind":"otc","category":"laxative","name":{"en":"Polyethylene glycol 3350 (PEG)","ko":"폴리에틸렌글리콜 3350","ja":"ポリエチレングリコール3350"},"uses":{"en":"Relieves occasional constipation. Generally produces a bowel movement in 1 to 3 days.","ko":"가끔 생기는 변비를 완화합니다. 보통 1~3일 안에 배변합니다.","ja":"ときどきの便秘をやわらげます。通常1〜3日で排便があります。"},"sources":[{"title":"DailyMed — MiraLAX (polyethylene glycol 3350) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d69ce3d4-7ca4-4fe3-b49e-6655e48d6963"}]},{"aka":["Senokot","stimulant laxative","센나","センナ"],"brands":["Senokot","store brand senna laxative"],"active":[{"ingredient":"sennosides","strength":"8.6 mg per tablet","purpose":{"en":"Stimulant laxative","ko":"자극성 변비약","ja":"刺激性下剤"}}],"directions_adult":{"en":"Adults and children 12+: start with 2 tablets once a day, preferably at bedtime.","ko":"12세 이상: 처음엔 하루 1번 2정, 가능하면 자기 전에.","ja":"12歳以上: 最初は1日1回2錠、なるべく就寝前に。"},"max_daily":{"en":"No more than 4 tablets twice a day; not longer than 1 week unless a doctor directs.","ko":"1회 4정, 하루 2번까지. 의사 지시 없이 1주 넘게 쓰지 마세요.","ja":"1回4錠を1日2回まで。医師の指示なく1週間を超えないこと。"},"children":{"en":"Ages 2–11: use the age table on the package. Under 2: ask a doctor.","ko":"2~11세: 포장의 나이별 표를 따르세요. 2세 미만: 의사에게 물어보세요.","ja":"2〜11歳: 箱の年齢表に従う。2歳未満: 医師に相談。"},"do_not_use":[{"en":"For longer than 1 week unless directed by a doctor","ko":"의사 지시 없이 1주 넘게","ja":"医師の指示なく1週間を超えて"}],"ask_doctor":[{"en":"Stomach pain, nausea or vomiting","ko":"복통, 메스꺼움, 구토","ja":"腹痛、吐き気、嘔吐"},{"en":"A sudden change in bowel habits lasting more than 2 weeks","ko":"2주 넘게 지속된 갑작스러운 배변 습관 변화","ja":"2週間を超えて続く急な便通の変化"}],"ask_pharmacist":[],"stop_use":[{"en":"Rectal bleeding, or no bowel movement after using it — may be serious","ko":"항문 출혈, 또는 복용 후에도 배변이 없을 때 — 심각할 수 있음","ja":"肛門からの出血、または使っても排便がない — 重大なことがあります"}],"key_warning":{"en":"Stimulant laxatives are for short-term use — no longer than 1 week unless a doctor directs. Rectal bleeding needs a doctor.","ko":"자극성 변비약은 짧게 쓰는 약입니다 — 의사 지시 없이 1주를 넘기지 마세요. 항문 출혈은 진료가 필요합니다.","ja":"刺激性下剤は短期間用です — 医師の指示なく1週間を超えないでください。肛門からの出血は受診が必要です。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":[],"classes":["stimulant_laxative"],"supplement_note":null,"verified":"2026-10-22","id":"senna","kind":"otc","category":"laxative","name":{"en":"Senna (sennosides)","ko":"센나(센노사이드)","ja":"センナ（センノシド）"},"uses":{"en":"Relieves occasional constipation; generally produces a bowel movement in 6 to 12 hours.","ko":"가끔 생기는 변비를 완화하며 보통 6~12시간 안에 배변합니다.","ja":"ときどきの便秘をやわらげ、通常6〜12時間で排便があります。"},"sources":[{"title":"DailyMed — Senna (sennosides 8.6 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f3a0938e-dbdb-4988-aa1e-78564948d6a0"}]},{"aka":["Dulcolax","stimulant laxative","둘코락스"],"brands":["Dulcolax","store brand bisacodyl"],"active":[{"ingredient":"bisacodyl","strength":"5 mg per tablet","purpose":{"en":"Stimulant laxative","ko":"자극성 변비약","ja":"刺激性下剤"}}],"directions_adult":{"en":"Adults and children 12+: 1 to 3 tablets once a day with a glass of water. Swallow whole — do not chew or crush. Do not take within 1 hour after an antacid or milk.","ko":"12세 이상: 하루 1번 1~3정을 물 한 컵과 함께. 씹거나 부수지 말고 통째로 삼키세요. 제산제나 우유를 먹은 뒤 1시간 안에는 먹지 마세요.","ja":"12歳以上: 1日1回1〜3錠を水と一緒に。かんだり砕いたりせず丸ごと飲む。制酸薬や牛乳の後1時間以内は飲まない。"},"max_daily":{"en":"3 tablets, once a day.","ko":"하루 1번, 3정까지.","ja":"1日1回、3錠まで。"},"children":{"en":"Ages 6–11: 1 tablet once a day. Under 6: ask a doctor.","ko":"6~11세: 하루 1번 1정. 6세 미만: 의사에게 물어보세요.","ja":"6〜11歳: 1日1回1錠。6歳未満: 医師に相談。"},"do_not_use":[{"en":"If you cannot swallow the tablet without chewing","ko":"씹지 않고 삼킬 수 없을 때","ja":"かまずに飲み込めない場合"}],"ask_doctor":[{"en":"Stomach pain, nausea or vomiting","ko":"복통, 메스꺼움, 구토","ja":"腹痛、吐き気、嘔吐"},{"en":"A s e","alcohol"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"meclizine","kind":"otc","category":"motion","name":{"en":"Meclizine","ko":"메클리진","ja":"メクリジン"},"uses":{"en":"Prevents and treats nausea, vomiting or dizziness from motion sickness.","ko":"멀미로 인한 메스꺼움, 구토, 어지러움을 예방·치료합니다.","ja":"乗り物酔いによる吐き気、嘔吐、めまいを予防・治療します。"},"sources":[{"title":"DailyMed — Bonine (meclizine HCl 25 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ad3d66ca-a52c-43ba-b9e2-6269b8a413a9"}]},{"aka":["Gas-X","anti-gas","가스제거제","ガス"],"brands":["Gas-X Extra Strength","store brand gas relief"],"active":[{"ingredient":"simethicone","strength":"125 mg per softgel","purpose":{"en":"Antigas","ko":"가스 제거제","ja":"消泡剤"}}],"directions_adult":{"en":"Adults and children 12+: swallow 1 or 2 softgels with water as needed, after meals and at bedtime.","ko":"12세 이상: 필요할 때 식후와 자기 전에 1~2캡슐을 물과 함께.","ja":"12歳以上: 必要に応じ食後と就寝前に1〜2カプセルを水で。"},"max_daily":{"en":"4 softgels in 24 hours unless a doctor directs.","ko":"의사 지시 없이 24시간에 4캡슐까지.","ja":"医師の指示がなければ24時間で4カプセルまで。"},"children":{"en":"The label gives directions only for ages 12 and up.","ko":"라벨에는 12세 이상 용법만 있습니다.","ja":"ラベルの用法は12歳以上のみです。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[],"key_warning":{"en":"Gas pain with fever, vomiting, or severe or lasting belly pain needs a doctor, not gas medicine.","ko":"열, 구토, 심하거나 오래가는 복통을 동반한 가스 통증은 가스약이 아니라 진료가 필요합니다.","ja":"発熱、嘔吐、強い・長引く腹痛を伴う場合はガス薬ではなく受診が必要です。"},"older_adults":null,"pregnancy":null,"flags":[],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"simethicone","kind":"otc","category":"stomach","name":{"en":"Simethicone (gas relief)","ko":"시메티콘(가스 완화)","ja":"シメチコン（ガス抜き）"},"uses":{"en":"Relieves pressure, bloating and fullness commonly called gas.","ko":"흔히 가스라고 하는 압박감, 더부룩함, 팽만감을 완화합니다.","ja":"いわゆるガスによる圧迫感、張り、膨満感をやわらげます。"},"sources":[{"title":"DailyMed — Gas-X Extra Strength (simethicone 125 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=fa4a3b07-591b-4445-aa67-b17ba1e67d5c"}]},{"aka":["Dramamine","motion sickness","멀미약","酔い止め"],"brands":["Dramamine Original Formula","store brand motion sickness relief"],"active":[{"ingredient":"dimenhydrinate","strength":"50 mg per tablet","purpose":{"en":"Antiemetic","ko":"구토 억제제","ja":"制吐薬"}}],"directions_adult":{"en":"Adults and children 12+: 1 to 2 tablets every 4 to 6 hours. Take the first dose ½ to 1 hour before travel.","ko":"12세 이상: 4~6시간마다 1~2정. 첫 복용은 출발 30분~1시간 전.","ja":"12歳以上: 4〜6時間ごとに1〜2錠。最初は出発30分〜1時間前に。"},"max_daily":{"en":"8 tablets in 24 hours.","ko":"24시간에 8정.","ja":"24時間で8錠。"},"children":{"en":"Ages 2–11: use the age table on the package (smaller doses). Under 2: only if a doctor directs.","ko":"2~11세: 포장의 나이별 표(더 적은 양)를 따르세요. 2세 미만: 의사 지시가 있을 때만.","ja":"2〜11歳: 箱の年齢表（少ない量）に従う。2歳未満: 医師の指示があるときのみ。"},"do_not_use":[],"ask_doctor":[{"en":"Glaucoma; a breathing problem such as emphysema or chronic bronchitis; trouble urinating from an enlarged prostate","ko":"녹내장, 폐기종·만성 기관지염 같은 호흡 문제, 전립선 비대로 인한 배뇨 곤란","ja":"緑内障、肺気腫・慢性気管支炎などの呼吸の問題、前立腺肥大による排尿困難"}],"ask_pharmacist":[{"en":"Sedatives or tranquilizers","ko":"진정제나 신경안정제","ja":"鎮静薬や精神安定薬"}],"stop_use":[],"key_warning":{"en":"Marked drowsiness may occur. Avoid alcohol; be careful driving. Alcohol, sedatives and tranquilizers can make dizziness worse.","ko":"심한 졸음이 올 수 있습니다. 술을 피하고 운전에 주의하세요. 술, 진정제, 신경안정제는 어지러움을 더 심하게 합니다.","ja":"強い眠気が出ることがあります。飲酒を避け、運転に注意。酒、鎮静薬、精神安定薬はめまいを強めます。"},"older_adults":null,"pregnancy":{"en":"Ask a doctor before use.","ko":"사용 전 의사에게 물어보세요.","ja":"使用前に医師に相談してください。"},"flags":["sedation","glaucoma","prostate","alcohol"],"classes":["sedating_antihistamine"],"supplement_note":null,"verified":"2026-10-22","id":"dimenhydrinate","kind":"otc","category":"motion","name":{"en":"Dimenhydrinate","ko":"디멘히드리네이트","ja":"ジメンヒドリナート"},"uses":{"en":"Prevents and treats nausea, vomiting or dizziness from motion sickness.","ko":"멀미로 인한 메스꺼움, 구토, 어지러움을 예방·치료합니다.","ja":"乗り物酔いによる吐き気、嘔吐、めまいを予防・治療します。"},"sources":[{"title":"DailyMed — Dramamine Original Formula (dimenhydrinate 50 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f9302a5a-295a-4501-9332-e3f5eb387362"}]},{"aka":["milk of magnesia","Phillips","수산화마그네슘","マグミット"],"brands":["Phillips' Milk of Magnesia","store brand milk of magnesia"],"active":[{"ingredient":"magnesium hydroxide","strength":"400 mg per 5 mL","purpose":{"en":"Saline laxative / antacid","ko":"염류성 변비약/제산제","ja":"塩類下剤・制酸薬"}}],"directions_adult":{"en":"Adults and children 12+ — laxative: 30 to 60 mL (2 to 4 tablespoons) once a day, preferably at bedtime, with a full glass (8 oz) of liquid. Antacid: 5 to 15 mL (1 to 3 teaspoons).","ko":"12세 이상 — 변비약: 하루 1번 30~60 mL(2~4큰술), 가능하면 자기 전, 물 한 컵(8온스)과 함께. 제산제: 5~15 mL(1~3작은술).","ja":"12歳以上 — 下剤: 1日1回30〜60 mL（大さじ2〜4）、なるべく就寝前にコップ1杯（8オンス）の水分と。制酸薬: 5〜15 mL（小さじ1〜3）。"},"max_daily":{"en":"Laxative: 60 mL in 24 hours; no more than 1 week.","ko":"변비약: 24시간에 60 mL, 1주 이내.","ja":"下剤: 24時間で60 mL、1週間まで。"},"children":{"en":"Laxative, ages 6–11: 15 to 30 mL. Under 6: ask a doctor. Antacid under 12: ask a doctor.","ko":"변비약 6~11세: 15~30 mL. 6세 미만: 의사에게 물어보세요. 제산제 12세 미만: 의사에게.","ja":"下剤 6〜11歳: 15〜30 mL。6歳未満: 医師に相談。制酸薬 12歳未満: 医師に相談。"},"do_not_use":[],"ask_doctor":[{"en":"Kidney disease, or a magnesium-restricted diet","ko":"신장 질환, 또는 마그네슘 제한 식이","ja":"腎臓病、またはマグネシウム制限食"},{"en":"Stomach pain, nausea or vomiting, or a sudden change in bowel habits lasting over 14 days","ko":"복통, 메스꺼움·구토, 14일 넘게 지속된 갑작스러운 배변 습관 변화","ja":"腹痛、吐き気・嘔吐、14日を超える急な便通の変化"}],"ask_pharmacist":[{"en":"Any prescription medicine (antacids can interact with some)","ko":"처방약을 복용 중인 경우(제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[{"en":"Rectal bleeding, or no bowel movement after using it","ko":"항문 출혈, 또는 복용 후에도 배변이 없을 때","ja":"肛門からの出血、または使っても排便がない"},{"en":"You need a laxative for more than 1 week","ko":"변비약이 1주 넘게 필요할 때","ja":"下剤が1週間を超えて必要"}],"key_warning":{"en":"Ask a doctor first if you have kidney disease — magnesium can build up.","ko":"신장 질환이 있으면 먼저 의사에게 물어보세요 — 마그네슘이 몸에 쌓일 수 있습니다.","ja":"腎臓病があれば先に医師に相談を — マグネシウムがたまることがあります。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["kidney"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"magnesium-hydroxide","kind":"otc","category":"laxative","name":{"en":"Milk of magnesia (magnesium hydroxide)","ko":"마그밀/수산화마그네슘","ja":"酸化マグネシウム系（水酸化マグネシウム）"},"uses":{"en":"Laxative: occasional constipation, usually within ½ to 6 hours. Antacid: heartburn, sour or upset stomach, acid indigestion.","ko":"변비약: 가끔 생기는 변비, 보통 30분~6시간 안에 배변. 제산제: 속쓰림, 신트림, 속 불편, 위산 과다.","ja":"下剤: ときどきの便秘、通常30分〜6時間で排便。制酸薬: 胸やけ、胃のむかつき、胃酸過多。"},"sources":[{"title":"DailyMed — Milk of Magnesia (magnesium hydroxide 400 mg/5 mL) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2de868a0-c652-473c-8b61-636083b7f757"}]},{"aka":["Maalox","Mylanta","liquid antacid","물 제산제"],"brands":["Maalox","Mylanta","store brand antacid liquid"],"active":[{"ingredient":"aluminum hydroxide","strength":"200 mg per 5 mL","purpose":{"en":"Antacid","ko":"제산제","ja":"制酸薬"}},{"ingredient":"magnesium hydroxide","strength":"200 mg per 5 mL","purpose":{"en":"Antacid","ko":"제산제","ja":"制酸薬"}},{"ingredient":"simethicone","strength":"20 mg per 5 mL","purpose":{"en":"Antigas","ko":"가스 제거제","ja":"消泡剤"}}],"directions_adult":{"en":"Shake well. Adults and children 12+: 2 to 4 teaspoons (10 to 20 mL) up to 4 times a day, or as a doctor directs.","ko":"잘 흔드세요. 12세 이상: 2~4작은술(10~20 mL), 하루 최대 4번, 또는 의사 지시대로.","ja":"よく振る。12歳以上: 小さじ2〜4（10〜20 mL）を1日4回まで、または医師の指示どおり。"},"max_daily":{"en":"16 teaspoons (80 mL) in 24 hours; do not use the maximum dose for more than 2 weeks unless a doctor directs.","ko":"24시간에 16작은술(80 mL). 의사 지시 없이 최대 용량을 2주 넘게 쓰지 마세요.","ja":"24時間で小さじ16（80 mL）。医師の指示なく最大量を2週間を超えて使わないこと。"},"children":{"en":"Under 12: ask a doctor.","ko":"12세 미만: 의사에게 물어보세요.","ja":"12歳未満: 医師に相談してください。"},"do_not_use":[],"ask_doctor":[{"en":"Kidney disease, or a magnesium-restricted diet","ko":"신장 질환, 또는 마그네슘 제한 식이","ja":"腎臓病、またはマグネシウム制限食"}],"ask_pharmacist":[{"en":"Any prescription medicine (antacids can interact with some)","ko":"처방약을 복용 중인 경우(제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[],"key_warning":{"en":"Ask a doctor first if you have kidney disease. Antacids can change how some prescription medicines are absorbed.","ko":"신장 질환이 있으면 먼저 의사에게 물어보세요. 제산제는 일부 처방약의 흡수를 바꿀 수 있습니다.","ja":"腎臓病があれば先に医師に相談を。制酸薬は一部の処方薬の吸収を変えることがあります。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":["kidney"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"al-mg-simethicone","kind":"otc","category":"stomach","name":{"en":"Antacid + anti-gas liquid (aluminum/magnesium hydroxide + simethicone)","ko":"제산·가스 제거 물약(수산화알루미늄·마그네슘+시메티콘)","ja":"制酸・ガス抜き液（水酸化アルミニウム・マグネシウム+シメチコン）"},"uses":{"en":"Relieves acid indigestion, heartburn, sour or upset stomach, and gas pressure and bloating.","ko":"위산 과다, 속쓰림, 신트림·속 불편, 가스로 인한 압박감과 더부룩함을 완화합니다.","ja":"胃酸過多、胸やけ、胃のむかつき、ガスによる圧迫感と張りをやわらげます。"},"sources":[{"title":"DailyMed — Maalox Antacid (aluminum hydroxide, magnesium hydroxide, simethicone) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=e2a14762-3860-44c3-a3ea-5dbc45f4b1d5"}]},{"aka":["oral rehydration solution","ORS","Pedialyte","dehydration","탈수","경구수액","経口補水液","脱水"],"brands":["Pedialyte","store brand oral electrolyte solution"],"active":[],"directions_adult":{"en":"Sip fluids often. Diarrhea medicines (loperamide, bismuth subsalicylate) treat symptoms only — fluids still come first. Do not use loperamide alone if you have bloody diarrhea or diarrhea with fever.","ko":"수분을 자주 조금씩 드세요. 지사제(로페라미드, 차살리실산 비스무트)는 증상만 줄일 뿐이며 수분 보충이 먼저입니다. 피가 섞인 설사나 열을 동반한 설사에는 로페라미드만 단독으로 쓰지 마세요.","ja":"こまめに少しずつ水分をとってください。下痢止め（ロペラミド、次サリチル酸ビスマス）は症状を抑えるだけで、まず水分補給です。血便や発熱を伴う下痢にロペラミドだけを使わないでください。"},"max_daily":null,"children":{"en":"Infants and young children dehydrate faster — start fluids early and call the child's doctor.","ko":"영유아는 더 빨리 탈수됩니다 — 일찍 수분을 주고 아이의 의사에게 연락하세요.","ja":"乳幼児は脱水になりやすいです — 早めに水分を与え、子どもの医師に連絡してください。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[],"stop_use":[{"en":"Bloody or black stool, or diarrhea with fever","ko":"피가 섞이거나 검은 변, 또는 열을 동반한 설사","ja":"血の混じった便や黒い便、または発熱を伴う下痢"},{"en":"Diarrhea lasting more than 2 days on OTC medicine, or more than 2 weeks in total","ko":"일반약을 써도 2일 넘게, 또는 전체로 2주 넘게 지속되는 설사","ja":"市販薬を使っても2日を超える、または全体で2週間を超える下痢"}],"key_warning":{"en":"Bloody diarrhea or diarrhea with fever needs a doctor. Young children and older adults dehydrate faster.","ko":"피가 섞인 설사나 열을 동반한 설사는 진료가 필요합니다. 어린아이와 노인은 더 빨리 탈수됩니다.","ja":"血便や発熱を伴う下痢は受診が必要です。幼い子どもと高齢者は脱水になりやすいです。"},"older_adults":null,"pregnancy":null,"flags":["children","seniors"],"classes":[],"supplement_note":null,"verified":"2026-10-22","id":"diarrhea-fluids","kind":"guide","category":"stomach","name":{"en":"Diarrhea — fluids first (oral rehydration)","ko":"설사 — 수분 보충이 먼저(경구 수액)","ja":"下痢 — まず水分補給（経口補水）"},"uses":{"en":"Diarrhea drains water and salts from the body. Replacing them matters most for young children, older adults and people with chronic illness. For mild diarrhea any liquid you like, including sports drinks, can keep you hydrated. For heavy fluid loss, an oral rehydration solution (ORS) is best. Large amounts of very sweet drinks such as soda can make diarrhea worse.","ko":"설사는 몸의 물과 염분을 빼앗습니다. 특히 어린아이, 노인, 만성질환자에게 보충이 중요합니다. 가벼운 설사에는 스포츠음료를 포함해 마시기 편한 음료면 됩니다. 수분 손실이 많으면 경구 수액(ORS)이 가장 좋습니다. 탄산음료처럼 아주 단 음료를 많이 마시면 설사가 심해질 수 있습니다.","ja":"下痢は体の水分と塩分を奪います。特に幼い子ども、高齢者、持病のある人では補給が大切です。軽い下痢ならスポーツドリンクを含め飲みやすいもので構いません。水分が大きく失われたときは経口補水液（ORS）が最適です。炭酸飲料のようなとても甘い飲み物を大量に飲むと下痢が悪化することがあります。"},"sources":[{"title":"CDC Yellow Book — Travelers' Diarrhea","url":"https://www.cdc.gov/yellow-book/hcp/preparing-international-travelers/travelers-diarrhea.html"},{"title":"DailyMed — Imodium A-D (loperamide) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=01da76d0-1979-4c45-9d39-c72ae4e4ffe2"},{"title":"DailyMed — Pepto Bismol (bismuth subsalicylate) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=033bccc6-6e81-487f-91fe-9d7cc465e1b2"}]},{"aka":["Nexium","PPI","proton pump inhibitor","넥시움"],"brands":["Nexium 24HR","store brand esomeprazole 20 mg"],"active":[{"ingredient":"esomeprazole","strength":"20 mg per delayed-release capsule","purpose":{"en":"Acid reducer","ko":"위산 억제제","ja":"胃酸抑制薬"}}],"directions_adult":{"en":"Adults 18+: 1 capsule a day, every 24 hours, for 14 days. Swallow whole with a glass of water in the morning before eating; do not crush or chew.","ko":"18세 이상: 하루 1캡슐, 24시간마다, 14일간. 아침 식사 전 물 한 컵과 통째로 삼키고 부수거나 씹지 마세요.","ja":"18歳以上: 1日1カプセルを24時間ごとに14日間。朝食前にコップ1杯の水で丸ごと飲み、砕いたりかんだりしない。"},"max_daily":{"en":"1 capsule a day. Repeat a 14-day course no more often than every 4 months unless a doctor directs.","ko":"하루 1캡슐. 14일 요법은 의사 지시 없이 4개월에 한 번까지만 반복.","ja":"1日1カプセル。14日間の治療は、医師の指示がなければ4か月に1回まで。"},"children":{"en":"Under 18: ask a doctor. Heartburn in children may be a sign of a serious condition.","ko":"18세 미만: 의사에게 물어보세요. 아이의 속쓰림은 심각한 질환의 신호일 수 있습니다.","ja":"18歳未満: 医師に相談。子どもの胸やけは重い病気のサインのことがあります。"},"do_not_use":[{"en":"If allergic to esomeprazole","ko":"에소메프라졸에 알레르기가 있을 때","ja":"エソメプラゾールにアレルギーがある"},{"en":"Trouble or pain swallowing, vomiting blood, or bloody or black stools — see a doctor","ko":"삼키기 어렵거나 아플 때, 피를 토할 때, 피가 섞이거나 검은 변 — 진료를 받으세요","ja":"飲み込みにくい・痛い、吐血、血の混じった便や黒い便 — 受診してください"},{"en":"Heartburn with lightheadedness, sweating or dizziness; chest or shoulder pain with shortness of breath, sweating, pain spreading to arms, neck or shoulders; frequent chest pain","ko":"어지럼·식은땀을 동반한 속쓰림, 숨참·식은땀·팔·목·어깨로 퍼지는 통증을 동반한 가슴·어깨 통증, 잦은 가슴 통증","ja":"ふらつき・冷や汗を伴う胸やけ、息切れ・冷や汗・腕や首や肩に広がる痛みを伴う胸や肩の痛み、頻繁な胸の痛み"}],"ask_doctor":[{"en":"Heartburn for more than 3 months","ko":"3개월 넘은 속쓰림","ja":"3か月を超える胸やけ"},{"en":"Frequent wheezing (especially with heartburn), unexplained weight loss, nausea or vomiting, or stomach pain","ko":"잦은 쌕쌕거림(특히 속쓰림과 함께), 설명되지 않는 체중 감소, 메스꺼움·구토, 복통","ja":"頻繁なぜん鳴（特に胸やけと一緒）、原因不明の体重減少、吐き気・嘔吐、腹痛"}],"ask_pharmacist":[{"en":"Any prescription medicine (acid reducers/antacids can interact with some)","ko":"처방약을 복용 중인 경우(위산 억제제·제산제는 일부 처방약과 상호작용할 수 있음)","ja":"処方薬を飲んでいる場合（胃酸を抑える薬・制酸薬は一部の処方薬と相互作用することがあります）"}],"stop_use":[{"en":"Heartburn continues or worsens, or you need it more than 14 days or more than one course every 4 months","ko":"속쓰림이 계속·악화되거나, 14일 넘게 또는 4개월에 2번 이상 필요할 때","ja":"胸やけが続く・悪化する、14日を超えて、または4か月に2回以上必要"},{"en":"Diarrhea, rash or joint pain","ko":"설사, 발진, 관절통","ja":"下痢、発疹、関節痛"},{"en":"Skin reddening, blisters or rash — stop and get medical help right away","ko":"피부 붉어짐, 물집, 발진 — 중단하고 즉시 진료","ja":"皮膚の赤み、水ぶくれ、発疹 — 中止してすぐ受診"}],"key_warning":{"en":"Chest pain with sweating, shortness of breath, or pain spreading to the arm, neck or jaw may be a heart attack, not heartburn — call 911.","ko":"식은땀, 숨참, 팔·목·턱으로 퍼지는 통증을 동반한 가슴 통증은 속쓰림이 아니라 심장마비일 수 있습니다 — 911에 전화하세요.","ja":"冷や汗、息切れ、腕・首・あごに広がる痛みを伴う胸の痛みは胸やけではなく心臓発作かもしれません — 911に電話してください。"},"older_adults":null,"pregnancy":{"en":"Ask a health professional before use.","ko":"사용 전 의료인에게 물어보세요.","ja":"使用前に医療専門家に相談してください。"},"flags":[],"classes":["ppi"],"supplement_note":null,"verified":"2026-10-22","id":"esomeprazole","kind":"otc","category":"stomach","name":{"en":"Esomeprazole (14-day course)","ko":"에소메프라졸(14일 요법)","ja":"エソメプラゾール（14日間）"},"uses":{"en":"Treats frequent heartburn (2 or more days a week). Not for immediate relief — it may take 1 to 4 days for full effect.","ko":"잦은 속쓰림(주 2일 이상)을 치료합니다. 즉각적인 완화용이 아니며, 충분한 효과에 1~4일 걸릴 수 있습니다.","ja":"頻繁な胸やけ（週2日以上）の治療薬です。すぐ効く薬ではなく、十分な効果まで1〜4日かかることがあります。"},"sources":[{"title":"DailyMed — Nexium 24HR (esomeprazole 20 mg) Drug Facts","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4513934d-0cf0-40fc-a348-b4e75a33b094"}]},{"aka":["melatonin gummies","sleep supplement","멜라토닌","メラトニン"],"brands":["Natrol","Nature Made Melatonin","store brand melatonin"],"active":[{"ingredient":"melatonin","strength":"varies by product (labels are often inaccurate)","purpose":{"en":"Hormone supplement","ko":"호르몬 보충제","ja":"ホルモンサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":{"en":"Ask a health care provider before giving it to a child. Many young children have swallowed flavored melatonin (gummies) — store it out of reach and sight.","ko":"아이에게 주기 전에 의료인에게 물어보세요. 많은 어린아이가 맛이 나는 멜라토닌(젤리)을 삼키는 사고가 있었습니다 — 보이지 않고 손이 닿지 않는 곳에 두세요.","ja":"子どもに与える前に医療者に相談を。多くの幼児が味つきメラトニン（グミ）を誤飲しています — 見えない・届かない所に保管してください。"},"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Blood thinners, or if you have epilepsy (needs medical supervision)","ko":"혈액 희석제, 또는 뇌전증이 있는 경우(의료 감독 필요)","ja":"血液をさらさらにする薬、またはてんかんがある場合（医療者の管理が必要）"}],"stop_use":[],"key_warning":{"en":"Keep melatonin gummies away from children. Older adults may feel drowsy the next day.","ko":"멜라토닌 젤리는 아이에게서 멀리 두세요. 노인은 다음 날 졸릴 수 있습니다.","ja":"メラトニングミは子どもから遠ざけてください。高齢者は翌日眠気が残ることがあります。"},"older_adults":null,"pregnancy":{"en":"Research in pregnancy and breastfeeding is lacking — talk with your provider.","ko":"임신·수유 중 연구가 부족합니다 — 의료인과 상의하세요.","ja":"妊娠・授乳中の研究は不足しています — 医療者に相談を。"},"flags":["sedation","seniors","children","blood_thinner"],"classes":[],"supplement_note":{"en":"Short-term use appears safe for most adults; side effects include headache, dizziness, nausea and sleepiness. It may stay active longer in older adults and cause daytime drowsiness; the American Academy of Sleep Medicine recommends against it in people with dementia. Tested products, including gummies, often contain much more or less than the label says. For chronic insomnia, cognitive behavioral therapy (CBT-I) is the recommended first treatment.","ko":"대부분의 성인에게 단기 사용은 안전해 보이며, 두통, 어지러움, 메스꺼움, 졸음이 생길 수 있습니다. 노인에게는 더 오래 작용해 낮 졸음을 일으킬 수 있고, 미국수면의학회는 치매 환자에게 쓰지 말 것을 권고합니다. 검사한 제품(젤리 포함)은 라벨보다 훨씬 많거나 적게 들어 있는 경우가 많습니다. 만성 불면증의 첫 치료로는 인지행동치료(CBT-I)가 권장됩니다.","ja":"多くの成人で短期使用は安全とみられ、頭痛、めまい、吐き気、眠気が出ることがあります。高齢者では長く作用して日中の眠気を起こすことがあり、米国睡眠医学会は認知症の人には使わないよう勧めています。調べた製品（グミを含む）はラベルより大幅に多い・少ないことがよくあります。慢性不眠の最初の治療には認知行動療法（CBT-I）が勧められます。"},"verified":"2026-10-22","id":"melatonin","category":"supplement_other","name":{"en":"Melatonin","ko":"멜라토닌","ja":"メラトニン"},"uses":{"en":"May help jet lag. Not recommended for long-term (chronic) insomnia; evidence for shift work is weak.","ko":"시차 적응에 도움이 될 수 있습니다. 만성 불면증에는 권장되지 않으며, 교대 근무에 대한 근거는 약합니다.","ja":"時差ぼけに役立つ可能性があります。慢性不眠には勧められず、交代勤務への根拠は弱いです。"},"sources":[{"title":"NCCIH — Melatonin: What You Need To Know","url":"https://www.nccih.nih.gov/health/melatonin-what-you-need-to-know"}],"kind":"supplement"},{"aka":["hypericum","세인트존스워트","セイヨウオトギリソウ"],"brands":["store brand St. John's wort"],"active":[{"ingredient":"st. john's wort (hypericum perforatum)","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"ANY prescription medicine — especially birth control pills, antidepressants, warfarin, heart medicines (digoxin), seizure medicines, HIV medicines, transplant medicines (cyclosporine), cancer medicines, or simvastatin","ko":"모든 처방약 — 특히 경구 피임약, 항우울제, 와파린, 심장약(디곡신), 경련약, HIV 약, 장기이식 약(사이클로스포린), 항암제, 심바스타틴","ja":"すべての処方薬 — 特に経口避妊薬、抗うつ薬、ワルファリン、心臓の薬（ジゴキシン）、てんかんの薬、HIVの薬、移植の薬（シクロスポリン）、抗がん剤、シンバスタチン"}],"stop_use":[],"key_warning":{"en":"Can make birth control pills, blood thinners, heart, HIV, transplant and cancer medicines stop working. Always tell your pharmacist you take it.","ko":"경구 피임약, 혈액 희석제, 심장약, HIV·장기이식·항암제의 효과를 없앨 수 있습니다. 먹고 있다면 반드시 약사에게 알리세요.","ja":"経口避妊薬、血液をさらさらにする薬、心臓・HIV・移植・抗がん剤を効かなくすることがあります。飲んでいることを必ず薬剤師に伝えてください。"},"older_adults":null,"pregnancy":{"en":"May be unsafe in pregnancy (possible birth defect risk).","ko":"임신 중 안전하지 않을 수 있습니다(선천 결손 위험 가능).","ja":"妊娠中は安全でない可能性があります（先天異常のリスク）。"},"flags":["blood_thinner","heart","pregnancy"],"classes":[],"supplement_note":{"en":"It can interact in dangerous, sometimes life-threatening ways with many medicines by weakening them. With some antidepressants it can cause serious serotonin side effects. Side effects: diarrhea, dizziness, trouble sleeping, restlessness, tingling skin, and severe sun reactions at high doses. Depression needs a clinician — do not use this instead of care.","ko":"많은 약의 효과를 떨어뜨려 위험하고 때로는 생명을 위협하는 상호작용을 일으킬 수 있습니다. 일부 항우울제와 함께 먹으면 심각한 세로토닌 부작용이 생길 수 있습니다. 부작용: 설사, 어지러움, 불면, 안절부절, 피부 저림, 고용량에서 심한 햇빛 반응. 우울증은 진료가 필요하며 이것으로 대신하지 마세요.","ja":"多くの薬の効果を弱め、危険で時に命にかかわる相互作用を起こすことがあります。一部の抗うつ薬と併用すると重いセロトニン関連の副作用が起こることがあります。副作用: 下痢、めまい、不眠、落ち着かなさ、皮膚のチクチク感、高用量で強い日光反応。うつは受診が必要で、これで代用しないでください。"},"verified":"2026-10-22","id":"st-johns-wort","category":"supplement_herbal","name":{"en":"St. John's wort","ko":"세인트존스워트(서양고추나물)","ja":"セントジョーンズワート"},"uses":{"en":"May help mild to moderate depression (about as well as standard antidepressants in studies up to 12 weeks). Unclear for severe depression.","ko":"가벼운~중등도 우울증에 도움이 될 수 있습니다(12주까지의 연구에서 표준 항우울제와 비슷). 심한 우울증에는 불분명합니다.","ja":"軽度〜中等度のうつに役立つ可能性があります（12週間までの研究で標準的な抗うつ薬と同程度）。重いうつには不明です。"},"sources":[{"title":"NCCIH — St. John's Wort","url":"https://www.nccih.nih.gov/health/st-johns-wort"}],"kind":"supplement"},{"aka":["lactobacillus","유산균","乳酸菌","Culturelle"],"brands":["Culturelle","Align","store brand probiotic"],"active":[{"ingredient":"live microorganisms (various strains)","strength":"varies by product","purpose":{"en":"Probiotic","ko":"프로바이오틱","ja":"プロバイオティクス"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":{"en":"Do not give to premature infants. Ask the child's doctor first.","ko":"미숙아에게 주지 마세요. 먼저 아이의 의사에게 물어보세요.","ja":"早産児には与えないでください。まず子どもの医師に相談を。"},"do_not_use":[],"ask_doctor":[{"en":"A weakened immune system or a serious illness","ko":"면역 저하나 중병","ja":"免疫の低下や重い病気"}],"ask_pharmacist":[],"stop_use":[],"key_warning":{"en":"Not for premature babies or people who are seriously ill or immunocompromised without a doctor's advice.","ko":"미숙아, 중병 또는 면역이 약한 사람은 의사 조언 없이 쓰지 마세요.","ja":"早産児、重い病気や免疫が弱い人は医師の助言なしに使わないでください。"},"older_adults":null,"pregnancy":null,"flags":["children"],"classes":[],"supplement_note":{"en":"Long history of apparently safe use in healthy people. Risk is higher with serious illness or a weakened immune system; the FDA warned in 2023 that premature infants given probiotics are at risk of severe, possibly fatal infections. Some products have contained microbes not listed on the label.","ko":"건강한 사람에게는 오랫동안 안전하게 쓰여 왔습니다. 중병이나 면역 저하가 있으면 위험이 더 크며, FDA는 2023년 미숙아에게 프로바이오틱스를 주면 심각하고 치명적일 수 있는 감염 위험이 있다고 경고했습니다. 일부 제품에는 라벨에 없는 미생물이 들어 있었습니다.","ja":"健康な人では長く安全に使われてきました。重い病気や免疫低下があるとリスクが高く、FDAは2023年、早産児にプロバイオティクスを与えると重い、命にかかわる感染の危険があると警告しました。ラベルにない微生物が入っていた製品もあります。"},"verified":"2026-10-22","id":"probiotics","category":"supplement_other","name":{"en":"Probiotics","ko":"프로바이오틱스(유산균)","ja":"プロバイオティクス"},"uses":{"en":"Taken with antibiotics, may lower the chance of antibiotic-associated diarrhea (moderate-quality evidence). Which strains, doses and who benefits are still unclear.","ko":"항생제와 함께 먹으면 항생제 관련 설사 가능성을 낮출 수 있습니다(중간 수준 근거). 어떤 균주, 용량, 누구에게 도움이 되는지는 아직 불분명합니다.","ja":"抗菌薬と一緒にとると抗菌薬関連下痢の可能性を下げるかもしれません（中程度の根拠）。どの菌株・量・誰に効くかはまだ不明です。"},"sources":[{"title":"NCCIH — Probiotics: What You Need To Know","url":"https://www.nccih.nih.gov/health/probiotics-what-you-need-to-know"}],"kind":"supplement"},{"aka":["curcumin","강황","울금","ウコン"],"brands":["store brand turmeric curcumin"],"active":[{"ingredient":"turmeric or curcumin","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Any medicine — some herbs and medicines interact","ko":"모든 약 — 일부 허브는 약과 상호작용함","ja":"すべての薬 — 一部のハーブは薬と相互作用します"}],"stop_use":[],"key_warning":{"en":"Liver injury has been reported. Stop if you notice dark urine or yellow skin or eyes.","ko":"간 손상이 보고되었습니다. 짙은 소변이나 피부·눈이 노래지면 중단하세요.","ja":"肝障害が報告されています。濃い色の尿や皮膚・白目の黄色に気づいたら中止を。"},"older_adults":null,"pregnancy":{"en":"Turmeric supplements may be unsafe in pregnancy.","ko":"임신 중 강황 보충제는 안전하지 않을 수 있습니다.","ja":"妊娠中のウコンのサプリは安全でない可能性があります。"},"flags":["liver","pregnancy"],"classes":[],"supplement_note":{"en":"Usual oral forms are likely safe at recommended amounts for up to 2–3 months; may cause nausea, reflux, stomach upset, diarrhea or constipation. Liver injury has been reported, especially with highly absorbable curcumin products. Stop and call your provider for tiredness, nausea, poor appetite, dark urine or yellow skin/eyes.","ko":"일반적인 경구 제품은 권장량으로 2~3개월까지는 안전할 가능성이 높으며, 메스꺼움, 역류, 속 불편, 설사, 변비가 생길 수 있습니다. 특히 흡수율을 높인 커큐민 제품에서 간 손상이 보고되었습니다. 피로, 메스꺼움, 식욕 저하, 짙은 소변, 피부·눈 황달이 있으면 중단하고 의료인에게 연락하세요.","ja":"一般的な飲み薬タイプは推奨量で2〜3か月までは安全とみられ、吐き気、逆流、胃の不快感、下痢、便秘が出ることがあります。特に吸収を高めたクルクミン製品で肝障害が報告されています。だるさ、吐き気、食欲低下、濃い色の尿、皮膚や白目の黄色があれば中止して医療者へ。"},"verified":"2026-10-22","id":"turmeric","category":"supplement_herbal","name":{"en":"Turmeric / curcumin","ko":"강황/커큐민","ja":"ウコン（ターメリック）/クルクミン"},"uses":{"en":"Early evidence for knee osteoarthritis pain and stiffness, but not enough to conclude it helps any condition.","ko":"무릎 골관절염 통증·뻣뻣함에 초기 근거가 있지만, 어떤 질환에 도움이 된다고 결론 내리기에는 부족합니다.","ja":"ひざの変形性関節症の痛みやこわばりに初期の根拠はありますが、どの病気に効くと結論するには不十分です。"},"sources":[{"title":"NCCIH — Turmeric","url":"https://www.nccih.nih.gov/health/turmeric"}],"kind":"supplement"},{"aka":["ginkgo biloba","은행잎","イチョウ"],"brands":["store brand ginkgo biloba"],"active":[{"ingredient":"ginkgo leaf extract","strength":"varies by product","purpose":{"en":"Herbal supplement","ko":"허브 보충제","ja":"ハーブサプリ"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Warfarin or other blood thinners (more bleeding), or any other medicine","ko":"와파린 등 혈액 희석제(출혈 증가), 또는 다른 약","ja":"ワルファリンなど血液をさらさらにする薬（出血が増える）、またはその他の薬"}],"stop_use":[],"key_warning":{"en":"May increase bleeding with blood thinners.","ko":"혈액 희석제와 함께 먹으면 출혈이 늘 수 있습니다.","ja":"血液をさらさらにする薬と一緒だと出血が増えることがあります。"},"older_adults":null,"pregnancy":{"en":"May be unsafe in pregnancy (early labor or extra bleeding at delivery).","ko":"임신 중 안전하지 않을 수 있습니다(조산이나 분만 시 출혈 증가).","ja":"妊娠中は安全でない可能性があります（早産や分娩時の出血増加）。"},"flags":["bleeding","blood_thinner","pregnancy"],"classes":[],"supplement_note":{"en":"Leaf extract is generally well tolerated; common side effects are dizziness, stomach upset and headache. Fresh ginkgo seeds are toxic when eaten.","ko":"잎 추출물은 대체로 잘 견디며, 흔한 부작용은 어지러움, 속 불편, 두통입니다. 생 은행 열매는 먹으면 독성이 있습니다.","ja":"葉のエキスはおおむね問題なく使え、よくある副作用はめまい、胃の不調、頭痛です。生のぎんなんを食べると有毒です。"},"verified":"2026-10-22","id":"ginkgo","category":"supplement_herbal","name":{"en":"Ginkgo","ko":"은행잎 추출물","ja":"イチョウ葉エキス"},"uses":{"en":"No conclusive evidence that it helps any condition. Large studies found it did not prevent dementia in older adults.","ko":"어떤 질환에도 확실한 효과 근거가 없습니다. 대규모 연구에서 노인의 치매를 예방하지 못했습니다.","ja":"どの病気にも確かな効果の根拠はありません。大規模研究で高齢者の認知症を予防しませんでした。"},"sources":[{"title":"NCCIH — Ginkgo","url":"https://www.nccih.nih.gov/health/ginkgo"}],"kind":"supplement"},{"aka":["glucosamine","chondroitin","joint supplement","관절 영양제","関節サプリ"],"brands":["Osteo Bi-Flex","Move Free","store brand glucosamine chondroitin"],"active":[{"ingredient":"glucosamine and/or chondroitin","strength":"varies by product","purpose":{"en":"Dietary supplement","ko":"건강기능 보충제","ja":"サプリメント"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Warfarin (bleeding risk)","ko":"와파린(출혈 위험)","ja":"ワルファリン（出血の危険）"}],"stop_use":[],"key_warning":{"en":"If you take warfarin, ask before using. People with diabetes should watch blood sugar.","ko":"와파린을 먹는다면 먼저 물어보세요. 당뇨가 있으면 혈당을 확인하세요.","ja":"ワルファリンを飲んでいれば先に相談を。糖尿病の人は血糖に注意してください。"},"older_adults":null,"pregnancy":{"en":"Little is known about safety in pregnancy or breastfeeding.","ko":"임신·수유 중 안전성은 거의 알려져 있지 않습니다.","ja":"妊娠・授乳中の安全性はほとんど分かっていません。"},"flags":["blood_thinner","diabetes"],"classes":[],"supplement_note":{"en":"No major safety problems in large studies. Both have been linked to more bleeding in people taking warfarin. Glucosamine may raise blood sugar in some people.","ko":"대규모 연구에서 큰 안전 문제는 없었습니다. 와파린 복용자에게서 둘 다 출혈 증가와 관련이 있었습니다. 글루코사민은 일부 사람의 혈당을 올릴 수 있습니다.","ja":"大規模研究で大きな安全上の問題はありませんでした。ワルファリンを飲む人ではどちらも出血の増加と関連しています。グルコサミンは一部の人で血糖を上げることがあります。"},"verified":"2026-10-22","id":"glucosamine-chondroitin","category":"supplement_other","name":{"en":"Glucosamine and chondroitin","ko":"글루코사민·콘드로이틴","ja":"グルコサミン・コンドロイチン"},"uses":{"en":"Taken for osteoarthritis. Results are mixed and expert guidelines disagree; the American College of Rheumatology recommends against them for knee osteoarthritis.","ko":"골관절염에 먹습니다. 연구 결과가 엇갈리고 전문가 지침도 다르며, 미국류마티스학회는 무릎 골관절염에 권하지 않습니다.","ja":"変形性関節症のためにとられます。結果はまちまちで専門家の指針も分かれ、米国リウマチ学会はひざの変形性関節症には勧めていません。"},"sources":[{"title":"NCCIH — Glucosamine and Chondroitin for Osteoarthritis: What You Need To Know","url":"https://www.nccih.nih.gov/health/glucosamine-and-chondroitin-for-osteoarthritis-what-you-need-to-know"}],"kind":"supplement"},{"aka":["CoQ10","ubiquinone","코큐텐","コエンザイム"],"brands":["store brand CoQ10"],"active":[{"ingredient":"coenzyme q10","strength":"varies by product","purpose":{"en":"Dietary supplement","ko":"건강기능 보충제","ja":"サプリメント"}}],"directions_adult":{"en":"No single label dose — follow your product's label and your clinician.","ko":"정해진 하나의 용량이 없습니다 — 제품 라벨과 담당 의료인의 안내를 따르세요.","ja":"決まった1つの量はありません — 製品のラベルと担当の医療者に従ってください。"},"max_daily":null,"children":null,"do_not_use":[],"ask_doctor":[],"ask_pharmacist":[{"en":"Warfarin, insulin, or cancer treatment","ko":"와파린, 인슐린, 암 치료","ja":"ワルファリン、インスリン、がん治療"}],"stop_use":[],"key_warning":{"en":"If you take warfarin or insulin, ask before using CoQ10.","ko":"와파린이나 인슐린을 쓰고 있다면 코엔자임 Q10 전에 물어보세요.","ja":"ワルファリンやインスリンを使っていれば、CoQ10の前に相談を。"},"older_adults":null,"pregnancy":null,"flags":["blood_thinner","diabetes"],"classes":[],"supplement_note":{"en":"No serious side effects reported; mild trouble sleeping or stomach upset can occur. It may interact with warfarin and insulin and may not be compatible with some cancer treatments.","ko":"심각한 부작용은 보고되지 않았고, 가벼운 불면이나 속 불편이 생길 수 있습니다. 와파린·인슐린과 상호작용할 수 있고 일부 암 치료와 맞지 않을 수 있습니다.","ja":"重い副作用は報告されていませんが、軽い不眠や胃の不調が起こることがあります。ワルファリンやインスリンと相互作用する可能性があり、一部のがん治療と合わないことがあります。"},"verified":"2026-10-22","id":"coq10","category":"supplement_other","name":{"en":"Coenzyme Q10 (CoQ10)","ko":"코엔자임 Q10","ja":"コエンザイムQ10"},"uses":{"en":"Research is inconclusive for heart failure, does not support it for statin muscle pain, and suggests no meaningful effect on blood pressure.","ko":"심부전에 대한 연구는 결론이 나지 않았고, 스타틴 근육통
