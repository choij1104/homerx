<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5F6B">
<meta name="description" content="HomeRx: a free offline guide to U.S. pharmacy OTC medicines and supplements, in English, Korean and Japanese.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>HomeRx</title>
<style>
:root{
  --counter:#E4ECE9; --panel:#FFFFFF; --ink:#000; --text:#18211F; --muted:#4C5A57;
  --rx:#0B5F6B; --rx-soft:#D3E7E9; --caution:#8A4300; --caution-bg:#FFF0D6;
  --stop:#9E1C17; --stop-bg:#FBE4E2; --ok:#1F6B3A; --line:#B9C7C3;
  --fs:17px; --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Hiragino Sans","Noto Sans JP","Yu Gothic",Arial,sans-serif;
  --label:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP",sans-serif;
}
:root[data-size="2"]{--fs:19px}
:root[data-size="3"]{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--counter);color:var(--text);font:400 var(--fs)/1.55 var(--font);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rx)}
:focus-visible{outline:3px solid var(--rx);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--rx);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 12px}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{font:800 1.25em/1 var(--label);letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;max-width:12em;font:500 .62em/1.3 var(--font);opacity:.85;letter-spacing:0}
.langs{display:flex;border:1.5px solid rgba(255,255,255,.7);border-radius:8px;overflow:hidden}
.langs button{background:none;border:0;color:#fff;padding:6px 9px;min-height:40px;font-weight:600;font-size:.8em;white-space:nowrap}
.langs button[aria-pressed="true"]{background:#fff;color:var(--rx)}
.iconbtn{background:none;border:0;color:#fff;min-width:44px;min-height:44px;font-size:1.3em}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:2px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;min-height:60px;font-size:.72em;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--rx)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
nav.tabs .badge{position:absolute;margin-left:22px;background:var(--stop);color:#fff;border-radius:9px;font-size:.8em;padding:0 5px;line-height:16px}

main{padding:20px 16px 24px}
section.view{display:none}
section.view.on{display:block}
h1,h2,h3{line-height:1.25;margin:0}
h1{font:800 1.45em/1.2 var(--label);letter-spacing:-.01em}
h2{font:800 1.15em/1.25 var(--label);margin:26px 0 10px}
p{margin:.4em 0}
.lead{color:var(--muted)}

/* search */
.search{display:flex;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:var(--radius);padding:0 12px;margin:12px 0}
.search input{flex:1;border:0;outline:0;background:none;padding:14px 8px;min-height:52px;font-size:1em}
.search svg{width:22px;height:22px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;min-height:40px;font-size:.88em;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.mine{background:var(--rx-soft);border-radius:var(--radius);padding:10px 12px;margin:6px 0 12px;font-size:.9em;display:flex;gap:10px;align-items:center}
.mine button{margin-left:auto;background:#fff;border:1.5px solid var(--rx);color:var(--rx);border-radius:8px;padding:6px 10px;font-weight:700;min-height:40px;white-space:nowrap}

/* list */
.list{list-style:none;margin:0;padding:0;background:#fff;border:2px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 14px;min-height:64px}
.row b{display:block;font-weight:700}
.row .sub{display:block;color:var(--muted);font-size:.86em;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:.74em;font-weight:700;border-radius:5px;padding:2px 7px;background:#EEF2F1;color:var(--muted)}
.tag.c{background:var(--caution-bg);color:var(--caution)}
.tag.s{background:var(--stop-bg);color:var(--stop)}
.tag.k{background:var(--rx-soft);color:var(--rx)}
.count{color:var(--muted);font-size:.85em;margin:8px 2px}
.empty{background:#fff;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted)}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--counter);overflow-y:auto;display:none;padding-bottom:40px}
.sheet.on{display:block}
.sheet .bar{position:sticky;top:0;background:var(--counter);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px;z-index:2}
.sheet .bar .wrap{display:flex;align-items:center;gap:8px}
.back{background:none;border:0;min-height:44px;font-weight:700;color:var(--rx);padding:0 4px}
.sheet h1{margin:14px 0 2px}
.brands{color:var(--muted);font-size:.92em}

/* the Drug Facts panel — the one loud element */
.facts{background:#fff;border:3px solid var(--ink);margin:16px 0;padding:0 12px 6px;font-family:var(--label)}
.facts .title{font:900 1.7em/1 var(--label);letter-spacing:-.02em;padding:10px 0 6px;border-bottom:7px solid var(--ink)}
.facts .title small{font:600 .42em/1.2 var(--font);letter-spacing:0;display:block;margin-top:4px;color:var(--muted)}
.facts .blk{border-bottom:2px solid var(--ink);padding:8px 0}
.facts .blk:last-child{border-bottom:0}
.facts h3{font:800 1em/1.3 var(--label);margin:0 0 3px}
.facts h4{font:700 .95em/1.3 var(--label);margin:8px 0 2px}
.facts .ai{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.facts .ai span:last-child{font-weight:400;text-align:right}
.facts ul{margin:2px 0 4px;padding-left:1.15em}
.facts li{margin:2px 0}
.facts .warn-lead{background:var(--stop-bg);color:var(--stop);font-weight:700;padding:8px 10px;margin:6px 0;border-left:5px solid var(--stop)}
.facts .hit{background:var(--caution-bg);outline:2px solid var(--caution);outline-offset:1px;border-radius:2px}
.facts table{border-collapse:collapse;width:100%;font-size:.95em}
.facts td{border-top:1px solid var(--ink);padding:5px 4px;vertical-align:top}
.facts td:first-child{font-weight:700;width:38%}

.note{background:#fff;border-left:5px solid var(--rx);border-radius:0 var(--radius) var(--radius) 0;padding:10px 12px;margin:12px 0}
.note.c{border-color:var(--caution);background:var(--caution-bg)}
.note.s{border-color:var(--stop);background:var(--stop-bg)}
.note h3{font-size:1em;margin-bottom:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius);border:2px solid var(--rx);background:#fff;color:var(--rx);font-weight:700;padding:10px 12px;min-height:52px;text-align:center;text-decoration:none}
.btn.solid{background:var(--rx);color:#fff}
.btn.wide{grid-column:1/-1}
.btn.red{border-color:var(--stop);background:var(--stop);color:#fff}
.src{font-size:.85em;color:var(--muted)}
.src ol{padding-left:1.2em;margin:4px 0}
.src a{word-break:break-word}

/* show-the-pharmacist card */
.show{position:fixed;inset:0;z-index:60;background:#fff;display:none;padding:calc(24px + env(safe-area-inset-top)) 20px 30px;overflow:auto}
.show.on{display:block}
.show .q{font:700 1.6em/1.3 var(--label);margin:12px 0 20px}
.show .med{font:900 2em/1.15 var(--label);border-top:7px solid var(--ink);border-bottom:2px solid var(--ink);padding:10px 0;margin:10px 0}
.show .tr{color:var(--muted);font-size:1.05em}

/* cabinet */
.alert{border-radius:var(--radius);padding:12px 14px;margin:8px 0;border:2px solid}
.alert.s{border-color:var(--stop);background:var(--stop-bg)}
.alert.c{border-color:var(--caution);background:var(--caution-bg)}
.alert.ok{border-color:var(--ok);background:#E3F2E8}
.alert b{display:block}
.cab li{display:flex;align-items:center;gap:8px;padding:10px 12px}
.cab .nm{flex:1;min-width:0}
.cab input[type=date]{border:1.5px solid var(--line);border-radius:8px;padding:6px;background:#fff;font-size:.85em;max-width:150px}
.x{background:none;border:0;color:var(--stop);font-weight:800;min-width:44px;min-height:44px;font-size:1.1em}
.exp{font-size:.8em;font-weight:700}
.exp.s{color:var(--stop)} .exp.c{color:var(--caution)}

/* conditions */
.conds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cond{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:10px;min-height:52px;font-size:.92em}
.cond input{width:22px;height:22px;accent-color:var(--rx);flex:none}

/* learn */
.acc{background:#fff;border:2px solid var(--ink);border-radius:var(--radius);margin:10px 0;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:14px;min-height:56px;font-weight:800;font-family:var(--label);display:flex;justify-content:space-between;gap:10px}
.acc>button::after{content:"+";font-size:1.3em;line-height:1}
.acc>button[aria-expanded="true"]::after{content:"−"}
.acc .body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.acc>button[aria-expanded="true"]+.body{display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:.8em;display:flex;align-items:center;justify-content:center}
.phr{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin:8px 0;width:100%;text-align:left}
.phr b{display:block;font-size:1.05em}
.phr span{color:var(--muted);font-size:.9em}

/* help */
.call{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:var(--radius);padding:14px;margin:10px 0;text-decoration:none;color:var(--text);min-height:76px}
.call .n{font:900 1.5em/1 var(--label);color:var(--stop);min-width:5.2em}
.call.p .n{color:var(--rx)}
.call span{font-size:.92em}

/* home finder */
.hb{padding:12px 14px}
.hb .local{font-weight:800;font-size:1.05em}
.st{display:inline-block;font-size:.75em;font-weight:800;border-radius:5px;padding:2px 7px;margin-top:4px}
.st.same{background:#E3F2E8;color:var(--ok)} .st.sim{background:var(--caution-bg);color:var(--caution)} .st.no{background:var(--stop-bg);color:var(--stop)}
.hb .go{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hb .go button{background:var(--rx-soft);color:var(--rx);border:0;border-radius:7px;padding:6px 10px;font-weight:700;font-size:.85em;min-height:38px}

/* gate */
.gate{position:fixed;inset:0;z-index:80;background:var(--counter);overflow-y:auto;display:none;padding:calc(18px + env(safe-area-inset-top)) 0 30px}
.gate.on{display:block}
.gate .box{background:#fff;border:3px solid var(--ink);padding:16px;margin-top:12px}
.gate label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.gate label input{width:24px;height:24px;flex:none;accent-color:var(--rx);margin-top:2px}
.gate .em{background:var(--stop-bg);border-left:5px solid var(--stop);padding:10px;margin:12px 0;font-weight:600}
.btn:disabled{opacity:.45}
footer{font-size:.82em;color:var(--muted);padding:20px 0 10px;border-top:1px solid var(--line);margin-top:30px}

@media (min-width:700px){.conds{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{.top,nav.tabs,.actions,.bar{display:none!important}.sheet{position:static;display:block}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">HomeRx<small data-t="tagline"></small></div>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="ko">한국어</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button>
  </div>
</div></header>

<main class="wrap">
  <!-- FIND -->
  <section class="view on" id="v-find" aria-labelledby="h-find">
    <h1 id="h-find" data-t="findTitle"></h1>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span class="sr" data-t="searchLabel"></span><input id="q" type="search" autocomplete="off" enterkeyhint="search"></label>
    <div class="chips" id="cats" role="group"></div>
    <div class="mine" id="mineBar"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="list" id="results"></ul>
  </section>

  <!-- CABINET -->
  <section class="view" id="v-cab" aria-labelledby="h-cab">
    <h1 id="h-cab" data-t="cabTitle"></h1>
    <p class="lead" data-t="cabLead"></p>
    <div id="cabAlerts"></div>
    <ul class="list cab" id="cabList"></ul>
    <h2 data-t="condTitle"></h2>
    <p class="lead" data-t="condLead"></p>
    <div class="conds" id="conds"></div>
    <p class="src" data-t="privateNote"></p>
  </section>

  <!-- FROM HOME -->
  <section class="view" id="v-home" aria-labelledby="h-home">
    <h1 id="h-home" data-t="homeTitle"></h1>
    <p class="lead" data-t="homeLead"></p>
    <div class="chips" id="homeTabs" role="group"></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span class="sr" data-t="searchLabel"></span><input id="hq" type="search" autocomplete="off"></label>
    <ul class="list" id="homeList"></ul>
    <p class="src" data-t="homeNote"></p>
  </section>

  <!-- LEARN -->
  <section class="view" id="v-learn" aria-labelledby="h-learn">
    <h1 id="h-learn" data-t="learnTitle"></h1>
    <div id="learn"></div>
  </section>

  <!-- HELP -->
  <section class="view" id="v-help" aria-labelledby="h-help">
    <h1 id="h-help" data-t="helpTitle"></h1>
    <a class="call" href="tel:911"><span class="n">911</span><span data-t="call911"></span></a>
    <a class="call" href="tel:18002221222"><span class="n">1-800-<br>222-1222</span><span data-t="callPoison"></span></a>
    <a class="call" href="tel:988"><span class="n">988</span><span data-t="call988"></span></a>
    <h2 data-t="urgentTitle"></h2>
    <p class="lead" data-t="urgentIntro"></p>
    <div class="note s"><h3 data-t="urgent1Title"></h3><ul id="u911"></ul></div>
    <div class="note c"><h3 data-t="urgent2Title"></h3><ul id="uCare"></ul></div>
    <h2 data-t="settingsTitle"></h2>
    <div class="chips" id="sizes" role="group" aria-label="Text size"></div>
    <button class="btn wide" id="reGate" style="margin-top:10px" data-t="showNotice"></button>
    <footer>
      <p data-t="footerDisclaimer"></p>
      <p data-t="footerSources"></p>
      <p><span data-t="dataReviewed"></span> <span id="reviewed"></span> · v<span id="ver"></span></p>
      <p>© 2026 HAKOYA LLC · <a href="mailto:admin@hakoyallc.com">admin@hakoyallc.com</a> · <a href="privacy.html" data-t="privacy"></a></p>
    </footer>
  </section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-view="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-t="navFind"></span></button>
  <button data-view="cab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16M10 7.5h4M10 16.5h4"/></svg><span data-t="navCab"></span><span class="badge" id="cabBadge" hidden></span></button>
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><span data-t="navHome"></span></button>
  <button data-view="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h7"/></svg><span data-t="navLearn"></span></button>
  <button data-view="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span data-t="navHelp"></span></button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="bar"><div class="wrap"><button class="back" id="closeSheet" data-t="back"></button></div></div>
  <div class="wrap" id="detail"></div>
</div>

<div class="show" id="show" role="dialog" aria-modal="true">
  <div class="wrap" id="showBody"></div>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="wrap">
    <div class="langs" role="group" aria-label="Language" style="background:var(--rx);display:inline-flex">
      <button data-lang="ko">한국어</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button>
    </div>
    <div class="box">
      <h1 id="gTitle" data-t="gateTitle"></h1>
      <p data-t="gateP1"></p><p data-t="gateP2"></p><p data-t="gateP3"></p>
      <ul><li data-t="gateLi1"></li><li data-t="gateLi2"></li><li data-t="gateLi3"></li></ul>
      <div class="em" data-t="emergencyLine"></div>
      <label><input type="checkbox" class="gc"><span data-t="gateC1"></span></label>
      <label><input type="checkbox" class="gc"><span data-t="gateC2"></span></label>
      <label><input type="checkbox" class="gc"><span data-t="gateC3"></span></label>
      <label><input type="checkbox" class="gc"><span data-t="gateC4"></span></label>
      <button class="btn solid wide" id="gateGo" disabled data-t="gateButton" style="width:100%;margin-top:12px"></button>
    </div>
  </div>
</div>

  set(k,v){try{localStorage.setItem("homerx2."+k,JSON.stringify(v))}catch(e){}}
};
const navLang=(navigator.language||"ko").slice(0,2);
let lang = store.get("lang", ["ko","en","ja"].includes(navLang)?navLang:"en");
let view = "find", cat = "all", query = "", homeCountry = "KR", homeQuery = "";
let cabinet = store.get("cabinet", []);     // [{id, exp}]

const FLAGS = ["seniors","bp","heart","kidney","liver","stomach","bleeding","blood_thinner","diabetes","glaucoma","prostate","thyroid","asthma","pregnancy","alcohol"];

const E = DATA.entries, BY = Object.fromEntries(E.map(e=>[e.id,e]));
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o=>o==null?"":(typeof o==="string"?o:(o[lang]||o.en||""));
const T = k=>{const v=UI[lang][k];return v===undefined?(UI.en[k]===undefined?(V1&&V1[lang]&&V1[lang][k])||k:UI.en[k]):v};

/* ---------- language & text ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.querySelectorAll("[data-t]").forEach(el=>{const v=T(el.dataset.t); if(typeof v==="string") el.textContent=v;});
  $("#q").placeholder = T("searchPh"); $("#hq").placeholder = lang==="ja"?"ロキソニン、イブ、ガスター…":lang==="ko"?"타이레놀, 게보린, 판콜…":"Tylenol, Loxonin, Geworin…";
  renderAll();
}
function setLang(l){lang=l;store.set("lang",l);applyLang();}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* ---------- search ---------- */
function norm(s){return String(s||"").toLowerCase().normalize("NFKC").replace(/[\s\-·・,.()]/g,"")}
const INDEX = E.map(e=>{
  const parts=[e.id,e.name&&e.name.en,e.name&&e.name.ko,e.name&&e.name.ja,...(e.aka||[]),...(e.brands||[]),...(e.active||[]).map(a=>a.ingredient),
    L(e.uses), e.uses&&e.uses.ko, e.uses&&e.uses.ja, e.uses&&e.uses.en];
  (DATA.home||[]).forEach(h=>{ if((h.us_match||[]).some(m=>(e.active||[]).some(a=>a.ingredient===m))) parts.push(h.product.local,h.product.en); });
  return {id:e.id, name:norm([e.name&&e.name.en,e.name&&e.name.ko,e.name&&e.name.ja,...(e.brands||[]),...(e.aka||[])].join("|")), all:norm(parts.join("|"))};
});
function search(){
  const q=norm(query);
  let list=E.filter(e=>cat==="all"||e.category===cat);
  if(q){
    const score=new Map();
    INDEX.forEach(x=>{ if(x.name.includes(q)) score.set(x.id,2); else if(x.all.includes(q)) score.set(x.id,1); });
    list=list.filter(e=>score.has(e.id)).sort((a,b)=>score.get(b.id)-score.get(a.id));
  }
  return list;
}

/* ---------- find ---------- */
function renderCats(){
  const cats=["all",...Object.keys(UI.en.cat).filter(c=>E.some(e=>e.category===c))];
  $("#cats").innerHTML=cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===cat}">${esc(c==="all"?T("catAll"):UI[lang].cat[c])}</button>`).join("");
}
$("#cats").addEventListener("click",ev=>{const b=ev.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;renderCats();renderResults();});
$("#q").addEventListener("input",ev=>{query=ev.target.value;renderResults();});

function myHits(e){return (e.flags||[]).filter(f=>conds.includes(f)||(f==="blood_thinner"&&conds.includes("bleeding")))}
function renderMine(){
  const bar=$("#mineBar");
  if(!conds.length){bar.innerHTML=`<span>${esc(T("mineNone"))}</span><button data-go="cab">${esc(T("mineEdit"))}</button>`;}
  else{bar.innerHTML=`<span>${esc(T("mineSome")(conds.map(f=>UI[lang].flag[f]).join(", ")))}</span><button data-go="cab">${esc(T("mineChange"))}</button>`;}
}
$("#mineBar").addEventListener("click",ev=>{if(ev.target.closest("[data-go]"))go("cab");});
function row(e){
  const hits=myHits(e), inC=cabinet.some(c=>c.id===e.id);
  const tags=[];
  if(e.kind==="supplement")tags.push(`<span class="tag">${esc(T("factsSupp").split(" (")[0])}</span>`);
  hits.forEach(f=>tags.push(`<span class="tag c">⚠ ${esc(UI[lang].flag[f])}</span>`));
  if(inC)tags.push(`<span class="tag k">${esc(T("inCab"))}</span>`);
  const sub=[(e.brands||[]).slice(0,3).join(", "), lang!=="en"?e.name.en:""].filter(Boolean).join(" · ");
  return `<li><button class="row" data-id="${e.id}"><b>${esc(L(e.name))}</b><span class="sub">${esc(sub)}</span>${tags.length?`<span class="tags">${tags.join("")}</span>`:""}</button></li>`;
}
function renderResults(){
  const list=search();
  $("#count").textContent=T("results")(list.length);
  $("#results").innerHTML=list.length?list.map(row).join(""):"";
  $("#results").hidden=!list.length;
  if(!list.length) $("#count").textContent=T("noResults");
}
$("#results").addEventListener("click",ev=>{const b=ev.target.closest("[data-id]");if(b)openDetail(b.dataset.id);});

/* ---------- detail ---------- */
function li(arr,cls){
  if(!arr||!arr.length)return "";
  return "<ul>"+arr.map(x=>{const t=L(x);const hit=cls&&cls(x);return `<li${hit?' class="hit"':""}>${esc(t)}</li>`}).join("")+"</ul>";
}
function openDetail(id){
  const e=BY[id]; if(!e)return;
  const hits=myHits(e), sup=e.kind==="supplement", guide=e.kind==="guide";
  const h=[];
  h.push(`<h1 id="dName">${esc(L(e.name))}</h1>`);
  const names=[lang!=="en"?e.name.en:"",...(e.aka||[])].filter(Boolean);
  if(names.length)h.push(`<p class="brands">${esc(T("alsoCalled"))}: ${esc(names.join(", "))}</p>`);
  if((e.brands||[]).length)h.push(`<p class="brands">${esc(T("seenAs"))}: ${esc(e.brands.join(", "))}</p>`);
  if(hits.length)h.push(`<div class="note c"><h3>${esc(T("forYou"))}</h3><p>${esc(hits.map(f=>UI[lang].flag[f]).join(", "))}</p></div>`);
  h.push(`<div class="facts"><div class="title">${esc(guide?T("factsGuide"):sup?T("factsSupp"):T("factsDrug"))}<small>${esc(T("factsNote"))}</small></div>`);
  if((e.active||[]).length){
    h.push(`<div class="blk"><div class="ai"><span>${esc(T("active"))}</span><span>${esc(T("purpose"))}</span></div>`+
      e.active.map(a=>`<div class="ai" style="font-weight:400"><span>${esc(a.ingredient)}${a.strength?" "+esc(a.strength):""}</span><span>${esc(L(a.purpose))}</span></div>`).join("")+`</div>`);
  }
  if(e.uses)h.push(`<div class="blk"><h3>${esc(T("uses"))}</h3><p>${esc(L(e.uses))}</p></div>`);
  const w=[];
  if(e.key_warning)w.push(`<div class="warn-lead">${esc(L(e.key_warning))}</div>`);
  const flagged=x=>{const s=(x.en||"").toLowerCase();return hits.some(f=>(KEYS[f]||[]).some(k=>s.includes(k)));};
  if((e.do_not_use||[]).length)w.push(`<h4>${esc(T("doNotUse"))}</h4>`+li(e.do_not_use,flagged));
  if((e.ask_doctor||[]).length)w.push(`<h4>${esc(T("askDoctor"))}</h4>`+li(e.ask_doctor,flagged));
  if((e.ask_pharmacist||[]).length)w.push(`<h4>${esc(T("askPharm"))}</h4>`+li(e.ask_pharmacist,flagged));
  if((e.stop_use||[]).length)w.push(`<h4>${esc(T("stopUse"))}</h4>`+li(e.stop_use));
  if(e.pregnancy)w.push(`<h4>${esc(T("pregnancy"))}</h4><p>${esc(L(e.pregnancy))}</p>`);
  if(!sup&&!guide)w.push(`<p><b>${esc(T("keepAway"))}</b></p>`);
  if(w.length)h.push(`<div class="blk"><h3>${esc(T("warnings"))}</h3>${w.join("")}</div>`);
  const d=[];
  if(e.directions_adult)d.push(`<tr><td>${esc(sup?T("intake"):T("adults"))}</td><td>${esc(L(e.directions_adult))}</td></tr>`);
  if(e.max_daily)d.push(`<tr><td>${esc(sup?T("upper"):T("maxDay"))}</td><td>${esc(L(e.max_daily))}</td></tr>`);
  if(e.children)d.push(`<tr><td>${esc(T("children"))}</td><td>${esc(L(e.children))}</td></tr>`);
  if(d.length)h.push(`<div class="blk"><h3>${esc(T("directions"))}</h3><table>${d.join("")}</table></div>`);
  h.push(`</div>`);
  if(e.supplement_note)h.push(`<div class="note"><h3>${esc(T("evidence"))}</h3><p>${esc(L(e.supplement_note))}</p></div>`);
  if(e.older_adults)h.push(`<div class="note${conds.includes("seniors")?" c":""}"><h3>${esc(T("older"))}</h3><p>${esc(L(e.older_adults))}</p></div>`);
  const inC=cabinet.some(c=>c.id===e.id);
  h.push(`<div class="actions"><button class="btn ${inC?"":"solid"}" id="addCab" ${guide?"hidden":""}>${esc(inC?T("inCab"):T("addCab"))}</button><button class="btn" id="showBtn">${esc(T("showPharm"))}</button></div>`);
  if((e.sources||[]).length)h.push(`<div class="src"><b>${esc(T("sources"))}</b><ol>${e.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ol><p>${esc(T("verified"))}: ${esc(e.verified||"")}</p></div>`);
  $("#detail").innerHTML=h.join("");
  $("#addCab")&&$("#addCab").addEventListener("click",()=>{toggleCab(e.id);openDetail(e.id);});
  $("#showBtn").addEventListener("click",()=>showPharm(e));
  $("#sheet").classList.add("on"); $("#sheet").scrollTop=0; document.body.style.overflow="hidden";
  history.pushState({sheet:id},"");
  $("#closeSheet").focus();
}
const KEYS={bp:["blood pressure"],heart:["heart"],kidney:["kidney"],liver:["liver"],stomach:["stomach","ulcer","bleeding problem"],bleeding:["bleeding","blood thinn","anticoagul","warfarin"],
  blood_thinner:["blood thinn","anticoagul","warfarin"],diabetes:["diabetes"],glaucoma:["glaucoma"],prostate:["prostate","urinat"],thyroid:["thyroid"],asthma:["asthma"],
  pregnancy:["pregnan","breast"],alcohol:["alcohol","drinks"],seniors:["65","older"]};

function showPharm(e){
  const ing=(e.active||[]).map(a=>a.ingredient).join(" + ");
  const mine=conds.length?`<p style="margin-top:16px"><b>My conditions:</b> ${esc(conds.map(f=>UI.en.flag[f]).join(", "))}</p>`:"";
  const others=cabinet.filter(c=>c.id!==e.id&&BY[c.id]).map(c=>BY[c.id].name.en);
  const oth=others.length?`<p><b>I also have:</b> ${esc(others.join(", "))}</p>`:"";
  $("#showBody").innerHTML=`<div class="med">${esc(e.name.en)}${ing&&ing.toLowerCase()!==e.name.en.toLowerCase()?`<br><span style="font-size:.55em;font-weight:600">${esc(ing)}</span>`:""}</div>
    <p class="q">${esc(UI.en.showQ)}</p>${mine}${oth}<p class="tr">${esc(T("showTr"))}</p>
    <button class="btn solid wide" id="showX" style="width:100%;margin-top:20px">${esc(T("showClose"))}</button>`;
  $("#show").classList.add("on"); history.pushState({show:1},"");

/* ---------- cabinet ---------- */
function toggleCab(id){ if(cabinet.some(c=>c.id===id)) cabinet=cabinet.filter(c=>c.id!==id); else cabinet.push({id,exp:""}); store.set("cabinet",cabinet); renderBadge(); }
function cabChecks(){
  const items=cabinet.map(c=>BY[c.id]).filter(Boolean), out=[];
  const byIng={}; items.forEach(e=>(e.active||[]).forEach(a=>{(byIng[a.ingredient]=byIng[a.ingredient]||new Set()).add(L(e.name))}));
  Object.entries(byIng).forEach(([i,s])=>{ if(s.size>1) out.push({lvl:"s",txt:T("dupIng")(i,[...s].join(", "))}); });
  const byCls={}; items.forEach(e=>(e.classes||[]).forEach(c=>{(byCls[c]=byCls[c]||new Set()).add(L(e.name))}));
  ["nsaid","decongestant","ppi","h2_blocker","stimulant_laxative","acetaminophen","salicylate"].forEach(c=>{
    const s=byCls[c]; if(s&&s.size>1){ const dupI=out.some(o=>o.lvl==="s"&&[...s].every(n=>o.txt.includes(n))); if(!dupI) out.push({lvl:"c",txt:T("dupClass")(UI[lang].cls[c],[...s].join(", "))}); }
  });
  const nsaidLike=new Set([...(byCls.nsaid||[]),...(byCls.salicylate||[])]);
  if(nsaidLike.size>1 && !(byCls.nsaid&&byCls.nsaid.size>1) && !(byCls.salicylate&&byCls.salicylate.size>1)) out.push({lvl:"c",txt:T("dupClass")(UI[lang].cls.nsaid+" / "+UI[lang].cls.salicylate,[...nsaidLike].join(", "))});
  const sed=new Set([...(byCls.sedating_antihistamine||[]),...(byCls.sleep_aid||[])]);
  if(sed.size>1) out.push({lvl:"s",txt:T("sedate")([...sed].join(", "))});
  items.forEach(e=>{const h=myHits(e); if(h.length) out.push({lvl:"c",txt:T("matchFlag")(L(e.name),h.map(f=>UI[lang].flag[f]).join(", "))});});
  return {items,out};
}
function expState(d){ if(!d)return ""; const days=(new Date(d+"T00:00:00")-new Date())/864e5; return days<0?"s":days<60?"c":""; }
function renderCab(){
  const {items,out}=cabChecks();
  $("#cabAlerts").innerHTML = !items.length?"":(out.length?out.map(o=>`<div class="alert ${o.lvl}" role="${o.lvl==="s"?"alert":"status"}">${esc(o.txt)}</div>`).join(""):`<div class="alert ok">${esc(T("cabOk"))}</div>`);
  $("#cabList").innerHTML = items.length? cabinet.filter(c=>BY[c.id]).map(c=>{const e=BY[c.id],st=expState(c.exp);
    return `<li><div class="nm"><button class="row" style="padding:0;min-height:44px" data-id="${e.id}"><b>${esc(L(e.name))}</b></button>
      <label class="src">${esc(T("expires"))} <input type="date" data-exp="${e.id}" value="${esc(c.exp)}"></label>
      ${st?`<span class="exp ${st}">${esc(st==="s"?T("expired"):T("expSoon"))}</span>`:""}</div>
      <button class="x" data-rm="${e.id}" aria-label="${esc(T("remove"))}">✕</button></li>`}).join("") : `<li class="empty" style="border:0">${esc(T("cabEmpty"))}</li>`;
  $("#conds").innerHTML=FLAGS.map(f=>`<label class="cond"><input type="checkbox" value="${f}" ${conds.includes(f)?"checked":""}><span>${esc(UI[lang].flag[f])}</span></label>`).join("");
  renderBadge();
}
$("#cabList").addEventListener("click",ev=>{const r=ev.target.closest("[data-rm]"); if(r){toggleCab(r.dataset.rm);renderCab();return;} const o=ev.target.closest("[data-id]"); if(o)openDetail(o.dataset.id);});
$("#cabList").addEventListener("change",ev=>{const i=ev.target.closest("[data-exp]"); if(!i)return; const c=cabinet.find(c=>c.id===i.dataset.exp); if(c){c.exp=i.value;store.set("cabinet",cabinet);renderCab();}});
$("#conds").addEventListener("change",ev=>{const f=ev.target.value; conds=ev.target.checked?[...new Set([...conds,f])]:conds.filter(x=>x!==f); store.set("conds",conds); renderCab(); renderMine();});
function renderBadge(){const n=cabinet.length?cabChecks().out.filter(o=>o.lvl==="s").length:0; const b=$("#cabBadge"); b.hidden=!n; b.textContent=n;}

function renderHome(){
  $("#homeTabs").innerHTML=[["KR",lang==="ja"?"韓国":lang==="ko"?"한국":"Korea"],["JP",lang==="ja"?"日本":lang==="ko"?"일본":"Japan"]].map(([c,n])=>`<button class="chip" data-hc="${c}" aria-pressed="${c===homeCountry}">${esc(n)}</button>`).join("");
  const q=norm(homeQuery);
  const list=(DATA.home||[]).filter(h=>h.country===homeCountry).filter(h=>!q||norm([h.product.local,h.product.en,h.maker,...h.ingredients.map(i=>i.name_en)].join("|")).includes(q));
  $("#homeList").innerHTML=list.map(h=>{
    const st=h.us_status==="same_ingredient_otc"?["same","stSame"]:h.us_status==="similar_ingredient_otc"?["sim","stSim"]:["no","stNo"];
    const hm=h.us_match||[]; const cand=E.filter(e=>e.kind==="otc"&&hm.some(m=>(e.active||[]).some(a=>a.ingredient===m)));
    const pure=cand.filter(e=>(e.active||[]).every(a=>hm.includes(a.ingredient)));
    const targets=(pure.length?pure:cand).slice(0,4);
    return `<li class="hb"><div class="local">${esc(h.product.local)}</div><div class="sub" style="color:var(--muted);font-size:.86em">${esc(h.product.en)}${h.maker?" · "+esc(h.maker):""}</div>
      <div style="margin-top:6px;font-size:.92em">${h.ingredients.map(i=>esc(i.name_en+(i.amount?" "+i.amount:""))).join(", ")}</div>
      <span class="st ${st[0]}">${esc(T(st[1]))}</span><p style="font-size:.92em">${esc(L(h.note))}</p>
      ${targets.length?`<div class="go">${targets.map(e=>`<button data-id="${e.id}">${esc(L(e.name))}</button>`).join("")}</div>`:""}${(h.sources||[]).map(s=>`<div style="font-size:.8em;margin-top:6px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join("")}</li>`;}).join("")||`<li class="empty" style="border:0">${esc(T("noResults"))}</li>`;
}
$("#homeTabs").addEventListener("click",ev=>{const b=ev.target.closest("[data-hc]");if(b){homeCountry=b.dataset.hc;renderHome();}});
$("#hq").addEventListener("input",ev=>{homeQuery=ev.target.value;renderHome();});
$("#homeList").addEventListener("click",ev=>{const b=ev.target.closest("[data-id]");if(b)openDetail(b.dataset.id);});

/* ---------- learn ---------- */
function acc(title,body){return `<div class="acc"><button aria-expanded="false">${esc(title)}</button><div class="body">${body}</div></div>`}
function renderLearn(){
  const v=V1||{}; const vs=(v[lang]||v.en||{});
  const olderBody=`<p>${esc(vs.olderIntro||"")}</p>`+[1,2,3,4].map(n=>`<h3 style="margin-top:10px;font-size:1em">${esc(vs["older"+n+"Title"]||"")}</h3><p>${esc(vs["older"+n]||"")}</p>`).join("");
  const suppBody=`<p>${esc(vs.suppIntro||"")}</p><ul><li>${esc(vs.suppNote1||"")}</li><li>${esc(vs.suppNote2||"")}</li><li>${esc(vs.suppNote3||"")}</li></ul>`;
  const phr=(v.phrases||[]).map(p=>`<button class="phr" data-phr="${esc(p.en)}"><b>${esc(p.en)}</b><span>${esc(lang==="en"?"":p[lang])}</span></button>`).join("");
  $("#learn").innerHTML=
    acc(T("labelTitle"),`<p>${esc(T("labelLead"))}</p><ol class="steps">${LEARN.label.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ol>`)+
    acc(T("olderTitle"),olderBody)+
    acc(T("suppTitle"),suppBody)+
    acc(T("measureTitle"),`<ul>${LEARN.measure.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`)+
    acc(T("disposeTitle"),`<ul>${LEARN.dispose.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`)+
    acc(T("phraseTitle"),`<p>${esc(vs.phraseIntro||"")}</p>${phr}`)+
    `<div class="src"><b>${esc(T("sources"))}</b><ol>${LEARN.learnSources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ol></div>`;
  const u=(v.urgentLists&&v.urgentLists[lang])||{urgent911:[],urgentCare:[]};
  $("#u911").innerHTML=u.urgent911.map(x=>`<li>${esc(x)}</li>`).join(""); $("#uCare").innerHTML=u.urgentCare.map(x=>`<li>${esc(x)}</li>`).join("");
}
$("#learn").addEventListener("click",ev=>{
  const b=ev.target.closest(".acc>button"); if(b){b.setAttribute("aria-expanded",b.getAttribute("aria-expanded")!=="true");return;}
  const p=ev.target.closest("[data-phr]"); if(p){ $("#showBody").innerHTML=`<p class="q" style="font-size:2em">${esc(p.dataset.phr)}</p><button class="btn solid wide" id="showX" style="width:100%">${esc(T("showClose"))}</button>`; $("#show").classList.add("on"); history.pushState({show:1},""); $("#showX").addEventListener("click",()=>history.back()); }
});

/* ---------- help / settings ---------- */
let size=store.get("size",1);
function renderSizes(){ document.documentElement.dataset.size=size; $("#sizes").innerHTML=[1,2,3].map(n=>`<button class="chip" data-size="${n}" aria-pressed="${n===size}">${esc(T("size"+n))}</button>`).join(""); }
$("#sizes").addEventListener("click",ev=>{const b=ev.target.closest("[data-size]");if(b){size=+b.dataset.size;store.set("size",size);renderSizes();}});
$("#reGate").addEventListener("click",()=>openGate());

/* ---------- nav ---------- */
function go(v){view=v;document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.view===v)&&b.setAttribute("aria-current","page"));
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(v==="cab")renderCab(); window.scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));

/* ---------- gate ---------- */
function openGate(){ $("#gate").classList.add("on"); document.querySelectorAll(".gc").forEach(c=>c.checked=false); $("#gateGo").disabled=true; }
document.querySelectorAll(".gc").forEach(c=>c.addEventListener("change",()=>{$("#gateGo").disabled=![...document.querySelectorAll(".gc")].every(x=>x.checked);}));
$("#gateGo").addEventListener("click",()=>{store.set("agreed",DATA.version);$("#gate").classList.remove("on");});

function renderAll(){renderCats();renderMine();renderResults();renderCab();renderHome();renderLearn();renderSizes();
  $("#reviewed").textContent=DATA.reviewed; $("#ver").textContent=DATA.version;}

go("find"); applyLang();
if(store.get("agreed","")!==DATA.version) openGate();
</script>
</body>
</html>
